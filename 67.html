   GAME FLOW
   ========================================================================= */

function addNews(type,subject,body,clubId,extra){
  if(clubId!=null && clubId!==G.userClub && type!=='world') return;
  G.inbox.unshift(Object.assign({id:hash(subject+body+G.day+Math.random()),type,subject,body,
    date:new Date(G.date.getTime()),read:false},extra||{}));
  G.unread++;
  if(G.inbox.length>260)G.inbox.pop();
}

function fixturesOn(d){ return G.fixtures.filter(f=>!f.played && sameDay(f.date,d)) }
function nextUserFixture(){
  return G.fixtures.filter(f=>!f.played&&(f.home===G.userClub||f.away===G.userClub))
    .sort((a,b)=>a.date-b.date)[0];
}

/** Advance one day. Returns 'match' if the user's game is up. */
function advanceDay(){
  const todays = fixturesOn(G.date);
  const mine = todays.find(f=>f.home===G.userClub||f.away===G.userClub);
  if(mine && !mine.__handled) return {type:'match',fixture:mine};
  playDay(todays);
  endOfDay();
  G.date = addDays(G.date,1); G.day++;
  startOfDay();
  return {type:'day'};
}

function playDay(todays){
  todays.forEach(f=>{
    if(f.played) return;
    const M=fastSim(f.home,f.away,f.comp);
    recordResult(f,M);
  });
}

function recordResult(f,M){
  f.played=true; f.score=[M.score[0],M.score[1]];
  const H=G.clubs[f.home],A=G.clubs[f.away];
  const res={comp:f.comp,div:f.div,home:f.home,away:f.away,score:M.score.slice(),
    date:new Date(f.date.getTime()),scorers:M.scorers.map(s=>({side:s.side,min:s.min,name:s.name,pen:s.pen})),
    stats:M.stats,round:f.round};
  G.results.push(res);
  f.result=res;

  if(f.comp==='league'){
    applyLeague(H,A,M.score[0],M.score[1]);
    gateReceipts(H,A);
  } else if(f.comp==='UCL'||f.comp==='UEL'||f.comp==='UECL'){
    const c=G.competitions[f.comp];
    if(c.stage==='league'){
      const th=c.table[f.home],ta=c.table[f.away];
      if(th&&ta){
        th.p++;ta.p++;th.gf+=M.score[0];th.ga+=M.score[1];ta.gf+=M.score[1];ta.ga+=M.score[0];
        if(M.score[0]>M.score[1]){th.w++;ta.l++;th.pts+=3}
        else if(M.score[0]<M.score[1]){ta.w++;th.l++;ta.pts+=3}
        else{th.d++;ta.d++;th.pts++;ta.pts++}
      }
    }
    gateReceipts(H,A);
    const prize={UCL:2.4e6,UEL:9e5,UECL:4e5}[f.comp];
    H.balance+=prize;A.balance+=prize;
  } else {
    gateReceipts(H,A);
  }
  // form strings
  [[H,M.score[0],M.score[1]],[A,M.score[1],M.score[0]]].forEach(([c,g,ga])=>{
    c.form.push(g>ga?'W':g<ga?'D':'L');
    if(g<ga)c.form[c.form.length-1]='L'; else if(g===ga)c.form[c.form.length-1]='D';
    if(c.form.length>8)c.form.shift();
    c.morale=clamp(c.morale + (g>ga?5:g<ga?-5:0),20,100);
  });
  if(f.home===G.userClub||f.away===G.userClub) postMatchReport(f,M);
}

function applyLeague(H,A,hg,ag){
  H.p++;A.p++;H.gf+=hg;H.ga+=ag;A.gf+=ag;A.ga+=hg;
  if(hg>ag){H.w++;A.l++;H.pts+=3}
  else if(hg<ag){A.w++;H.l++;A.pts+=3}
  else{H.d++;A.d++;H.pts++;A.pts++}
}

function gateReceipts(H,A){
  const att=Math.round(H.capacity*(0.62+ (H.morale/100)*0.3 + RND()*0.1));
  const rev=Math.min(att,H.capacity)*(H.div===0?46:H.div===1?26:H.div===2?19:15);
  H.balance+=rev; H.lastAtt=Math.min(att,H.capacity);
}

/* ---- table ------------------------------------------------------------ */
function leagueTable(div){
  return G.clubs.filter(c=>c.div===div)
    .slice().sort((a,b)=> b.pts-a.pts || (b.gf-b.ga)-(a.gf-a.ga) || b.gf-a.gf || a.name.localeCompare(b.name));
}
function positionOf(clubId){
  const c=G.clubs[clubId];
  return leagueTable(c.div).findIndex(x=>x.id===clubId)+1;
}

/* ---- daily ticks ------------------------------------------------------ */
function startOfDay(){
  const d=G.date;
  // recovery, injuries, suspensions, contracts
  G.players.forEach(p=>{
    const club=G.clubs[p.club]; if(!club)return;
    const nf=(p.attrs['Natural Fitness']||10);
    p.cond=Math.min(100,p.cond + 3.2 + nf*0.26 - (p.age>31?0.9:0));
    if(p.inj){
      p.inj.days--;
      if(p.inj.days<=0){
        const wasLong=p.inj.total>25;
        p.inj=null; p.sharp=Math.max(25,p.sharp-(wasLong?40:12));
        if(p.club===G.userClub) addNews('medical','Return to fitness',p.name+' has recovered and is available for selection.',p.club);
      }
    } else if(p.sharp<100){ p.sharp=Math.min(100,p.sharp+0.7) }
    if(p.morale<70)p.morale=Math.min(70,p.morale+0.35);
    if(p.morale>70)p.morale=Math.max(70,p.morale-0.15);
  });

  // cup rounds
  ['efl','fa'].forEach(k=>{
    const c=G.competitions[k];
    if(c.winner)return;
    const rd=c.rounds[c.stage];
    if(rd && d>rd.date && !G.fixtures.some(f=>f.comp===k&&f.round===c.stage&&!f.played)){
      advanceCup(k);
    }
  });
  ['UCL','UEL','UECL'].forEach(advanceEuroIfDue);

  // transfer window
  const inWin = (d>=new Date(G.season,5,10)&&d<=new Date(G.season,8,1)) || (d>=new Date(G.season+1,0,1)&&d<=new Date(G.season+1,1,2));
  if(inWin!==G.window.open){
    G.window.open=inWin;
    addNews('world','Transfer window '+(inWin?'opens':'closes'),
      inWin?'The transfer window is now open. Deals can be agreed until it shuts.'
           :'The transfer window has closed. No further permanent business until it reopens.',null);
  }
  if(inWin && d.getDay()!==0 && RND()<0.75) aiTransferTick();
  if(G.window.open && RND()<0.32) incomingBid();
  dealTick();
  checkYouthIntake();
  weeklyTick();
  seasonChecks();
}

function endOfDay(){
  G.players.forEach(p=>{ if(p.susp>0 && p.__playedToday){p.susp--} p.__playedToday=false });
  // suspensions tick down on matchdays for that club
  G.fixtures.filter(f=>f.played&&sameDay(f.date,G.date)).forEach(f=>{
    [f.home,f.away].forEach(cid=>{
      const c=G.clubs[cid]; if(!c)return;
      c.squad.forEach(id=>{const p=G.playerById.get(id); if(p&&p.susp>0)p.susp--});
    });
  });
}

let lastWeek=-1;
function weeklyTick(){
  const wk=Math.floor(G.day/7);
  if(wk===lastWeek)return; lastWeek=wk;
  // wages + sponsorship
  G.clubs.forEach(c=>{
    if(c.nonLeague)return;
    let wages=0; c.squad.forEach(id=>{const p=G.playerById.get(id);if(p)wages+=p.contract.wage});
    c.weeklyWages=wages;
    c.balance -= wages;
    // Broadcast + commercial income, scaled so a well-run club roughly breaks even
    c.tvIncome = [2.4e6,2.6e5,7.5e4,5.0e4][c.div] || 4e4;
    c.balance += c.tvIncome + c.sponsorship/52;
    c.balance += Math.max(0, c.wageBudget*1.02 - c.tvIncome - c.sponsorship/52) * 0.85;
    if(c.balance<0 && c.id===G.userClub && RND()<0.4)
      addNews('board','Finances','The board are concerned about the club\'s cash position. Current balance: '+money(c.balance)+'.',c.id);
  });
  // training / development
  trainingTick();
  rumourTick();
  interestTick();
  scoutAssignmentTick();
  // contracts
  G.players.forEach(p=>{
    p.contract.years-=1/52;
    if(p.club===G.userClub && p.contract.years<0.5 && p.contract.years>0.48)
      addNews('contract','Contract expiring',p.name+'\'s contract runs out at the end of the season. He will be free to talk to other clubs.',p.club,{player:p.id});
    p.value=calcValue(p);
  });
  updateJobSecurity();
}

/* ---- training & development ------------------------------------------ */
const TRAINING_FOCI=['General','Attacking','Defending','Possession','Fitness','Set Pieces','Team Cohesion'];
const INDIV_FOCI=['General','Finishing','Passing','Defending','Fitness','Pace','Technique','Leadership','Aerial'];
const FOCUS_ATTRS={
  Finishing:['Finishing','Composure','Off the Ball','Long Shots'],
  Passing:['Passing','Vision','Technique','First Touch'],
  Defending:['Marking','Tackling','Positioning','Concentration'],
  Fitness:['Stamina','Strength','Natural Fitness','Balance'],
  Pace:['Pace','Acceleration','Agility'],
  Technique:['Technique','Dribbling','First Touch','Flair'],
  Leadership:['Determination','Teamwork','Decisions','Work Rate'],
  Aerial:['Heading','Jumping','Strength'],
  General:null
};
function trainingTick(){
  G.clubs.forEach(club=>{
    if(club.nonLeague)return;
    const facility = 0.7 + club.rep/140;
    club.squad.forEach(id=>{
      const p=G.playerById.get(id); if(!p||p.inj)return;
      const room=p.pa-p.ca;
      // development curve
      let rate=0;
      if(p.age<=17) rate=0.110; else if(p.age<=20) rate=0.095;
      else if(p.age<=23) rate=0.065; else if(p.age<=26) rate=0.032;
      else if(p.age<=29) rate=0.011; else rate=0;
      const det=(p.attrs['Determination']||10)/13;
      const playTime = Math.min(1.35, 0.45 + (p.apps/ Math.max(4,G.day/9)) );
      let gain = room>0 ? rate*facility*det*playTime*(0.55+RND()*0.9) : 0;
      bumpCA(p, ageDrift(p));
      if(gain>0.001) applyDevelopment(p, gain, p.training);
    });
  });
}
function applyDevelopment(p,gain,focus){
  const list = FOCUS_ATTRS[focus]||null;
  const keys = KEY_ATTRS[p.pos]||KEY_ATTRS.MC;
  const pool = list ? list.concat(keys) : keys.concat(allAttrs(p.pos).slice(0,6));
  const steps = Math.abs(gain)*3.2;
  const before = p.ca;
  let delta = 0;
  for(let i=0;i<Math.max(1,Math.round(steps*3));i++){
    if(RND()>Math.min(0.95,steps)) continue;
    const a=pick(pool);
    if(p.attrs[a]==null)continue;
    if(gain>0 && p.attrs[a]<20){ p.attrs[a]++; delta+=attrWorth(p,a) }
    else if(gain<0 && p.attrs[a]>1){ p.attrs[a]--; delta-=attrWorth(p,a) }
  }
  bumpCA(p, delta);
  if(p.club===G.userClub && p.ca>before && p.ca%5===0 && p.age<24)
    addNews('training','Player developing',
      p.name+' has been excelling in training and looks a level up on where he started.',p.club,{player:p.id});
}

/* ---- ageing ----------------------------------------------------------- */
// Attributes that fade once a career passes its physical peak...
const PHYS_FADE = ['Pace','Acceleration','Agility','Stamina','Jumping','Balance','Natural Fitness','Strength'];
// ...and the ones a player keeps adding to well into his thirties.
const MENT_GROW = ['Composure','Decisions','Positioning','Anticipation','Concentration',
                   'Teamwork','Vision','Determination','Off the Ball','Work Rate','Leadership'];

/** Weekly ageing drift: the legs go first, the reading of the game keeps sharpening. */
function ageDrift(p){
  if(p.inj) return 0;
  let delta=0;
  const a=p.age;
  // --- physical decline, from about 28 onward, accelerating with age ---
  if(a>=28){
    const nf=(p.attrs['Natural Fitness']||10);
    let rate=(a-26.5)*0.020*(1.35-nf/22);
    if(p.pos==='GK') rate*=0.45;                    // keepers age far more kindly
    if(['AMR','AML','ST'].includes(p.pos)) rate*=1.2; // pace merchants suffer most
    if(RND()<rate){
      const cands=PHYS_FADE.filter(k=>p.attrs[k]!=null && p.attrs[k]>1);
      if(cands.length){ const k=pick(cands); p.attrs[k]--; delta-=attrWorth(p,k) }
    }
  }
  // --- mental growth: experience accrues right through a career ---
  if(a>=20){
    const det=(p.attrs['Determination']||10)/12;
    const rate=(a<=24?0.016 : a<=32?0.022 : 0.013)*det;
    if(RND()<rate){
      // easier to add to something you're weak at than to perfect a strength
      const cands=MENT_GROW.filter(k=>p.attrs[k]!=null && p.attrs[k]<19);
      const soft=cands.filter(k=>p.attrs[k]<16);
      const p2=(soft.length&&RND()<0.75)?soft:cands;
      if(p2.length){ const k=pick(p2); p.attrs[k]++; delta+=attrWorth(p,k) }
    }
  }
  return delta;
}

/* ---- cups ------------------------------------------------------------- */
function advanceCup(key){
  const c=G.competitions[key];
  const played=G.fixtures.filter(f=>f.comp===key&&f.round===c.stage&&f.played);
  const winners=(c.byes||[]).slice();
  played.forEach(f=>{
    let w;
    if(f.score[0]>f.score[1])w=f.home;
    else if(f.score[1]>f.score[0])w=f.away;
    else w = RND()< 0.53 ? f.home : f.away;  // replay/pens resolved
    winners.push(w);
    const loser = w===f.home?f.away:f.home;
    if(loser===G.userClub) addNews('cup','Knocked out',
      'You are out of the '+c.name+' at the '+c.rounds[c.stage].name+' stage, beaten by '+G.clubs[w].name+'.',loser);
  });
  c.stage++;
  const rd=c.rounds[c.stage];
  if(!rd || winners.length<2){
    c.winner=winners[0]!=null?winners[0]:null;
    if(c.winner!=null){
      G.clubs[c.winner].hist.push({season:G.season,text:'Won the '+c.name});
      addNews('world','🏆 '+c.name+' won',G.clubs[c.winner].name+' have won the '+c.name+'.',null);
      if(c.winner===G.userClub){G.clubs[G.userClub].balance+= key==='fa'?4e6:2.5e6; G.jobSecurity=Math.min(100,G.jobSecurity+22)}
      else G.clubs[c.winner].balance+= key==='fa'?4e6:2.5e6;
    }
    return;
  }
  c.teams=winners;
  if(rd.join==='PLnonEuro') c.teams=c.teams.concat(G.clubs.filter(x=>x.div===0&&!x.europe).map(x=>x.id),G.clubs.filter(x=>x.div===1).map(x=>x.id));
  if(rd.join==='PLeuro') c.teams=c.teams.concat(G.clubs.filter(x=>x.div===0&&x.europe).map(x=>x.id));
  if(rd.join==='PLCH') c.teams=c.teams.concat(G.clubs.filter(x=>x.div<=1).map(x=>x.id));
  const t=shuffle(c.teams.slice()); const byes=[];
  while(t.length%2===1) byes.push(t.pop());
  for(let i=0;i+1<t.length;i+=2){
    G.fixtures.push({comp:key,round:c.stage,home:t[i],away:t[i+1],
      date:new Date(rd.date.getTime()),played:false,cup:true,neutral:rd.name==='Final'});
  }
  c.byes=byes;
  const inIt=t.includes(G.userClub);
  if(inIt){
    const f=G.fixtures.find(f=>f.comp===key&&f.round===c.stage&&(f.home===G.userClub||f.away===G.userClub));
    if(f) addNews('cup',c.name+' draw',
      'You have been drawn '+(f.home===G.userClub?'at home to ':'away to ')+G.clubs[f.home===G.userClub?f.away:f.home].name+
      ' in the '+rd.name+'.',G.userClub);
  }
}

function advanceEuroIfDue(code){
  const c=G.competitions[code]; if(!c||c.winner)return;
  const pending=G.fixtures.some(f=>f.comp===code&&!f.played);
  if(pending)return;
  if(c.stage==='league'){
    const order=Object.keys(c.table).map(id=>({id:+id,...c.table[id]}))
      .sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);
    c.standings=order;
    const qual=order.slice(0,16).map(o=>o.id);
    c.stage='ko'; c.koRound=0; c.alive=qual;
    if(qual.includes(G.userClub))addNews('euro',c.name+' knockout','You have qualified for the '+c.name+' knockout phase.',G.userClub);
    else if(c.teams.includes(G.userClub))addNews('euro',c.name+' eliminated','Your '+c.name+' campaign ends in the league phase.',G.userClub);
    drawEuroKO(code);
  } else {
    const rn=['Round of 16','Quarter-Final','Semi-Final','Final'];
    const winners=[];
    G.fixtures.filter(f=>f.comp===code&&f.koTag===c.koRound&&f.played).forEach(f=>{
      let w = f.score[0]>f.score[1]?f.home : f.score[1]>f.score[0]?f.away : (RND()<.5?f.home:f.away);
      winners.push(w);
      const l=w===f.home?f.away:f.home;
      if(l===G.userClub)addNews('euro','Out of '+c.name,'Beaten by '+G.clubs[w].name+' in the '+rn[c.koRound]+'.',l);
    });
    c.koRound++;
    if(winners.length<2){
      c.winner=winners[0];
      if(c.winner!=null){
        addNews('world','🏆 '+c.name,G.clubs[c.winner].name+' are champions of Europe\'s '+c.name+'.',null);
        G.clubs[c.winner].hist.push({season:G.season,text:'Won the '+c.name});
        G.clubs[c.winner].balance+= code==='UCL'?2.5e7:code==='UEL'?9e6:4e6;
        if(c.winner===G.userClub)G.jobSecurity=100;
      }
      return;
    }
    c.alive=winners; drawEuroKO(code);
  }
}
function drawEuroKO(code){
  const c=G.competitions[code];
  const t=shuffle(c.alive.slice());
  const d=c.koDates[Math.min(c.koRound||0,c.koDates.length-1)];
  for(let i=0;i+1<t.length;i+=2){
    G.fixtures.push({comp:code,round:100+(c.koRound||0),koTag:c.koRound||0,home:t[i],away:t[i+1],
      date:new Date(d.getTime()),played:false,euro:true,neutral:t.length===2});
  }
  if(t.includes(G.userClub)){
    const f=G.fixtures.find(f=>f.comp===code&&f.koTag===(c.koRound||0)&&(f.home===G.userClub||f.away===G.userClub));
    if(f)addNews('euro',c.name+' draw','You face '+G.clubs[f.home===G.userClub?f.away:f.home].name+' in the next round.',G.userClub);
  }
}

/* ---- board / job security -------------------------------------------- */
function boardExpectation(club){
  const table=leagueTable(club.div);
  const ranked=table.slice().sort((a,b)=>b.rep-a.rep);
  const seed=ranked.findIndex(c=>c.id===club.id)+1;
  const n=table.length;
  if(seed<=2) return {text:'Win the league',target:1};
  if(seed<=5) return {text:'Challenge for the title',target:Math.max(2,Math.round(n*0.12))};
  if(seed<=Math.round(n*0.35)) return {text:'Push for promotion / European qualification',target:Math.round(n*0.3)};
  if(seed<=Math.round(n*0.65)) return {text:'Finish in mid-table',target:Math.round(n*0.55)};
  return {text:'Avoid relegation',target:n-4};
}
function updateJobSecurity(){
  const club=G.clubs[G.userClub];
  const exp=boardExpectation(club); G.boardExpectation=exp.text;
  if(club.p<3) return;
  const pos=positionOf(G.userClub);
  const delta = (exp.target - pos)*0.9*G.difficulty;
  const formPts = club.form.slice(-5).reduce((s,r)=>s+(r==='W'?3:r==='D'?1:0),0);
  G.jobSecurity = clamp(G.jobSecurity + delta*0.35 + (formPts-6)*0.75, 0, 100);
  if(G.jobSecurity<20 && RND()<0.25)
    addNews('board','Board unhappy','The board have made it clear that results must improve. Your position is under review.',G.userClub);
  if(G.jobSecurity<=0){
    addNews('board','You have been sacked','After a run of poor results the board have terminated your contract. Thank you for your service.',G.userClub);
    G.sacked=true;
  }
}

/* ---- season boundaries ----------------------------------------------- */
function seasonChecks(){
  const allDone = !G.fixtures.some(f=>!f.played)
    && !['efl','fa'].some(k=>G.competitions[k] && G.competitions[k].winner==null)
    && !['UCL','UEL','UECL'].some(k=>G.competitions[k] && G.competitions[k].winner==null);
  if(allDone && !G.seasonEnd){
    G.seasonEnd=true;
    endSeason();
  }
}

function endSeason(){
  const summary=[];
  for(let d=0;d<4;d++){
    const t=leagueTable(d);
    const champ=t[0];
    champ.hist.push({season:G.season,text:'Won '+DIVS[d]});
    summary.push(DIVS[d]+' champions: '+champ.name);
    if(champ.id===G.userClub) G.jobSecurity=100;
  }
  // prize money
  for(let d=0;d<4;d++){
    leagueTable(d).forEach((c,i)=>{
      const base=[3.2e6,1.1e6,3e5,1.7e5][d];
      c.balance += base*(leagueTable(d).length-i)/4;
    });
  }
  const pos=positionOf(G.userClub);
  const exp=boardExpectation(G.clubs[G.userClub]);
  addNews('board','Season review',
    'You finished '+ord(pos)+' in the '+DIVS[G.clubs[G.userClub].div]+'. The board asked you to '+exp.text.toLowerCase()+'. '+
    (pos<=exp.target?'They are satisfied.':'They expected better.'),G.userClub);
  addNews('world','Season complete',summary.join('\n'),null);
  G.pendingRollover=true;
}
function ord(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}

function rolloverSeason(){
  // Promotion / relegation. Work out every move against the *final* tables
  // first, then apply them — otherwise a club relegated out of the Premier
  // League would immediately be eligible to drop again on the next iteration.
  const moves=[];
  const pending=[];
  const finalTables=[0,1,2,3].map(d=>leagueTable(d));
  for(let d=0;d<3;d++){
    const below=finalTables[d+1];
    const playoff=below.slice(2,6).filter(Boolean);
    const poWinner=playoff.length?playoff[Math.floor(RND()*playoff.length)]:null;
    const promoted=[below[0],below[1],poWinner].filter(Boolean);
    const relegated=finalTables[d].slice(-3).filter(Boolean);
    promoted.forEach(c=>pending.push([c,d,'promoted to '+DIVS[d]]));
    relegated.forEach(c=>pending.push([c,d+1,'relegated to '+DIVS[d+1]]));
  }
  pending.forEach(([c,newDiv,text])=>{ c.div=newDiv; moves.push(c.name+' '+text) });
  // ageing, retirement, contracts
  const retired=[];
  G.players.slice().forEach(p=>{
    p.age++;
    if(p.age>=30) p.pa=Math.max(p.ca, p.pa-1);
    p.apps=0;p.goals=0;p.assists=0;p.cleanSheets=0;p.ratings=[];p.form=[];p.yellow=0;p.red=0;p.mom=0;
    const retireChance = p.age>=40?1 : p.age>=37? .5 : p.age>=35? .22 : p.age>=33? .07 : 0;
    if(RND()<retireChance*(1.35-p.ca/110)){ retired.push(p); return }
    if(p.contract.years<=0){
      // renew or leave
      const club=G.clubs[p.club];
      if(!club||RND()<0.45){ makeFreeAgent(p) }
      else { p.contract.years=1+rint(1,3); p.contract.wage=calcWage(p.ca,p.age,club.rep) }
    }
  });
  retired.forEach(p=>{
    const c=G.clubs[p.club]; if(c)c.squad=c.squad.filter(i=>i!==p.id);
    if(p.club===G.userClub)addNews('squad','Retirement',p.name+' has announced his retirement at the age of '+p.age+'.',G.userClub);
    p.retired=true; p.club=-1;
  });
  G.players=G.players.filter(p=>!p.retired);

  // Clubs release their surplus before bringing through a new intake, so
  // squads don't grow without limit across seasons.
  G.clubs.forEach(c=>{ if(!c.nonLeague) trimSquad(c) });
  pruneFreeAgents();

  // reset season stats
  G.clubs.forEach(c=>{c.p=c.w=c.d=c.l=c.gf=c.ga=c.pts=0;c.form=[]});
  G.results=[]; G.fixtures=[]; G.season++;
  G.seasonEnd=false; G.pendingRollover=false;
  G.date=new Date(G.season,6,1);
  buildLeagueFixtures(); initCups(); resetEurope();
  G.clubs.forEach(c=>{c.tactic&&autoPick(c,c.tactic)});
  addNews('world','New season',
    'The '+G.season+'/'+String(G.season+1).slice(2)+' season is under way.\n\n'+moves.slice(0,14).join('\n'),null);
}
function resetEurope(){
  const e=allocateEurope();
  EURO_CODES.forEach(code=>setupEuroCompetition(code,e[code]));
}

/* ---- youth ------------------------------------------------------------ */
/** Nationalities an academy realistically draws on, home nation first. */
function youthNations(club){
  if(club.country==='ENG') return [['ENG',0.80],['IRL',0.05],['SCO',0.04],['WAL',0.03],
    ['FRA',0.015],['NED',0.012],['ESP',0.012],['NGA',0.012],['BRA',0.01],['POR',0.008],
    ['GHA',0.008],['DEN',0.005],['SEN',0.005],['USA',0.004],['BEL',0.004],['JPN',0.003]];
  const pool=NAT_POOLS[club.country]||NAT_POOLS.ENG||[];
  const out=[[club.country,0.82]];
  const rest=pool.filter(x=>x[0]!==club.country);
  const tot=rest.reduce((s,x)=>s+x[1],0)||1;
  rest.forEach(x=>out.push([x[0], 0.18*x[1]/tot]));
  return out;
}
function rollNation(club){
  const list=youthNations(club);
  let r=RND(), acc=0;
  for(const [n,w] of list){ acc+=w; if(r<=acc && NAME_BANK[n]) return n }
  return club.country==='ENG'?'ENG':(NAME_BANK[club.country]?club.country:'ENG');
}

/** The annual intake. Ten or so scholars, occasionally one worth getting excited about. */
function youthIntake(club){
  const n=rint(8,12);
  const made=[];
  // a stronger academy is likelier to turn out a genuine prospect
  const wonderChance = 0.015 + Math.pow(club.rep/100, 2.2)*0.16;
  for(let i=0;i<n;i++){
    const nat=rollNation(club);
    const bank=NAME_BANK[nat]||NAME_BANK.ENG;
    let name, tries=0;
    do { name=pick(bank[0])+' '+pick(bank[1]); tries++ }
    while(tries<12 && G.players.some(p=>p.name===name&&p.club===club.id));
    const pos=pick(['GK','DR','DC','DC','DL','DM','MC','MC','AMR','AML','AMC','ST','ST']);
    const ca=clamp(Math.round(24 + club.rep*0.21 + rint(-5,6)),14,60);
    const wonder=RND()<wonderChance;
    const pa=clamp(Math.round(ca + 7 + club.rep*0.23 + rint(-7,13)
              + (wonder?rint(10,26):0)), ca+4, 97);
    const p={id:G.nextPid++,name,pos,age:16,nat,ca,pa,club:club.id,foot:RND()<0.25?'L':'R',
      hg:true,youth:true,cond:100,morale:78,form:[],sharp:60,inj:null,susp:0,yellow:0,red:0,
      apps:0,goals:0,assists:0,cleanSheets:0,ratings:[],mom:0,squadNum:0,training:'General',
      personality:pick(PERSONALITIES),loanFrom:null,transferListed:false,loanListed:false,unhappy:0,
      contract:{years:3,wage:Math.max(400,Math.round(club.rep*7)),release:0,signed:G.season}};
    p.attrs=buildAttrs(p); p.value=calcValue(p); p.wonderkid=wonder;
    G.players.push(p); G.playerById.set(p.id,p); club.squad.push(p.id);
    made.push(p);
  }
  assignSquadNumbers(club);
  if(club.id===G.userClub){
    const best=made.slice().sort((a,b)=>b.pa-a.pa)[0];
    const gem=made.filter(p=>p.wonderkid);
    addNews('youth','Youth intake — '+G.season+'/'+String(G.season+1).slice(2),
      'The head of youth development has brought '+made.length+' scholars through.\n\n'+
      made.sort((a,b)=>b.pa-a.pa).map(p=>
        '• '+p.name+'  ('+p.pos+', '+p.nat+') — '+starsFor(Math.round((p.pa-30)*1.6))+' potential').join('\n')+
      (gem.length?'\n\nHe is especially excited about '+gem.map(p=>p.name).join(' and ')+
        ' — he thinks there is something genuinely special there.'
       :'\n\nA steady enough group, he says, without anyone leaping off the page.'),
      club.id,{player:best?best.id:null});
  }
}

/** Intake day: the second Thursday of March, every club at once. */
function checkYouthIntake(){
  const d=G.date;
  if(d.getMonth()!==2) return;
  if(G.lastIntake===G.season) return;
  if(d.getDate()<10) return;
  G.lastIntake=G.season;
  G.clubs.forEach(c=>{ if(!c.nonLeague) youthIntake(c) });
  addNews('world','Youth intake day',
    'Academies across the country have taken on their new scholars for the year.',null);
}

function starsFor(v){
  const s=clamp(Math.round(v/20),1,5);
  return '★'.repeat(s)+'☆'.repeat(5-s);
}

/** Release players a club has no room for. */
function trimSquad(club){
  const MAX_SENIOR=25, MAX_YOUTH=16;
  const sq=club.squad.map(i=>G.playerById.get(i)).filter(Boolean);
  const score=p=>p.ca + Math.max(0,p.pa-p.ca)*(p.age<22?0.75:0.2) - Math.max(0,p.age-30)*2.5;
  const senior=sq.filter(p=>!p.youth&&p.age>19).sort((a,b)=>score(b)-score(a));
  const youth=sq.filter(p=>p.youth||p.age<=19).sort((a,b)=>score(b)-score(a));
  const cut=senior.slice(MAX_SENIOR).concat(youth.slice(MAX_YOUTH));
  cut.forEach(p=>{
    makeFreeAgent(p);
    if(club.id===G.userClub)
      addNews('squad','Released',p.name+' ('+p.pos+', '+p.age+') has been released as his contract expired.',club.id);
  });
  // promote the best academy graduates into the senior squad
  club.squad.map(i=>G.playerById.get(i)).forEach(p=>{ if(p&&p.youth&&p.age>=20) p.youth=false });
}

/** Free agents nobody wants eventually drop out of the game entirely. */
function pruneFreeAgents(){
  const fa=G.players.filter(p=>p.club===-1);
  fa.forEach(p=>{
    p.faSeasons=(p.faSeasons||0)+1;
    const wanted = p.ca>52 || (p.age<23 && p.pa>58);
    if(p.faSeasons>=2 || (!wanted && p.faSeasons>=1)) p.retired=true;
  });
  G.players=G.players.filter(p=>{
    if(p.retired){ G.playerById.delete(p.id); return false }
    return true;
  });
}

/* ---- free agents ------------------------------------------------------ */
function makeFreeAgent(p){
  const c=G.clubs[p.club];
  if(c)c.squad=c.squad.filter(i=>i!==p.id);
  p.club=-1; p.contract.years=0; p.transferListed=false;
}
function freeAgents(){ return G.players.filter(p=>p.club===-1) }


/* =========================================================================
   TRANSFERS, SCOUTING, CONTRACTS
   ========================================================================= */

function squadNeed(club){
  const need={};
  POS_ORDER.forEach(p=>need[p]=0);
  club.squad.map(i=>G.playerById.get(i)).filter(p=>p&&!p.youth).forEach(p=>need[p.pos]++);
  const want={GK:2,DR:2,DC:4,DL:2,DM:2,MC:4,AMR:2,AMC:2,AML:2,ST:3};
  const gaps=[];
  POS_ORDER.forEach(p=>{ if(need[p]<want[p]) gaps.push({pos:p,short:want[p]-need[p]}) });
  return gaps.sort((a,b)=>b.short-a.short);
}
function squadAvg(club,pos){
  const l=club.squad.map(i=>G.playerById.get(i)).filter(p=>p&&p.pos===pos&&!p.youth).sort((a,b)=>b.ca-a.ca);
  return l.length? l.slice(0,2).reduce((s,p)=>s+p.ca,0)/Math.min(2,l.length) : 0;
}

/** What a selling club will accept. */
function askingPrice(p){
  const club=G.clubs[p.club];
  let ask=p.value;
  if(p.transferListed) ask*=0.82;
  else{
    const sq=club?club.squad.map(i=>G.playerById.get(i)).filter(x=>x&&x.pos===p.pos):[];
    const isKey = sq.length && sq.sort((a,b)=>b.ca-a.ca)[0].id===p.id;
    ask *= isKey?1.9:1.35;
    if(club && club.tactic && club.tactic.xi.includes(p.id)) ask*=1.15;
  }
  if(p.age<=22 && p.pa-p.ca>12) ask*=1.4;
  if(p.contract.years<1) ask*=0.55;
  if(p.contract.release && p.contract.release<ask) ask=p.contract.release;
  return Math.max(10000, Math.round(ask/50000)*50000);
}

/** Will the player agree personal terms? */
function playerWillJoin(p,toClub,offeredWage){
  const from=G.clubs[p.club];
  const repGain = toClub.rep - (from?from.rep:20);
  const wageRatio = offeredWage/Math.max(400,p.contract.wage);
  let s = 0;
  s += repGain*1.7;
  s += (wageRatio-1)*46;
  if(p.transferListed) s+=30;
  if(p.unhappy>0) s+=p.unhappy*9;
  // playing time
  if(from){
    const inXI=from.tactic&&from.tactic.xi.includes(p.id);
    if(!inXI) s+=16;
    const wouldStart = toClub.squad.map(i=>G.playerById.get(i)).filter(x=>x&&x.pos===p.pos).every(x=>x.ca<p.ca);
    if(wouldStart) s+=12;
  } else s+=25;
  if(p.age>30) s+=12;
  s += (RND()-0.5)*22;
  return s>2;
}

function expectedWage(p,club){
  return Math.max(p.contract.wage*1.12, calcWage(p.ca,p.age,club.rep));
}

/* ---- user-initiated bidding ------------------------------------------ */

function completeTransfer(p,toClubId,fee,wage,years){
  const from=p.club>=0?G.clubs[p.club]:null, to=G.clubs[toClubId];
  if(from){ from.squad=from.squad.filter(i=>i!==p.id); from.balance+=fee; from.transferBudget+=fee*0.6 }
  to.squad.push(p.id); to.balance-=fee; to.transferBudget-=fee;
  p.club=toClubId; p.contract={years:years||3,wage,release:0,signed:G.season};
  p.transferListed=false;p.loanListed=false;p.loanFrom=null;p.morale=78;p.unhappy=0;
  p.value=calcValue(p);
  assignSquadNumbers(to);
  G.transfers.unshift({player:p.id,name:p.name,from:from?from.id:-1,to:toClubId,fee,date:new Date(G.date.getTime()),loan:false});
  if(G.transfers.length>300)G.transfers.pop();
  if(toClubId===G.userClub) addNews('transfer','Signing complete',p.name+' ('+p.pos+', '+p.age+') has signed'+(from?' from '+from.name:' as a free agent')+' for '+money(fee)+'.',toClubId,{player:p.id});
  if(from&&from.id===G.userClub) addNews('transfer','Player sold',p.name+' has joined '+to.name+' for '+money(fee)+'.',from.id);
  if(from) autoPick(from,from.tactic);
}
function doLoan(p,toClubId,wage){
  const from=G.clubs[p.club],to=G.clubs[toClubId];
  from.squad=from.squad.filter(i=>i!==p.id);
  to.squad.push(p.id);
  p.loanFrom=from.id; p.club=toClubId;
  p.__loanWage=p.contract.wage; p.contract.wage=wage;
  p.loanUntil=new Date(2026,5,30);
  G.transfers.unshift({player:p.id,name:p.name,from:from.id,to:toClubId,fee:0,date:new Date(G.date.getTime()),loan:true});
  assignSquadNumbers(to);
  if(toClubId===G.userClub)addNews('transfer','Loan agreed',p.name+' joins on loan from '+from.name+'.',toClubId,{player:p.id});
  autoPick(from,from.tactic);
}

/* ---- AI market -------------------------------------------------------- */
function aiTransferTick(){
  const buyers=G.clubs.filter(c=>c.id!==G.userClub&&!c.nonLeague&&c.transferBudget>1e5);
  const n=Math.min(26,Math.max(4,Math.round(buyers.length*0.11)));
  for(let i=0;i<n;i++){
    const club=pick(buyers); if(!club)continue;
    const gaps=squadNeed(club);
    const pos = gaps.length? gaps[0].pos : pick(POS_ORDER);
    const bar = squadAvg(club,pos);
    const pool=G.players.filter(p=>
      p.pos===pos && p.club!==club.id && !p.loanFrom &&
      p.ca> bar-6 && p.ca< bar+13 &&
      p.value<club.transferBudget*0.75 &&
      (p.club===-1 || (G.clubs[p.club]&&(G.clubs[p.club].rep<club.rep+10||p.transferListed)))
    );
    if(!pool.length)continue;
    const target=pool[Math.floor(RND()*Math.min(pool.length,40))];
    if(!target)continue;
    if(target.club===G.userClub) continue;   // handled separately
    const fee=target.club===-1?0:Math.round(askingPrice(target)*(0.95+RND()*0.2));
    if(fee>club.transferBudget)continue;
    const wage=Math.round(expectedWage(target,club)/100)*100;
    if(club.weeklyWages && club.weeklyWages+wage> club.wageBudget*1.22) continue;
    if(!playerWillJoin(target,club,wage))continue;
    completeTransfer(target,club.id,fee,wage,rint(2,5));
    if(fee>8e6) addNews('world','Transfer',
      target.name+' has joined '+club.name+' for '+money(fee)+'.',null);
  }
  // AI clubs top up thin squads from the free-agent pool
  buyers.forEach(c=>{
    if(c.squad.length>=22||RND()>0.35)return;
    const gaps=squadNeed(c);
    const want=gaps.length?gaps[0].pos:pick(POS_ORDER);
    const fa=freeAgents().filter(p=>p.pos===want&&p.ca<squadAvg(c,want)+8);
    if(!fa.length)return;
    const t2=fa.sort((a,b)=>b.ca-a.ca)[0];
    const wage=Math.round(expectedWage(t2,c)/100)*100;
    if(c.weeklyWages&&c.weeklyWages+wage>c.wageBudget*1.25)return;
    completeTransfer(t2,c.id,0,wage,rint(1,3));
  });
  // AI clubs list surplus players
  buyers.forEach(c=>{
    if(RND()>0.14)return;
    const sq=c.squad.map(i=>G.playerById.get(i)).filter(p=>p&&!p.youth).sort((a,b)=>b.ca-a.ca);
    if(sq.length>23){ const s=sq[sq.length-1]; if(s)s.transferListed=true }
    if(sq.length>26){ const s=sq[sq.length-2]; if(s)s.transferListed=true }
  });
}

/* ---- scouting --------------------------------------------------------- */
function scoutReport(p){
  const known = G.scouting.find(s=>s.player===p.id);
  const depth = known?known.depth:0;
  const err = Math.max(0, 14 - depth*4.5);
  const r=mkRng(hash('scout'+p.id));
  const caEst=clamp(Math.round(p.ca+(r()-0.5)*err),10,99);
  const paEst=clamp(Math.round(p.pa+(r()-0.5)*err*1.7),caEst,99);
  return {caEst,paEst,depth,
    caRange:[Math.max(1,caEst-Math.round(err/2)),Math.min(99,caEst+Math.round(err/2))],
    paRange:[Math.max(1,paEst-Math.round(err)),Math.min(99,paEst+Math.round(err))]};
}
function scoutPlayer(pid){
  seedRivalInterest(pid, 0.45);
  let s=G.scouting.find(x=>x.player===pid);
  if(!s){s={player:pid,depth:0,started:G.day};G.scouting.push(s)}
  if(s.depth<3){
    s.depth++;
    const p=G.playerById.get(pid);
    const cost=[0,15000,40000,90000][s.depth];
    G.clubs[G.userClub].balance-=cost;
    addNews('scout','Scout report: '+p.name,
      'Our scouts have watched '+p.name+' ('+p.pos+', '+p.age+', '+p.nat+') at '+(p.club>=0?G.clubs[p.club].name:'no club')+'.\n\n'+
      scoutText(p,s.depth)+'\n\nReport cost: '+money(cost)+'.',G.userClub,{player:pid});
  }
  return s;
}
function scoutText(p,depth){
  const r=scoutReport(p);
  const lines=[];
  lines.push('Current ability: '+(depth>=3? r.caEst : r.caRange[0]+'–'+r.caRange[1]));
  lines.push('Potential: '+(depth>=2? starsFor(r.paEst) : '?'));
  lines.push('Valuation: '+money(p.value)+'   Asking price: '+money(askingPrice(p)));
  lines.push('Contract: '+p.contract.years.toFixed(1)+' years remaining at '+wageStr(p.contract.wage));
  if(depth>=2){
    const at=p.attrs;
    const best=Object.keys(at).sort((a,b)=>at[b]-at[a]).slice(0,4);
    const worst=Object.keys(at).sort((a,b)=>at[a]-at[b]).slice(0,3);
    lines.push('Strengths: '+best.join(', '));
    lines.push('Weaknesses: '+worst.join(', '));
  }
  if(depth>=3) lines.push('Personality: '+p.personality);
  return lines.join('\n');
}

/* ---- contracts -------------------------------------------------------- */
function offerContract(pid,wage,years,bonus){
  const p=G.playerById.get(pid); const club=G.clubs[G.userClub];
  const expect=expectedWage(p,club);
  const ok = wage >= expect*(0.93+RND()*0.12) && years>=1;
  if(ok){
    p.contract={years,wage,release:p.contract.release,signed:G.season};
    p.morale=Math.min(100,p.morale+12); p.unhappy=0;
    addNews('contract','Contract signed',p.name+' has agreed a new '+years+'-year deal worth '+wageStr(wage)+'.',G.userClub,{player:pid});
    return {ok:true,msg:p.name+' has signed.'};
  }
  return {ok:false,msg:p.name+'\'s agent wants closer to '+wageStr(Math.round(expect*1.06/100)*100)+'.',want:Math.round(expect*1.06/100)*100};
}

/* ---- post-match report ------------------------------------------------ */
function postMatchReport(f,M){
  const us=f.home===G.userClub?0:1;
  const them=1-us;
  const opp=G.clubs[us===0?f.away:f.home];
  const r=M.score[us]>M.score[them]?'Won':M.score[us]<M.score[them]?'Lost':'Drew';
  const compName={league:DIVS[G.clubs[G.userClub].div],efl:'EFL Cup',fa:'FA Cup',
    UCL:'Champions League',UEL:'Europa League',UECL:'Conference League'}[f.comp]||'Match';
  let body=compName+'\n'+G.clubs[f.home].name+' '+M.score[0]+' – '+M.score[1]+' '+G.clubs[f.away].name+'\n\n';
  if(M.scorers&&M.scorers.length) body+=M.scorers.sort((a,b)=>a.min-b.min).map(s=>s.min+"' "+s.name+' ('+(s.side===0?G.clubs[f.home].short:G.clubs[f.away].short)+')').join('\n');
  else body+='No goals.';
  if(f.comp==='league') body+='\n\nYou are now '+ord(positionOf(G.userClub))+' in the table.';
  addNews('result',r+' '+M.score[us]+'–'+M.score[them]+' v '+opp.short,body,G.userClub,{fixture:true});
}


/* =========================================================================
   REGISTERING INTEREST
   A soft approach: you tell a club you're watching a player, they tell you
   where they stand, and the story gets out.
   ========================================================================= */

/** Where the selling club currently stands on a player. */
function transferStance(p){
  if(p.club<0) return {code:'free', label:'Free agent',
    text:'He is out of contract and free to sign on a Bosman.'};
  const club=G.clubs[p.club];
  if(p.loanFrom!=null) return {code:'loan', label:'On loan elsewhere',
    text:'He is currently on loan and his parent club would have to be approached instead.'};
  if(p.transferListed) return {code:'listed', label:'Available',
    text:club.name+' have made him available and would accept around '+money(askingPrice(p))+'.'};
  const sq=club.squad.map(i=>G.playerById.get(i)).filter(x=>x&&x.pos===p.pos).sort((a,b)=>b.ca-a.ca);
  const isKey = sq.length && sq[0].id===p.id;
  const starts = club.tactic && club.tactic.xi.includes(p.id);
  if(isKey && starts && p.contract.years>1.5) return {code:'nfs', label:'Not for sale',
    text:club.name+' consider him untouchable and have no interest in selling.'};
  if(starts) return {code:'reluctant', label:'Reluctant to sell',
    text:club.name+' would rather keep him, but a bid near '+money(askingPrice(p))+' would have to be discussed.'};
  if(p.contract.years<1) return {code:'open', label:'Contract running down',
    text:'With under a year left, '+club.name+' would listen to offers around '+money(askingPrice(p))+'.'};
  return {code:'open', label:'Would listen',
    text:club.name+' are not actively selling but would consider bids from about '+money(askingPrice(p))+'.'};
}

/** Would he even want to come? Judged without committing to anything. */
function interestResponse(p){
  const us=G.clubs[G.userClub];
  const from=p.club>=0?G.clubs[p.club]:null;
  const gap=us.rep-(from?from.rep:20);
  const wage=Math.round(expectedWage(p,us)/100)*100;
  let mood;
  if(gap>10) mood='He would regard this as a clear step up and is very open to the move.';
  else if(gap>-5) mood='He sees it as a lateral move — the project and his role would decide it.';
  else if(gap>-15) mood='He would need convincing; this would be a step down in stature.';
  else mood='He is unlikely to entertain a move to a club of our standing.';
  const wouldStart = us.squad.map(i=>G.playerById.get(i))
    .filter(x=>x&&x.pos===p.pos).every(x=>x.ca<=p.ca);
  return {mood, wage, wouldStart,
    playing: wouldStart ? 'He would expect to walk straight into the side, which suits him.'
                        : 'He would be competing for a place here, which he will weigh up.'};
}

/** Register formal interest: opens a dialogue and puts the story in the press. */
function registerInterest(pid){
  const p=G.playerById.get(pid); if(!p) return null;
  if(p.club===G.userClub) return null;
  const us=G.clubs[G.userClub];
  const stance=transferStance(p);
  const react=interestResponse(p);
  G.interest.add(pid);
  G.shortlist.add(pid);
  // rivals and the press both notice a formal approach
  addRumour(pid, G.userClub, 0.6, 'You have registered your interest.');
  seedRivalInterest(pid, 0.55);
  const body =
    'We contacted '+(p.club>=0?G.clubs[p.club].name:'his representatives')+' to register our interest in '+p.name+
    ' ('+p.pos+', '+p.age+', '+p.nat+').\n\n'+
    'THEIR POSITION\n'+stance.text+'\n\n'+
    'THE PLAYER\n'+react.mood+'\n'+react.playing+'\n'+
    'He would be looking for around '+wageStr(react.wage)+'.\n\n'+
    'VALUATION\nMarket value '+money(p.value)+' · likely asking price '+money(askingPrice(p))+'.'+
    (p.contract.release?'\nRelease clause: '+money(p.contract.release)+'.':'')+
    '\n\nHe has been added to your shortlist and we will keep you posted.';
  addNews('transfer','Interest registered: '+p.name, body, G.userClub, {player:pid});
  return {stance, react};
}

/** Who else is chasing him. */
function interestedClubs(pid){
  return G.rumours.filter(r=>!r.dead&&r.player===pid&&r.to!==G.userClub)
    .sort((a,b)=>b.strength-a.strength)
    .map(r=>({club:G.clubs[r.to], strength:r.strength}));
}

/** Clubs come back to you about players you're watching. */
function interestTick(){
  Array.from(G.interest).forEach(pid=>{
    const p=G.playerById.get(pid);
    if(!p){ G.interest.delete(pid); return }
    if(p.club===G.userClub){ G.interest.delete(pid); return }
    if(RND()>0.05) return;
    const rivals=interestedClubs(pid);
    if(p.transferListed && RND()<0.6){
      addNews('transfer','Now available: '+p.name,
        (p.club>=0?G.clubs[p.club].name:'His club')+' have placed '+p.name+' on the transfer list. '+
        'Asking price around '+money(askingPrice(p))+'.', G.userClub, {player:pid});
    } else if(rivals.length && RND()<0.5){
      addNews('transfer','Competition for '+p.name,
        rivals[0].club.name+' are also pushing hard for '+p.name+'. '+
        'If we want him we may have to move soon.', G.userClub, {player:pid});
    } else if(p.contract.years<0.6 && RND()<0.5){
      addNews('transfer',p.name+' running down his deal',
        p.name+' has less than six months left. He can talk to foreign clubs now and will be '+
        'free in the summer.', G.userClub, {player:pid});
    }
  });
}


/* =========================================================================
   STAR RATINGS
   Ability is never shown as a raw number. Everything is expressed in stars
   relative to the user's own squad, where three stars is a typical member
   of their first-team pool.
   ========================================================================= */

/** Average ability of the user's best 18 senior players — the "3 star" line. */
function squadBaseline(){
  const c=G.clubs[G.userClub]; if(!c) return 60;
  const sq=c.squad.map(i=>G.playerById.get(i)).filter(p=>p&&!p.youth);
  if(!sq.length) return 60;
  const top=sq.slice().sort((a,b)=>b.ca-a.ca).slice(0,18);
  return top.reduce((s,p)=>s+p.ca,0)/top.length;
}
let BASELINE=60;
function refreshBaseline(){ BASELINE=squadBaseline() }

/* Internal ability runs on a wide scale so the match engine has room to work.
   The number a manager sees is the EA-style overall: display = 34 + 0.607·ca,
   which puts the world's best at 91 and a League Two squad player around 58. */
function overallOf(ca){ return clamp(Math.round(34 + 0.607*ca), 40, 99) }
function overallCol(v){
  return v>=85?'#7CF0A8': v>=79?'var(--kit)': v>=72?'#CFE8B0':
         v>=65?'var(--chalk)': v>=58?'var(--chalk-dim)':'var(--chalk-faint)';
}

/** Map an ability value to 0.5–5 stars against the squad baseline. */
function starVal(v){
  const spread=Math.max(4.0, BASELINE*0.085);
  return clamp(Math.round((3 + (v-BASELINE)/spread)*2)/2, 0.5, 5);
}
function starStr(n){
  let s='';
  for(let i=1;i<=5;i++){
    if(n>=i) s+='★';
    else if(n>=i-0.5) s+='⯪';
    else s+='☆';
  }
  return s;
}
function starHTML(v,title){
  if(G.settings.ratings==='number'){
    const o=overallOf(v);
    return `<span class="ovr" style="color:${overallCol(o)}" data-sv="${v}"${title?` title="${esc(title)}"`:''}>${o}</span>`;
  }
  const n=starVal(v);
  const col = n>=4.5?'#7CF0A8': n>=3.5?'var(--kit)': n>=2.5?'var(--chalk)': n>=1.5?'var(--chalk-dim)':'var(--chalk-faint)';
  return `<span class="stars" style="color:${col}" data-sv="${v}"${title?` title="${esc(title)}"`:''}>${starStr(n)}</span>`;
}
/** Half-open star range for a player we haven't scouted properly. */
function starRangeHTML(lo,hi){
  if(G.settings.ratings==='number'){
    const a=overallOf(lo), b=overallOf(hi);
    if(a===b) return starHTML(lo);
    return `<span class="ovr faint" data-sv="${(lo+hi)/2}" title="Scout him further to narrow this down">${a}–${b}</span>`;
  }
  const a=starVal(lo), b=starVal(hi);
  if(a===b) return starHTML(lo);
  return `<span class="stars faint" data-sv="${(lo+hi)/2}" title="Scout him further to narrow this down">${starStr(a)}<span style="opacity:.5"> – </span>${starStr(b)}</span>`;
}

/** Ability cell for any player, respecting how much we actually know. */
function abilityCell(p){
  if(p.club===G.userClub) return starHTML(p.ca, p.name);
  const r=scoutReport(p);
  if(r.depth>=3) return starHTML(p.ca);
  return starRangeHTML(r.caRange[0], r.caRange[1]);
}
function potentialCell(p){
  if(p.club===G.userClub) return starHTML(p.pa);
  const r=scoutReport(p);
  if(r.depth>=3) return starHTML(p.pa);
  if(r.depth>=2) return starRangeHTML(r.paRange[0], r.paRange[1]);
  return '<span class="faint">?</span>';
}

/* =========================================================================
   GENERIC TABLE SORTING
   Every table becomes clickable-sortable. Cells can carry data-sv for a
   sort key that differs from what's displayed (stars, money, dates).
   ========================================================================= */
function cellValue(td){
  if(!td) return '';
  const sv=td.getAttribute && td.getAttribute('data-sv');
  if(sv!=null && sv!=='') { const n=parseFloat(sv); return isNaN(n)?sv:n }
  const inner=td.querySelector && td.querySelector('[data-sv]');
  if(inner){ const n=parseFloat(inner.getAttribute('data-sv')); if(!isNaN(n)) return n }
  let t=(td.textContent||'').trim();
  if(!t || t==='—' || t==='-') return -Infinity;
  // money: £1.2M / £450K
  let m=t.match(/^-?£([\d.]+)([BMK])?/);
  if(m){ const mult={B:1e9,M:1e6,K:1e3}[m[2]]||1; return (t[0]==='-'?-1:1)*parseFloat(m[1])*mult }
  m=t.match(/^-?[\d.]+/);
  if(m && /^-?[\d.,]+%?$/.test(t.replace(/[\s]/g,''))) return parseFloat(t.replace(/,/g,''));
  return t.toLowerCase();
}
function enableSorting(root){
  (root||document).querySelectorAll('table').forEach(tbl=>{
    const head=tbl.querySelector('thead'); if(!head) return;
    const body=tbl.querySelector('tbody'); if(!body) return;
    head.querySelectorAll('th').forEach((th,i)=>{
      if(th.classList.contains('locked')) return;
      if(th.dataset.k) return;   // view supplies its own re-rendering sort
      th.classList.remove('no-sort');
      th.style.cursor='pointer';
      th.onclick=()=>{
        const dir = th.dataset.dir==='asc' ? -1 : 1;
        head.querySelectorAll('th').forEach(o=>{o.dataset.dir='';o.classList.remove('sorted')});
        th.dataset.dir = dir===1?'asc':'desc';
        th.classList.add('sorted');
        const rows=Array.from(body.querySelectorAll('tr'));
        rows.sort((a,b)=>{
          const x=cellValue(a.children[i]), y=cellValue(b.children[i]);
          if(typeof x==='string'||typeof y==='string')
            return String(x).localeCompare(String(y))*dir;
          return (x-y)*dir;
        });
        rows.forEach(r=>body.appendChild(r));
      };
    });
  });
}

/* =========================================================================
   TRANSFER RUMOURS
   Rumours are seeded by real interest — scouting or bidding on a player
   makes rivals notice him — and a rumoured move is much likelier to happen.
   ========================================================================= */
const RUMOUR_LINES=[
 '{C} are reported to be tracking {P}.',
 '{C} have opened talks over a move for {P}.',
 'Sources say {C} have made {P} a priority target.',
 '{C} scouts watched {P} again at the weekend.',
 '{P}\'s representatives have been in contact with {C}.',
 '{C} are said to be preparing a bid for {P}.',
 'A move to {C} is gathering pace for {P}.'
];
function addRumour(pid, toClubId, strength, note){
  const p=G.playerById.get(pid); if(!p||toClubId===p.club) return;
  const existing=G.rumours.find(r=>r.player===pid&&r.to===toClubId);
  if(existing){ existing.strength=Math.min(1,existing.strength+strength*0.5); existing.date=new Date(G.date.getTime()); return existing }
  const r={id:hash('r'+pid+toClubId+G.day),player:pid,to:toClubId,from:p.club,
    strength:clamp(strength,0.05,1),date:new Date(G.date.getTime()),dead:false};
  G.rumours.unshift(r);
  if(G.rumours.length>120)G.rumours.pop();
  const involvesUs = p.club===G.userClub || toClubId===G.userClub;
  if(!G.window.open) r.strength*=0.75;
  const bigMove = p.ca>=BASELINE-4;
  if(involvesUs || (bigMove && RND()<0.35)){
    const line=pick(RUMOUR_LINES).replace('{C}',G.clubs[toClubId].name).replace('{P}',p.name);
    addNews(involvesUs?'rumour':'world','Transfer rumour',
      line+'\n\n'+p.name+' — '+p.pos+', '+p.age+', '+(p.club>=0?G.clubs[p.club].name:'free agent')+
      '.\nValued at '+money(p.value)+'; likely asking price '+money(askingPrice(p))+'.'+
      (note?'\n\n'+note:''), involvesUs?G.userClub:null, {player:pid});
  }
  return r;
}

/** Rival clubs notice when you take a serious look at someone. */
function seedRivalInterest(pid, intensity){
  const p=G.playerById.get(pid); if(!p) return;
  const rivals=G.clubs.filter(c=>c.id!==G.userClub && c.id!==p.club && !c.nonLeague &&
    c.country==='ENG' && Math.abs(c.rep-G.clubs[G.userClub].rep)<18 &&
    c.transferBudget>p.value*0.7);
  if(!rivals.length) return;
  const n = RND()<intensity ? (RND()<0.3?2:1) : 0;
  for(let i=0;i<n;i++){
    const r=pick(rivals);
    addRumour(p.id, r.id, 0.3+RND()*0.4, 'Your interest has not gone unnoticed.');
  }
}

/** Weekly churn: some rumours become deals, others quietly die. */
function rumourTick(){
  G.rumours.forEach(r=>{
    if(r.dead) return;
    const p=G.playerById.get(r.player);
    if(!p || p.club===r.to){ r.dead=true; return }
    const buyer=G.clubs[r.to];
    if(!buyer){ r.dead=true; return }
    r.strength *= 0.94;
    if(r.strength<0.08){ r.dead=true; return }
    if(!G.window.open) return;
    if(r.to===G.userClub) return;                 // your business, your call
    // a rumoured move is far likelier to actually happen
    if(RND() < r.strength*0.16){
      if(p.club===G.userClub){
        // speculation turns into a formal, negotiable bid
        if(!dealFor(p.id)){
          const fee=Math.round(askingPrice(p)*(0.80+RND()*0.4)/50000)*50000;
          const d=newDeal(p.id,G.userClub,r.to,'in',fee);
          d.stage='received'; d.respondAt=G.day+99; d.expires=G.day+rint(7,12);
          d.wage=Math.round(expectedWage(p,buyer)/100)*100;
          logDeal(d,buyer.name+' followed up the speculation with a bid of '+money(fee)+'.');
          addNews('transfer','Bid received after rumours',
            buyer.name+' have followed up the speculation with a formal '+money(fee)+
            ' bid for '+p.name+'.',G.userClub,{deal:d.id,player:p.id});
          r.dead=true;
        }
        return;
      }
      const fee=p.club===-1?0:Math.round(askingPrice(p)*(0.95+RND()*0.2));
      const wage=Math.round(expectedWage(p,buyer)/100)*100;
      if(fee>buyer.transferBudget) return;
      if(buyer.weeklyWages && buyer.weeklyWages+wage>buyer.wageBudget*1.25) return;
      if(!playerWillJoin(p,buyer,wage)) return;
      completeTransfer(p,buyer.id,fee,wage,rint(2,5));
      r.dead=true;
      if(fee>5e6||p.ca>BASELINE)
        addNews('world','Rumour confirmed',p.name+' has completed his move to '+buyer.name+' for '+money(fee)+'.',null);
    }
  });
  G.rumours=G.rumours.filter(r=>!r.dead||((G.date-r.date)/864e5)<21);
  // Speculation runs all year round; it simply can't become a deal
  // until the window is open.
  if(RND() < (G.window.open?0.7:0.3)){
    for(let i=0;i<rint(1,3);i++){
      const buyer=pick(G.clubs.filter(c=>!c.nonLeague&&c.country==='ENG'&&c.transferBudget>3e5));
      if(!buyer) continue;
      const gaps=squadNeed(buyer);
      const pos=gaps.length?gaps[0].pos:pick(POS_ORDER);
      const bar=squadAvg(buyer,pos);
      const pool=G.players.filter(p=>p.pos===pos&&p.club!==buyer.id&&!p.loanFrom&&
        p.ca>bar-5&&p.ca<bar+12&&p.value<buyer.transferBudget*0.8);
      if(!pool.length) continue;
      addRumour(pool[Math.floor(RND()*Math.min(pool.length,30))].id, buyer.id, 0.15+RND()*0.35);
    }
  }
}

function wireEditor(){
  const q=$('#ed-q');
  if(q){
    $('#ed-find').onclick=()=>{edSearch=q.value;render()};
    $('#ed-mine').onclick=()=>{edSearch='';render()};
    q.onkeydown=e=>{if(e.key==='Enter'){edSearch=q.value;render()}};
  }
  $$('[data-edit]').forEach(b=>b.onclick=()=>editPlayer(+b.dataset.edit));
  $$('[data-edclub]').forEach(b=>b.onclick=()=>editClub(+b.dataset.edclub));

  const sc=$('#ed-save-club');
  if(sc) sc.onclick=()=>{
    const c=G.clubs[G.userClub];
    c.name=$('#ed-cname').value||c.name; c.short=$('#ed-cshort').value||c.short;
    G.managerName=$('#ed-mgr').value||G.managerName;
    c.col=$('#ed-col').value; c.col2=$('#ed-col2').value; c.crest=crestFor(c);
    c.balance=+$('#ed-bal').value; c.transferBudget=+$('#ed-tb').value;
    c.wageBudget=+$('#ed-wb').value; c.capacity=+$('#ed-cap').value;
    c.rep=clamp(+$('#ed-rep').value,0,100);
    toast('Club updated'); render();
  };
  const cash=$('#ed-cash');
  if(cash) cash.onclick=()=>{const c=G.clubs[G.userClub];c.balance+=5e7;c.transferBudget+=5e7;toast('Funds added');render()};
  const heal=$('#ed-heal');
  if(heal) heal.onclick=()=>{G.clubs[G.userClub].squad.forEach(i=>{const p=G.playerById.get(i);if(p){p.inj=null;p.susp=0}});toast('Everyone fit');render()};
  const mor=$('#ed-morale');
  if(mor) mor.onclick=()=>{G.clubs[G.userClub].squad.forEach(i=>{const p=G.playerById.get(i);if(p){p.morale=95;p.cond=100;p.sharp=100}});
    G.clubs[G.userClub].morale=95;toast('Squad restored');render()};

  const sw=$('#ed-save-world');
  if(sw) sw.onclick=()=>{
    G.jobSecurity=clamp(+$('#ed-job').value,0,100);
    G.difficulty=+$('#ed-diff').value||1;
    G.window.open=$('#ed-win').value==='1';
    const nc=+$('#ed-club').value;
    if(nc!==G.userClub){
      G.userClub=nc; G.shortlist=new Set(); refreshBaseline();
      addNews('board','New appointment','You have taken over at '+G.clubs[nc].name+'.',nc);
    }
    toast('Applied'); render();
  };
  const rb=$('#ed-rumour');
  if(rb) rb.onclick=()=>{for(let i=0;i<6;i++)rumourTick();toast('Rumour mill spinning');render()};
}

const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let VIEW='home', VSTATE={};

function toast(msg){
  const t=el('div','toast',esc(msg));
  $('#toast').appendChild(t);
  setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity=0;setTimeout(()=>t.remove(),320)},2600);
}

function crestHTML(c,size){
  size=size||26;
  const k=c.crest;
  const half = k.twoTone
    ? `<i style="position:absolute;inset:0 0 0 55%;background:${k.bg2}"></i>` : '';
  const border = lum(k.bg)>0.75 && (!k.twoTone||lum(k.bg2)>0.75)
    ? 'box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);' : '';
  return `<div class="crest" style="position:relative;overflow:hidden;background:${k.bg};${border}`+
    `width:${size}px;height:${size}px;font-size:${Math.round(size*0.44)}px">${half}`+
    `<span style="position:relative;z-index:1;color:${k.fg};text-shadow:0 1px 2px rgba(0,0,0,.45)">${k.txt}</span></div>`;
}
function abilCol(v){return v>=85?'#7CF0A8':v>=72?'var(--kit)':v>=58?'#CFE8B0':v>=45?'var(--chalk)':'var(--chalk-dim)'}
function attrCls(v){return v>=18?'a20':v>=15?'a16':v>=12?'a13':v>=9?'a10':v>=6?'a7':'a0'}
function formHTML(f){return '<span class="form-run">'+(f.slice(-6).map(x=>`<i class="${x}">${x}</i>`).join('')||'<span class="faint">—</span>')+'</span>'}
function condCol(c){return c>=88?'var(--kit)':c>=70?'#CFE8B0':c>=50?'var(--flood)':'var(--danger)'}
function moraleWord(m){return m>=88?'Very good':m>=72?'Good':m>=55?'Okay':m>=38?'Poor':'Very poor'}
function avgRating(p){return p.ratings.length?(p.ratings.reduce((s,x)=>s+x,0)/p.ratings.length).toFixed(2):'—'}

let squadSort={key:'ca',dir:-1}, squadTab='senior';
function vSquad(){
  const c=G.clubs[G.userClub];
  const wrap=el('div');
  wrap.appendChild(tabs([{id:'senior',label:'First team'},{id:'youth',label:'Academy'},
    {id:'stats',label:'Season stats'},{id:'contracts',label:'Contracts'}],squadTab,id=>{squadTab=id;render()}));

  let sq=c.squad.map(i=>G.playerById.get(i)).filter(Boolean);
  if(squadTab==='youth') sq=sq.filter(p=>p.youth||p.age<=19);
  else if(squadTab==='senior') sq=sq.filter(p=>!p.youth);

  const cols = squadTab==='stats' ? [
    ['squadNum','#'],['name','Name'],['pos','Pos'],['apps','Apps'],['goals','Gls'],['assists','Ast'],
    ['cleanSheets','CS'],['avg','Avg'],['mom','MoM'],['yellow','Yel'],['red','Red']
  ] : squadTab==='contracts' ? [
    ['squadNum','#'],['name','Name'],['pos','Pos'],['age','Age'],['wage','Wage'],['years','Expires'],
    ['value','Value'],['release','Release'],['status','Status']
  ] : [
    ['squadNum','#'],['name','Name'],['pos','Pos'],['age','Age'],['nat','Nat'],['ca','Ability'],['pa','Potential'],
    ['cond','Cond'],['sharp','Match'],['morale','Morale'],['form','Form'],['value','Value'],['status','']
  ];

  const val=(p,k)=>({squadNum:p.squadNum,name:p.name,pos:POS_ORDER.indexOf(p.pos),age:p.age,nat:p.nat,
    ca:p.ca,pa:p.pa,cond:p.cond,sharp:p.sharp,morale:p.morale,value:p.value,apps:p.apps,goals:p.goals,
    assists:p.assists,cleanSheets:p.cleanSheets,mom:p.mom,yellow:p.yellow,red:p.red,
    avg:+(avgRating(p))||0,wage:p.contract.wage,years:p.contract.years,release:p.contract.release,
    form:p.form.length?p.form[p.form.length-1]:0,status:p.inj?2:p.susp?1:0}[k]);
  sq.sort((a,b)=>{const x=val(a,squadSort.key),y=val(b,squadSort.key);
    if(typeof x==='string')return x.localeCompare(y)*squadSort.dir; return (x-y)*squadSort.dir});

  const p=el('div','panel');
  p.innerHTML=`<div class="tbl-wrap"><table><thead><tr>${cols.map(c2=>
    `<th data-k="${c2[0]}" class="${['name','pos','nat','form','status'].includes(c2[0])?'':'num'}">${c2[1]}${squadSort.key===c2[0]?(squadSort.dir<0?' ▾':' ▴'):''}</th>`).join('')}</tr></thead>
    <tbody>${sq.map(pl=>squadRow(pl,squadTab)).join('')}</tbody></table></div>`;
  wrap.appendChild(p);

  const totWage=sq.reduce((s,x)=>s+x.contract.wage,0);
  wrap.appendChild(el('div','dim',`${sq.length} players · total wages ${money(totWage)}/wk · average ability ${(sq.reduce((s,x)=>s+x.ca,0)/Math.max(1,sq.length)).toFixed(1)}`));

  setTimeout(()=>{
    $$('th[data-k]').forEach(th=>th.onclick=()=>{
      const k=th.dataset.k;
      if(squadSort.key===k)squadSort.dir*=-1;else{squadSort.key=k;squadSort.dir=k==='name'||k==='pos'?1:-1}
      render();
    });
    $$('tr[data-pid]').forEach(tr=>tr.onclick=()=>showPlayer(+tr.dataset.pid));
  },0);
  return page('Squad', G.clubs[G.userClub].name, wrap);
}
function squadRow(p,tab){
  const st=p.inj?`<span class="chip l" title="${esc(p.inj.type)}">INJ ${p.inj.days}d</span>`
    :p.susp?`<span class="chip l">BAN ${p.susp}</span>`
    :p.loanFrom!=null?'<span class="chip d">LOAN</span>'
    :p.transferListed?'<span class="chip d">LISTED</span>':'';
  if(tab==='stats') return `<tr class="clickable" data-pid="${p.id}">
    <td class="num">${p.squadNum}</td><td>${esc(p.name)}</td><td>${posChip(p.pos)}</td>
    <td class="num">${p.apps}</td><td class="num">${p.goals}</td><td class="num">${p.assists}</td>
    <td class="num">${p.cleanSheets||''}</td><td class="num">${avgRating(p)}</td><td class="num">${p.mom||''}</td>
    <td class="num">${p.yellow||''}</td><td class="num">${p.red||''}</td></tr>`;
  if(tab==='contracts') return `<tr class="clickable" data-pid="${p.id}">
    <td class="num">${p.squadNum}</td><td>${esc(p.name)}</td><td>${posChip(p.pos)}</td><td class="num">${p.age}</td>
    <td class="num">${money(p.contract.wage)}</td><td class="num">${p.contract.years<=0?'<span style="color:var(--danger)">Expired</span>':p.contract.years.toFixed(1)+'y'}</td>
    <td class="num">${money(p.value)}</td><td class="num">${p.contract.release?money(p.contract.release):'—'}</td><td>${st}</td></tr>`;
  return `<tr class="clickable" data-pid="${p.id}">
    <td class="num">${p.squadNum}</td><td>${esc(p.name)}${p.hg?'<span class="faint" title="Home grown"> ▪</span>':''}</td>
    <td>${posChip(p.pos)}</td><td class="num">${p.age}</td><td class="flag">${esc(p.nat)}</td>
    <td class="num">${starHTML(p.ca)}</td>
    <td class="num">${starHTML(p.pa)}</td>
    <td class="num" style="color:${condCol(p.cond)}">${Math.round(p.cond)}%</td>
    <td class="num">${Math.round(p.sharp)}%</td>
    <td class="num">${moraleWord(p.morale)}</td>
    <td>${formHTML(p.form.map(r=>r>=7?'W':r>=6.3?'D':'L'))}</td>
    <td class="num">${money(p.value)}</td><td>${st}</td></tr>`;
}

/* =====================  PLAYER PROFILE  ================================ */
function showPlayer(pid){
  const p=G.playerById.get(pid); if(!p)return;
  const club=p.club>=0?G.clubs[p.club]:null;
  const mine=p.club===G.userClub;
  const rep=scoutReport(p);
  const known = mine || rep.depth>=3;

  const body=el('div');
  const head=el('div','',`
    <div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px">
      ${club?crestHTML(club,44):''}
      <div style="flex:1;min-width:200px">
        <div class="eyebrow">${club?esc(club.name):'Free agent'} ${p.loanFrom!=null?'· on loan from '+esc(G.clubs[p.loanFrom].name):''}</div>
        <h2 style="font-size:25px">${esc(p.name)}</h2>
        <div class="dim">${p.pos} · ${p.age} years old · ${esc(p.nat)} · ${p.foot==='B'?'Two-footed':p.foot==='L'?'Left footed':'Right footed'} · ${esc(p.personality)}</div>
      </div>
      <div style="display:flex;gap:16px">
        <div class="stat"><b style="font-size:15px">${abilityCell(p)}</b><span>Ability</span></div>
        <div class="stat"><b style="font-size:15px">${potentialCell(p)}</b><span>Potential</span></div>
        <div class="stat"><b>${money(p.value)}</b><span>Value</span></div>
      </div>
    </div>`);
  body.appendChild(head);

  const g=el('div','grid g-side');
  // attributes
  const left=el('div');
  if(mine||rep.depth>=2){
    const groups = p.pos==='GK'
      ? [['Goalkeeping',ATTR_GK],['Mental',ATTR_MENT],['Physical',ATTR_PHYS]]
      : [['Technical',ATTR_TECH.concat(['Flair'])],['Mental',ATTR_MENT.concat(['Aggression'])],['Physical',ATTR_PHYS]];
    const ap=el('div','panel');
    ap.innerHTML=`<div class="panel-h"><h3>Attributes</h3></div><div class="panel-b"><div class="attr-cols">`+
      groups.map(([t,list])=>`<div><div class="eyebrow" style="margin-bottom:5px">${t}</div>`+
        list.filter(a=>p.attrs[a]!=null).map(a=>{
          const v=p.attrs[a]; const shown = mine? v : clamp(v+Math.round((mkRng(hash(a+p.id))()-0.5)*4),1,20);
          return `<div class="attr"><span class="dim">${a}</span><b class="${attrCls(shown)}">${shown}</b></div>`}).join('')+`</div>`).join('')+
      `</div></div>`;
    left.appendChild(ap);
  } else {
    const ap=el('div','panel');
    ap.innerHTML=`<div class="panel-h"><h3>Attributes</h3></div>
      <div class="empty">Your scouts haven't watched him enough. Scout him further to reveal his attributes.</div>`;
    left.appendChild(ap);
  }
  // season stats
  const sp=el('div','panel');
  sp.innerHTML=`<div class="panel-h"><h3>This season</h3></div><div class="panel-b">
    <div style="display:flex;gap:20px;flex-wrap:wrap">
      <div class="stat"><b>${p.apps}</b><span>Apps</span></div>
      <div class="stat"><b>${p.goals}</b><span>Goals</span></div>
      <div class="stat"><b>${p.assists}</b><span>Assists</span></div>
      ${p.pos==='GK'?`<div class="stat"><b>${p.cleanSheets}</b><span>Clean sheets</span></div>`:''}
      <div class="stat"><b>${avgRating(p)}</b><span>Avg rating</span></div>
      <div class="stat"><b>${p.mom}</b><span>Man of match</span></div>
      <div class="stat"><b>${p.yellow}/${p.red}</b><span>Cards</span></div>
    </div>
    <div style="margin-top:11px" class="eyebrow">Last ten ratings</div>
    <div class="mono" style="font-size:11px;color:var(--chalk-dim)">${p.ratings.slice(-10).join('  ')||'—'}</div>
  </div>`;
  left.appendChild(sp);
  g.appendChild(left);

  // right
  const right=el('div');
  const cp=el('div','panel');
  cp.innerHTML=`<div class="panel-h"><h3>Contract</h3></div><div class="panel-b">
    <div class="kv"><span>Wage</span><b>${wageStr(p.contract.wage)}</b></div>
    <div class="kv"><span>Expires</span><b>${p.contract.years<=0?'Expired':p.contract.years.toFixed(1)+' years'}</b></div>
    <div class="kv"><span>Release clause</span><b>${p.contract.release?money(p.contract.release):'None'}</b></div>
    <div class="kv"><span>Asking price</span><b>${money(askingPrice(p))}</b></div>
    ${mine?`<div class="kv"><span>Condition</span><b style="color:${condCol(p.cond)}">${Math.round(p.cond)}%</b></div>
    <div class="kv"><span>Match sharpness</span><b>${Math.round(p.sharp)}%</b></div>
    <div class="kv"><span>Morale</span><b>${moraleWord(p.morale)}</b></div>
    <div class="kv"><span>Training focus</span><b>${esc(p.training)}</b></div>`:''}
    ${p.inj?`<div class="kv"><span>Injury</span><b style="color:var(--danger)">${esc(p.inj.type)} — ${p.inj.days}d</b></div>`:''}
    ${p.susp?`<div class="kv"><span>Suspension</span><b style="color:var(--danger)">${p.susp} match(es)</b></div>`:''}
  </div>`;
  right.appendChild(cp);

  if(!mine){
    const st=transferStance(p);
    const rivals=interestedClubs(p.id);
    const stCol={nfs:'var(--danger)',reluctant:'var(--flood)',open:'var(--kit)',
                 listed:'var(--kit)',free:'var(--kit)',loan:'var(--chalk-dim)'}[st.code]||'var(--chalk)';
    const ip=el('div','panel');
    ip.innerHTML=`<div class="panel-h"><h3>Availability</h3>
      <span class="chip" style="border-color:${stCol};color:${stCol}">${esc(st.label)}</span></div>
      <div class="panel-b">
        <div class="dim" style="line-height:1.5;margin-bottom:9px">${esc(st.text)}</div>
        ${G.interest.has(p.id)?`<div class="kv"><span>Our interest</span><b style="color:var(--flood)">Registered</b></div>`:''}
        <div class="eyebrow" style="margin-top:8px;margin-bottom:4px">Other clubs circling</div>
        ${rivals.length?rivals.slice(0,5).map(r=>
          `<div class="kv"><span>${crestSmall(r.club)}${esc(r.club.name)}</span>
           <b><div class="bar" style="width:58px;display:inline-block;vertical-align:middle">
           <i style="width:${Math.round(r.strength*100)}%;background:${r.strength>0.6?'var(--danger)':'var(--flood)'}"></i></div></b></div>`).join('')
          :'<div class="faint">Nobody else is publicly linked with him.</div>'}
      </div>`;
    right.appendChild(ip);
  }
  const act=el('div','panel');
  act.innerHTML=`<div class="panel-h"><h3>Actions</h3></div><div class="panel-b" id="pl-act" style="display:flex;flex-direction:column;gap:6px"></div>`;
  right.appendChild(act);
  g.appendChild(right);
  body.appendChild(g);

  openModal(p.name, body, []);
  setTimeout(()=>{
    const a=$('#pl-act'); if(!a)return;
    const mk=(t,fn,cls)=>{const b=el('button','btn sm '+(cls||''),t);b.onclick=fn;a.appendChild(b)};
    if(mine){
      mk('Offer new contract',()=>contractDialog(p));
      mk(p.transferListed?'Remove from transfer list':'Add to transfer list',()=>{p.transferListed=!p.transferListed;toast(p.transferListed?'Listed for transfer':'Removed from list');closeModal();render()});
      mk(p.loanListed?'Remove from loan list':'Offer out on loan',()=>{p.loanListed=!p.loanListed;toast('Updated');closeModal()});
      const sel=el('select','');
      sel.innerHTML=INDIV_FOCI.map(f=>`<option ${p.training===f?'selected':''}>${f}</option>`).join('');
      sel.onchange=()=>{p.training=sel.value;toast('Training focus set to '+sel.value)};
      const lbl=el('div','',`<div class="eyebrow" style="margin-top:6px;margin-bottom:3px">Individual training</div>`);
      lbl.appendChild(sel); a.appendChild(lbl);
      if(p.contract.years<=0.1) mk('Release player',()=>{makeFreeAgent(p);toast('Released');closeModal();render()},'danger');
    } else {
      const has=G.interest.has(p.id);
      mk(has?'Interest registered ✓':'Register interest',()=>{
        const r=registerInterest(p.id);
        if(r){ toast('Interest registered — check your inbox'); closeModal(); showPlayer(p.id) }
      },has?'':'primary');
      const inSL=G.shortlist.has(p.id);
      mk(inSL?'Remove from shortlist':'Add to shortlist',()=>{inSL?G.shortlist.delete(p.id):G.shortlist.add(p.id);toast(inSL?'Removed':'Shortlisted');closeModal()});
      const sc=G.scouting.find(s=>s.player===p.id);
      const depth=sc?sc.depth:0;
      if(depth<3) mk('Scout further ('+money([15000,40000,90000][depth])+')',()=>{scoutPlayer(p.id);closeModal();showPlayer(p.id)});
      else a.appendChild(el('div','faint','Fully scouted.'));
      const live=dealFor(p.id);
      if(live && !live.dead) mk('Open negotiation — '+(STAGE_LABEL[live.stage]||''),()=>dealDialog(live.id),'primary');
      else if(p.club<0) mk('Offer a contract',()=>freeAgentDialog(p.id),'primary');
      else if(G.window.open) mk('Make an offer',()=>bidDialog(p),'primary');
      else a.appendChild(el('div','faint','Transfer window closed.'));
    }
  },0);
}

function drawPitch(c){
  const t=c.tactic, ptc=$('#t-pitch'); if(!ptc)return;
  Array.from(ptc.querySelectorAll('.pp')).forEach(e=>e.remove());
  const slots=FORMATIONS[t.formation];
  slots.forEach((s,i)=>{
    const id=t.xi[i]; const p=id!=null?G.playerById.get(id):null;
    const d=el('div','pp'+(tacSel&&tacSel.type==='xi'&&tacSel.ref===i?' sel':''));
    d.style.left=s[1]+'%'; d.style.bottom=(s[2]*0.92+4)+'%';
    d.innerHTML=`<div class="dot">${p?p.squadNum:'–'}</div>
      <div class="nm">${p?esc(shortName(p)):'<span class="faint">Empty</span>'}</div>
      <div class="rl">${s[0]}${p&&t.roles[p.id]?' · '+roleAbbr(t.roles[p.id]):''}</div>`;
    d.title=p?p.name+' — '+(t.roles[p.id]||s[0])+' · drag to swap, right-click for role':'Empty slot — drag a player here';
    d.onclick=()=>handleSlotClick('xi',i,c);
    d.oncontextmenu=e=>{e.preventDefault();if(p)roleDialog(p,s[0],c)};
    d.draggable=true;
    d.addEventListener('dragstart',e=>{
      DRAG={type:'xi',ref:i}; d.classList.add('drag');
      e.dataTransfer.effectAllowed='move';
      try{e.dataTransfer.setData('text/plain','xi:'+i)}catch(_){}
    });
    d.addEventListener('dragend',()=>{d.classList.remove('drag');clearDropHints()});
    d.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';d.classList.add('over')});
    d.addEventListener('dragleave',()=>d.classList.remove('over'));
    d.addEventListener('drop',e=>{
      e.preventDefault(); d.classList.remove('over');
      if(!DRAG)return;
      const a=DRAG; DRAG=null; tacSel=null;
      applySwap(a,{type:'xi',ref:i},c);
    });
    ptc.appendChild(d);
  });
  // bench
  const bl=$('#t-bench'); if(bl){
    bl.innerHTML='';
    const avail=c.squad.map(i=>G.playerById.get(i)).filter(p=>p&&!t.xi.includes(p.id));
    avail.sort((a,b)=>{
      const ai=t.subs.indexOf(a.id), bi=t.subs.indexOf(b.id);
      if(ai>=0&&bi>=0)return ai-bi; if(ai>=0)return -1; if(bi>=0)return 1;
      return effAbility(b)-effAbility(a);
    });
    const tb=el('table','',`<tbody>${avail.map((p,i)=>{
      const onBench=t.subs.includes(p.id);
      return `<tr class="clickable" data-bench="${p.id}" style="${onBench?'':'opacity:.5'}">
        <td class="num" style="width:26px">${p.squadNum}</td><td>${posChip(p.pos)}</td>
        <td>${esc(p.name)}</td>
        <td class="num">${starHTML(p.ca)}</td>
        <td class="num" style="color:${condCol(p.cond)}">${Math.round(p.cond)}%</td>
        <td>${p.inj?'<span class="chip l">INJ</span>':p.susp?'<span class="chip l">BAN</span>':onBench?'<span class="chip d">BENCH</span>':''}</td></tr>`}).join('')}</tbody>`);
    bl.appendChild(tb);
    Array.from(bl.querySelectorAll('[data-bench]')).forEach(tr=>{
      const pid=+tr.dataset.bench;
      tr.onclick=()=>handleSlotClick('bench',pid,c);
      tr.ondblclick=()=>{
        if(t.subs.includes(pid))t.subs=t.subs.filter(x=>x!==pid); else t.subs.push(pid);
        drawPitch(c)};
      tr.draggable=true;
      tr.addEventListener('dragstart',e=>{
        DRAG={type:'bench',ref:pid}; tr.classList.add('drag');
        e.dataTransfer.effectAllowed='move';
        try{e.dataTransfer.setData('text/plain','bench:'+pid)}catch(_){}
      });
      tr.addEventListener('dragend',()=>{tr.classList.remove('drag');clearDropHints()});
      tr.addEventListener('dragover',e=>{e.preventDefault();tr.classList.add('over')});
      tr.addEventListener('dragleave',()=>tr.classList.remove('over'));
      tr.addEventListener('drop',e=>{
        e.preventDefault(); tr.classList.remove('over');
        if(!DRAG)return; const a=DRAG; DRAG=null; tacSel=null;
        applySwap(a,{type:'bench',ref:pid},c);
      });
    });
  }
  // selects
  const sq=c.squad.map(i=>G.playerById.get(i)).filter(Boolean).sort((a,b)=>a.squadNum-b.squadNum);
  [['t-cap','captain'],['t-pen','penalties'],['t-cor','corners'],['t-fk','freekicks']].forEach(([id,key])=>{
    const s=$('#'+id); if(!s)return;
    s.innerHTML=sq.map(p=>`<option value="${p.id}" ${t[key]===p.id?'selected':''}>${esc(p.name)}</option>`).join('');
    s.onchange=()=>{t[key]=+s.value};
  });
  const fs=$('#t-form'); if(fs)fs.onchange=()=>{t.formation=fs.value;autoPick(c,t);render()};
  const au=$('#t-auto'); if(au)au.onclick=()=>{t.roles={};autoPick(c,t);render();toast('Best available XI selected')};
  [['t-ment','mentality'],['t-tempo','tempo'],['t-width','width'],['t-press','press'],['t-dline','dline'],['t-tack','tackling']]
    .forEach(([id,key])=>{const e=$('#'+id);if(e)e.oninput=()=>{t[key]=+e.value;render()}});
}
function roleAbbr(r){return r.split(' ').map(w=>w[0]).join('').slice(0,3).toUpperCase()}
let DRAG=null;
function clearDropHints(){ $$('.pp.over,tr.over').forEach(e=>e.classList.remove('over')) }

/** Swap two squad slots. Works for pitch↔pitch, pitch↔bench and bench↔pitch. */
function applySwap(a,b,c){
  const t=c.tactic;
  if(a.type===b.type && a.ref===b.ref){ drawPitch(c); return }
  if(a.type==='xi' && b.type==='xi'){
    const x=t.xi[a.ref]; t.xi[a.ref]=t.xi[b.ref]; t.xi[b.ref]=x;
  } else if(a.type==='xi' && b.type==='bench'){
    const out=t.xi[a.ref]; t.xi[a.ref]=b.ref;
    t.subs=t.subs.filter(x=>x!==b.ref); if(out!=null)t.subs.unshift(out);
    const slot=FORMATIONS[t.formation][a.ref][0];
    if(!t.roles[b.ref])t.roles[b.ref]=(ROLE_BY_POS[slot]||['Player'])[0];
  } else if(a.type==='bench' && b.type==='xi'){
    const out=t.xi[b.ref]; t.xi[b.ref]=a.ref;
    t.subs=t.subs.filter(x=>x!==a.ref); if(out!=null)t.subs.unshift(out);
    const slot=FORMATIONS[t.formation][b.ref][0];
    if(!t.roles[a.ref])t.roles[a.ref]=(ROLE_BY_POS[slot]||['Player'])[0];
  } else {
    const i=t.subs.indexOf(a.ref), j=t.subs.indexOf(b.ref);
    if(i>=0&&j>=0){ t.subs[i]=b.ref; t.subs[j]=a.ref }
  }
  drawPitch(c);
}
function handleSlotClick(type,ref,c){

}
