/* =========================================================================
   NEGOTIATIONS
   A transfer is settled in two separate conversations. First you agree a fee
   with the selling club — which takes them a few days to consider, and which
   they may reject outright or come back on with a higher demand. Only once
   the clubs have shaken hands does the player's side open: wages, contract
   length, and what you are promising him in the squad.
   ========================================================================= */

const SQUAD_ROLES = ['Star player','Important player','Squad player','Rotation option','Prospect'];
const ROLE_RANK = {'Star player':5,'Important player':4,'Squad player':3,'Rotation option':2,'Prospect':1};

/** Where a player would sit in a squad, and therefore what he expects to be told. */
function expectedRole(p, club){
  const sq = club.squad.map(i=>G.playerById.get(i))
    .filter(x=>x && !x.youth && x.id!==p.id).sort((a,b)=>b.ca-a.ca);
  let rank = sq.findIndex(x=>x.ca < p.ca);
  if(rank<0) rank = sq.length;
  if(p.age<=20 && rank>8) return 'Prospect';
  if(rank<=1) return 'Star player';
  if(rank<=5) return 'Important player';
  if(rank<=11) return 'Squad player';
  return 'Rotation option';
}

function dealById(id){ return G.deals.find(d=>d.id===id) }
function activeDeals(dir){ return G.deals.filter(d=>!d.dead && (!dir||d.dir===dir)) }
function dealFor(pid){ return G.deals.find(d=>!d.dead && d.player===pid) }

function logDeal(d,text){ d.log.push({day:G.day,date:new Date(G.date.getTime()),text}) }

const STAGE_LABEL = {
  awaiting_club:'Awaiting club response', club_rejected:'Bid rejected',
  club_counter:'Club wants more', club_agreed:'Fee agreed',
  awaiting_player:'Awaiting personal terms', player_counter:'Player wants more',
  complete:'Completed', withdrawn:'Withdrawn', expired:'Lapsed',
  received:'Offer received', we_countered:'Our demand sent',
  they_agreed:'They met our valuation', they_withdrew:'They walked away',
  player_deciding:'Player considering'
};
const STAGE_COL = {
  awaiting_club:'var(--flood)', club_counter:'var(--flood)', club_agreed:'var(--kit)',
  awaiting_player:'var(--flood)', player_counter:'var(--flood)', complete:'var(--kit)',
  club_rejected:'var(--danger)', withdrawn:'var(--chalk-faint)', expired:'var(--chalk-faint)',
  received:'var(--info)', we_countered:'var(--flood)', they_agreed:'var(--kit)',
  they_withdrew:'var(--chalk-faint)', player_deciding:'var(--flood)'
};

/* ---- outgoing: we bid for someone ------------------------------------ */
function submitBid(pid, fee, opts){
  opts = opts||{};
  const p = G.playerById.get(pid);
  const us = G.clubs[G.userClub];
  if(!p) return {ok:false,msg:'No such player.'};
  if(p.club===G.userClub) return {ok:false,msg:'He already plays for you.'};
  if(!G.window.open && !opts.loan) return {ok:false,msg:'The transfer window is closed.'};
  const existing = dealFor(pid);
  if(existing && existing.dir==='out' && ['awaiting_club','awaiting_player','player_deciding'].includes(existing.stage))
    return {ok:false,msg:'You already have a bid pending for '+p.name+'.'};
  if(fee > us.transferBudget)
    return {ok:false,msg:'That would take you past your transfer budget of '+money(us.transferBudget)+'.'};

  // free agents skip the club stage entirely
  if(p.club<0){
    const d = newDeal(pid, -1, G.userClub, 'out', 0);
    d.stage='club_agreed';
    logDeal(d,'He is a free agent — no fee is required. Personal terms can be opened whenever you like.');
    addNews('transfer','Free agent: '+p.name,
      p.name+' is available on a free transfer. Open personal terms whenever you are ready.',
      G.userClub,{deal:d.id,player:pid});
    return {ok:true,msg:'No fee required — go straight to personal terms.',deal:d};
  }

  const seller = G.clubs[p.club];
  const d = newDeal(pid, p.club, G.userClub, 'out', fee);
  d.loan = !!opts.loan;
  d.stage = 'awaiting_club';
  // bigger clubs and bigger fees take longer to come back
  d.respondAt = G.day + rint(1, 3) + (seller.rep>75?2:seller.rep>55?1:0) + (fee>2e7?1:0);
  logDeal(d,'Bid of '+money(fee)+' lodged with '+seller.name+'.');
  addRumour(pid, G.userClub, 0.55, 'We have lodged a formal bid.');
  seedRivalInterest(pid, 0.5);
  return {ok:true,msg:seller.name+' will consider your '+money(fee)+' bid. Expect an answer within a few days.',deal:d};
}

function newDeal(pid, sellerId, buyerId, dir, fee){
  const p=G.playerById.get(pid);
  const d = {
    id: hash('d'+pid+G.day+G.deals.length+RND()),
    player:pid, seller:sellerId, buyer:buyerId, dir,
    fee, wage:0, years:3, role:'Squad player',
    stage:'awaiting_club', respondAt:G.day+2, created:G.day,
    date:new Date(G.date.getTime()), log:[], dead:false, loan:false,
    askFee: sellerId>=0 ? askingPrice(p) : 0
  };
  G.deals.unshift(d);
  if(G.deals.length>150) G.deals=G.deals.filter(x=>!x.dead).concat(G.deals.filter(x=>x.dead).slice(0,40));
  return d;
}

/** Open personal terms — only possible once a fee has been agreed. */
function openTerms(dealId, wage, years, role){
  const d=dealById(dealId); if(!d) return {ok:false,msg:'That negotiation has closed.'};
  if(d.stage!=='club_agreed' && d.stage!=='player_counter')
    return {ok:false,msg:'You need to agree a fee with the club first.'};
  const p=G.playerById.get(d.player);
  d.wage=wage; d.years=years; d.role=role;
  d.stage='awaiting_player';
  d.respondAt=G.day + rint(1,3);
  logDeal(d,'Terms offered: '+wageStr(wage)+' over '+years+' years as a '+role.toLowerCase()+'.');
  return {ok:true,msg:p.name+'\'s representatives will come back to you shortly.'};
}

function withdrawDeal(dealId){
  const d=dealById(dealId); if(!d) return;
  d.stage='withdrawn'; d.dead=true;
  logDeal(d,'We withdrew from the negotiation.');
}

/* ---- how the selling club reacts -------------------------------------- */
function clubVerdict(d){
  const p=G.playerById.get(d.player);
  const seller=G.clubs[d.seller];
  const ask=askingPrice(p);
  d.askFee=ask;
  const stance=transferStance(p);
  const ratio=d.fee/Math.max(1,ask);

  if(d.loan){
    const willing=(!seller.tactic.xi.includes(p.id)||p.age<21)&&seller.squad.length>18;
    return willing ? {verdict:'accept'} : {verdict:'reject',reason:'They will not sanction a loan.'};
  }
  if(p.contract.release && d.fee>=p.contract.release)
    return {verdict:'accept',reason:'The release clause has been met, so they have no say in it.'};
  if(stance.code==='nfs' && ratio<1.9)
    return {verdict:'reject',reason:seller.name+' consider him untouchable and will not negotiate.'};
  if(ratio >= 0.98 + RND()*0.10) return {verdict:'accept'};
  if(ratio < 0.55) return {verdict:'reject',reason:'They regard the bid as derisory.'};
  // otherwise they name a price
  let want = ask * (stance.code==='reluctant'?1.22:stance.code==='listed'?1.0:1.10);
  want = Math.max(want, d.fee*1.12);
  return {verdict:'counter',counter:Math.round(want/50000)*50000};
}

/** What the player's camp makes of the terms. */
function playerVerdict(d){
  const p=G.playerById.get(d.player);
  const us=G.clubs[d.buyer];
  const wantWage=Math.round(expectedWage(p,us)*(1.0+ (p.transferListed?-0.05:0.06))/100)*100;
  const wantRole=expectedRole(p,us);
  const wageOK=d.wage >= wantWage*0.94;
  const roleOK=ROLE_RANK[d.role] >= ROLE_RANK[wantRole];
  const keen=playerWillJoin(p,us,d.wage);
  if(!keen && !(wageOK&&roleOK))
    return {verdict:'reject',reason:'He does not see the move as right for him at this stage.'};
  if(wageOK && roleOK) return {verdict:'accept'};
  return {verdict:'counter', wantWage, wantRole,
    reason:(!wageOK?'He is looking for '+wageStr(wantWage)+'. ':'')+
           (!roleOK?'He expects to be treated as a '+wantRole.toLowerCase()+'.':'')};
}

/* ---- incoming: someone bids for one of yours --------------------------- */
function incomingBid(){
  const u=G.clubs[G.userClub];
  const squad=u.squad.map(i=>G.playerById.get(i)).filter(p=>p&&!p.loanFrom);
  if(!squad.length) return;
  const p=pick(squad);
  if(dealFor(p.id)) return;
  const heat = p.transferListed ? 0.55 : clamp((p.ca-42)/95, 0.02, 0.32);
  if(RND()>heat) return;
  const suitors=G.clubs.filter(c=>c.id!==G.userClub && !c.nonLeague &&
    c.rep > u.rep-16 && c.transferBudget > p.value*0.8);
  if(!suitors.length) return;
  const buyer=pick(suitors);
  const fee=Math.round(askingPrice(p)*(0.72+RND()*0.45)/50000)*50000;
  const d=newDeal(p.id, G.userClub, buyer.id, 'in', fee);
  d.stage='received';
  d.respondAt=G.day+99;                     // waiting on us, not them
  d.expires=G.day+rint(7,12);
  d.wage=Math.round(expectedWage(p,buyer)/100)*100;
  logDeal(d,buyer.name+' bid '+money(fee)+'.');
  addRumour(p.id, buyer.id, 0.5);
  addNews('transfer','Bid received for '+p.name,
    buyer.name+' have offered '+money(fee)+' for '+p.name+'.\n\n'+
    'Your valuation is '+money(askingPrice(p))+'. They would put him on '+wageStr(d.wage)+'.\n\n'+
    'You can accept, hold out for a higher fee, or reject the approach outright.',
    G.userClub,{deal:d.id,player:p.id});
}

/** Accept, reject, or demand more for a player of ours. */
function answerIncoming(dealId, action, demand){
  const d=dealById(dealId); if(!d||d.dir!=='in') return {ok:false,msg:'That offer has lapsed.'};
  const p=G.playerById.get(d.player);
  const buyer=G.clubs[d.buyer];
  if(action==='reject'){
    d.stage='they_withdrew'; d.dead=true;
    logDeal(d,'We rejected the approach.');
    if(RND()<0.3 && !p.transferListed){ p.unhappy=Math.min(3,(p.unhappy||0)+1);
      addNews('squad','Unsettled',p.name+' is unhappy that the move to '+buyer.name+' was blocked.',G.userClub,{player:p.id}) }
    return {ok:true,msg:'Approach rejected.'};
  }
  if(action==='demand'){
    d.fee=Math.max(d.fee, demand||askingPrice(p));
    d.stage='we_countered';
    d.respondAt=G.day+rint(1,3);
    logDeal(d,'We told them it would take '+money(d.fee)+'.');
    return {ok:true,msg:'You have told '+buyer.name+' it will take '+money(d.fee)+'. They will come back to you.'};
  }
  // accept — the player still has to want it
  d.stage='player_deciding';
  d.respondAt=G.day+rint(1,2);
  logDeal(d,'We accepted '+money(d.fee)+'. '+p.name+' is now weighing up personal terms with them.');
  return {ok:true,msg:'Fee accepted. '+p.name+' will now discuss terms with '+buyer.name+'.'};
}

/* ---- the daily tick that moves everything along ------------------------ */
function dealTick(){
  G.deals.forEach(d=>{
    if(d.dead) return;
    const p=G.playerById.get(d.player);
    if(!p){ d.dead=true; return }
    if(d.expires && G.day>d.expires && d.dir==='in' && d.stage==='received'){
      d.stage='they_withdrew'; d.dead=true;
      logDeal(d,'The offer lapsed.');
      addNews('transfer','Offer withdrawn',
        G.clubs[d.buyer].name+' have withdrawn their interest in '+p.name+' after hearing nothing back.',
        G.userClub,{player:p.id});
      return;
    }
    if(G.day < d.respondAt) return;

    /* ---------- our bids ---------- */
    if(d.dir==='out'){
      if(d.stage==='awaiting_club'){
        const v=clubVerdict(d);
        const seller=d.seller>=0?G.clubs[d.seller]:null;
        if(v.verdict==='accept'){
          d.stage='club_agreed';
          logDeal(d,(seller?seller.name:'They')+' accepted '+money(d.fee)+'.');
          addNews('transfer','Fee agreed for '+p.name,
            (seller?seller.name:'His club')+' have accepted your '+money(d.fee)+' bid'+
            (v.reason?' — '+v.reason:'')+'.\n\nYou can now open personal terms with '+p.name+'.',
            G.userClub,{deal:d.id,player:p.id});
        } else if(v.verdict==='counter'){
          d.stage='club_counter'; d.counter=v.counter;
          logDeal(d,'They value him at '+money(v.counter)+'.');
          addNews('transfer','Counter-offer for '+p.name,
            (seller?seller.name:'His club')+' have turned down '+money(d.fee)+' but say '+
            money(v.counter)+' would get it done.\n\nYou can meet their valuation, go back with '+
            'something else, or walk away.',G.userClub,{deal:d.id,player:p.id});
        } else {
          d.stage='club_rejected'; d.dead=true;
          logDeal(d,'Bid rejected. '+(v.reason||''));
          addNews('transfer','Bid rejected — '+p.name,
            (seller?seller.name:'His club')+' have rejected your bid. '+(v.reason||''),
            G.userClub,{player:p.id});
        }
        return;
      }
      if(d.stage==='awaiting_player'){
        const v=playerVerdict(d);
        if(v.verdict==='accept'){
          if(d.loan) doLoan(p, d.buyer, d.wage);
          else completeTransfer(p, d.buyer, d.fee, d.wage, d.years);
          p.squadRole=d.role;
          d.stage='complete'; d.dead=true;
          logDeal(d,'Deal done.');
        } else if(v.verdict==='counter'){
          d.stage='player_counter'; d.wantWage=v.wantWage; d.wantRole=v.wantRole;
          logDeal(d,'His camp came back: '+v.reason);
          addNews('transfer','Terms rejected — '+p.name,
            p.name+'\'s representatives have come back to us. '+v.reason+
            '\n\nThe fee is still agreed, so you can revise your offer.',
            G.userClub,{deal:d.id,player:p.id});
        } else {
          d.stage='withdrawn'; d.dead=true;
          logDeal(d,'He turned the move down.');
          addNews('transfer','Move rejected — '+p.name,
            p.name+' has turned down the move. '+(v.reason||''),G.userClub,{player:p.id});
        }
        return;
      }
      // an unanswered counter eventually goes cold
      if((d.stage==='club_counter'||d.stage==='player_counter') && G.day>d.respondAt+14){
        d.stage='expired'; d.dead=true;
        logDeal(d,'The negotiation went cold.');
      }
      return;
    }

    /* ---------- bids for our players ---------- */
    if(d.stage==='we_countered'){
      const buyer=G.clubs[d.buyer];
      const worth=askingPrice(p);
      const stretch=d.fee/Math.max(1,worth);
      const canAfford=d.fee<=buyer.transferBudget;
      if(canAfford && stretch<1.25 && RND()<0.7){
        d.stage='player_deciding'; d.respondAt=G.day+rint(1,2);
        logDeal(d,buyer.name+' met our '+money(d.fee)+' valuation.');
        addNews('transfer','Valuation met',
          buyer.name+' have agreed to pay '+money(d.fee)+' for '+p.name+
          '. He is now discussing personal terms with them.',G.userClub,{deal:d.id,player:p.id});
      } else {
        d.stage='they_withdrew'; d.dead=true;
        logDeal(d,buyer.name+' walked away.');
        addNews('transfer','They walked away',
          buyer.name+' were not prepared to go to '+money(d.fee)+' for '+p.name+
          ' and have ended their interest.',G.userClub,{player:p.id});
      }
      return;
    }
    if(d.stage==='player_deciding'){
      const buyer=G.clubs[d.buyer];
      if(playerWillJoin(p,buyer,d.wage)){
        const fee=d.fee;
        completeTransfer(p, d.buyer, fee, d.wage, rint(2,5));
        d.stage='complete'; d.dead=true;
        logDeal(d,'He signed.');
      } else {
        d.stage='they_withdrew'; d.dead=true;
        logDeal(d,'He could not agree terms with them.');
        addNews('transfer','Move collapsed',
          p.name+' could not agree personal terms with '+buyer.name+'. He stays.',
          G.userClub,{player:p.id});
      }
    }
  });
  G.deals=G.deals.filter(d=>!d.dead || (G.day-d.created)<45);
}

/* ---- free agents ------------------------------------------------------- */
/** Offer a contract to a player with no club. */
function signFreeAgent(pid, wage, years, role){
  const p=G.playerById.get(pid);
  const us=G.clubs[G.userClub];
  if(!p||p.club>=0) return {ok:false,msg:'He is not a free agent.'};
  let d=G.deals.find(x=>!x.dead&&x.player===pid&&x.dir==='out');
  if(!d){ d=newDeal(pid,-1,G.userClub,'out',0); d.stage='club_agreed' }
  const r=openTerms(d.id, wage, years, role);
  if(r.ok) addNews('transfer','Contract offered to '+p.name,
    'We have offered '+p.name+' a '+years+'-year deal worth '+wageStr(wage)+
    ' as a '+role.toLowerCase()+'. He will come back to us within a few days.',
    G.userClub,{deal:d.id,player:pid});
  return r;
}

/* =========================================================================
   NEGOTIATION UI
   ========================================================================= */
function stageChip(d){
  const l=STAGE_LABEL[d.stage]||d.stage, c=STAGE_COL[d.stage]||'var(--chalk)';
  return `<span class="chip" style="border-color:${c};color:${c}">${esc(l)}</span>`;
}
function waitingNote(d){
  if(d.dead) return '';
  if(d.stage==='awaiting_club'||d.stage==='awaiting_player'||d.stage==='we_countered'||d.stage==='player_deciding'){
    const days=Math.max(0,d.respondAt-G.day);
    return days<=0 ? 'Response due today' : 'Response in about '+days+' day'+(days===1?'':'s');
  }
  return 'Waiting on you';
}

function vNegotiations(){
  const live=activeDeals().sort((a,b)=>a.dir===b.dir?b.created-a.created:(a.dir==='in'?-1:1));
  const done=G.deals.filter(d=>d.dead).slice(0,12);
  const wrap=el('div');
  const p=el('div','panel');
  p.innerHTML=`<div class="panel-h"><h3>Live negotiations</h3>
    <span class="faint">Clubs first, then the player</span></div>
    <div class="tbl-wrap">${live.length?`<table><thead><tr><th>Player</th><th>Direction</th>
    <th>Other club</th><th class="num">Fee</th><th>Stage</th><th>Next</th><th class="locked"></th></tr></thead><tbody>
    ${live.map(d=>{const pl=G.playerById.get(d.player); if(!pl)return '';
      const other=d.dir==='out'?(d.seller>=0?G.clubs[d.seller]:null):G.clubs[d.buyer];
      return `<tr><td>${esc(pl.name)} ${posChip(pl.pos)}</td>
      <td class="dim">${d.dir==='out'?'Our bid':'Bid for ours'}</td>
      <td>${other?crestSmall(other)+esc(other.name):'<span class="faint">Free agent</span>'}</td>
      <td class="num" data-sv="${d.counter||d.fee}">${money(d.counter||d.fee)}</td>
      <td data-sv="${d.stage}">${stageChip(d)}</td>
      <td class="faint">${esc(waitingNote(d))}</td>
      <td><button class="btn sm" data-deal="${d.id}">Open</button></td></tr>`}).join('')}
    </tbody></table>`:'<div class="empty">Nothing on the table. Bid for someone, or wait for offers to arrive.</div>'}</div>`;
  wrap.appendChild(p);
  if(done.length){
    const h=el('div','panel');
    h.innerHTML=`<div class="panel-h"><h3>Concluded</h3></div><div class="tbl-wrap"><table><tbody>
      ${done.map(d=>{const pl=G.playerById.get(d.player);
        return `<tr><td>${pl?esc(pl.name):'—'}</td><td>${stageChip(d)}</td>
        <td class="num">${money(d.fee)}</td>
        <td class="faint">${esc((d.log[d.log.length-1]||{}).text||'')}</td></tr>`}).join('')}
      </tbody></table></div>`;
    wrap.appendChild(h);
  }
  setTimeout(()=>$$('[data-deal]').forEach(b=>b.onclick=()=>dealDialog(b.dataset.deal)),0);
  return wrap;
}

    <div style="flex:1"><h2>${esc(p.name)}</h2>

  if(d.dir==='out'){

    form=`<div class="grid g2" style="margin-bottom:6px">
      <div class="panel" style="margin:0"><div class="panel-h"><h3>1 · The club</h3>

        <div class="panel-b">
          <div class="kv"><span>Your bid</span><b>${money(d.fee)}</b></div>
          <div class="kv"><span>Their valuation</span><b>${money(d.counter||d.askFee)}</b></div>
          <div class="kv"><span>Transfer budget</span><b>${money(us.transferBudget)}</b></div>
          ${!feeAgreed?`<div class="eyebrow" style="margin-top:10px;margin-bottom:3px">Revised bid (£)</div>
            <input id="dl-fee" type="number" value="${d.counter||d.fee}" style="width:100%">`:''}
        </div></div>
      <div class="panel" style="margin:0;${feeAgreed?'':'opacity:.45;pointer-events:none'}">
        <div class="panel-h"><h3>2 · The player</h3>
          ${feeAgreed?'':'<span class="faint">Locked until a fee is agreed</span>'}</div>
        <div class="panel-b">
          <div class="kv"><span>Expected wage</span><b>${wageStr(d.wantWage||Math.round(expectedWage(p,us)/100)*100)}</b></div>
          <div class="kv"><span>Expected role</span><b>${esc(d.wantRole||expectedRole(p,us))}</b></div>
          <div class="eyebrow" style="margin-top:10px;margin-bottom:3px">Wage (£/wk)</div>
          <input id="dl-wage" type="number" value="${d.wage||d.wantWage||Math.round(expectedWage(p,us)/100)*100}" style="width:100%">
          <div class="eyebrow" style="margin-top:8px;margin-bottom:3px">Contract length</div>
          <select id="dl-yrs" style="width:100%">${[1,2,3,4,5].map(y=>`<option ${((d.years||3)===y)?'selected':''}>${y}</option>`).join('')}</select>
          <div class="eyebrow" style="margin-top:8px;margin-bottom:3px">Role in the squad</div>
          <select id="dl-role" style="width:100%">${SQUAD_ROLES.map(r=>`<option ${((d.role||'Squad player')===r)?'selected':''}>${r}</option>`).join('')}</select>
        </div></div></div>
      <div id="dl-msg" class="dim" style="min-height:18px;margin-top:8px"></div>`;

    if(d.stage==='club_counter'){
      actions.push({label:'Meet their valuation',primary:true,fn:()=>{
        const r=submitBidRevised(d, d.counter);
        $('#dl-msg').innerHTML=noteHTML(r); if(r.ok)setTimeout(()=>{closeModal();render()},900);
      }});
      actions.push({label:'Send revised bid',fn:()=>{
        const r=submitBidRevised(d, +$('#dl-fee').value);
        $('#dl-msg').innerHTML=noteHTML(r); if(r.ok)setTimeout(()=>{closeModal();render()},900);

      }});
    }
  }
  b.innerHTML=head+form+timeline;

}
function noteHTML(r){ return `<span style="color:${r.ok?'var(--kit)':'var(--danger)'}">${esc(r.msg)}</span>` }

/** Re-bid within an existing negotiation. */
function submitBidRevised(d, fee){
  const us=G.clubs[G.userClub];
  if(fee>us.transferBudget) return {ok:false,msg:'That exceeds your transfer budget of '+money(us.transferBudget)+'.'};
  if(fee<=d.fee) return {ok:false,msg:'That is no better than your last bid.'};
  d.fee=fee; d.counter=null; d.stage='awaiting_club';
  d.respondAt=G.day+rint(1,3);
  logDeal(d,'Revised bid of '+money(fee)+' submitted.');
  return {ok:true,msg:'Revised bid of '+money(fee)+' sent. They will come back to you.'};
}

/* =========================================================================
   SCOUT ASSIGNMENTS
   Rather than looking players up one at a time, you can put a scout on a
   brief — a position, a budget, an age ceiling, a part of the world — and
   he works through the database over the following weeks, sending back
   names as he finds them.
   ========================================================================= */

const SCOUT_REGIONS = {
  home:   {label:'England only',        test:c=>c.country==='ENG'},
  britain:{label:'Britain & Ireland',   test:c=>['ENG'].includes(c.country)},
  europe: {label:'Continental Europe',  test:c=>c.country!=='ENG'},
  world:  {label:'Worldwide',           test:()=>true}
};

/** How many briefs you can run at once, and how fast they progress. */
function scoutCapacity(){
  const rep=G.clubs[G.userClub].rep;
  return { slots: clamp(Math.round(2 + rep/22), 2, 6), speed: 9 + rep/6 };
}

function newAssignment(spec){
  const cap=scoutCapacity();
  if(G.assignments.filter(a=>!a.done).length>=cap.slots)
    return {ok:false,msg:'All '+cap.slots+' of your scouts are already out on assignment.'};
  const a={
    id: hash('sa'+G.day+spec.pos+RND()),
    pos: spec.pos, maxAge: spec.maxAge, maxFee: spec.maxFee,
    minPot: spec.minPot||0, region: spec.region||'world',
    progress: 0, found: [], seen: [], created: G.day, done:false,
    label: spec.pos+' · '+(SCOUT_REGIONS[spec.region]||SCOUT_REGIONS.world).label
  };
  G.assignments.unshift(a);
  addNews('scout','Scout dispatched — '+a.pos,
    'A scout has been sent out looking for a '+a.pos+'.\n\n'+
    'Brief: under '+a.maxAge+', up to '+money(a.maxFee)+', '+
    (SCOUT_REGIONS[a.region]||SCOUT_REGIONS.world).label.toLowerCase()+'.\n\n'+
    'He will report back with names as he works through them. Expect the first '+
    'recommendations within a couple of weeks.', G.userClub, {assignment:a.id});
  return {ok:true,msg:'Scout assigned. Reports will start arriving shortly.',assignment:a};
}

function cancelAssignment(id){
  const a=G.assignments.find(x=>x.id===id);
  if(a){ a.done=true; a.cancelled=true }
}

/** Score a candidate against the brief — ability now, plus room to grow. */
function assignmentScore(p, a, baseline){
  const room=Math.max(0,p.pa-p.ca);
  let s = p.ca + room*(p.age<=21?0.85:p.age<=24?0.5:0.2);
  s -= Math.max(0, p.age-27)*1.6;                        // prefer someone with a future
  s -= Math.max(0, (p.ca-baseline-14))*0.8;              // wildly out of our league
  if(p.transferListed) s+=3;
  if(p.club===-1) s+=4;
  if(p.contract.years<1) s+=3;
  return s;
}

/** Weekly: every live brief advances, and periodically produces names. */
function scoutAssignmentTick(){
  if(!G.assignments.length) return;
  const cap=scoutCapacity();
  const us=G.clubs[G.userClub];
  const baseline=BASELINE||60;

  G.assignments.forEach(a=>{
    if(a.done) return;
    a.progress += cap.speed*(0.75+RND()*0.5);
    if(a.progress < 100) return;
    a.progress -= 100;

    const region=(SCOUT_REGIONS[a.region]||SCOUT_REGIONS.world).test;
    const pool=G.players.filter(p=>
      p.pos===a.pos && p.club!==G.userClub && !p.loanFrom &&
      p.age<=a.maxAge && a.seen.indexOf(p.id)<0 &&
      (p.club<0 || (G.clubs[p.club] && !G.clubs[p.club].nonLeague && region(G.clubs[p.club]))) &&
      askingPrice(p) <= a.maxFee &&
      (!a.minPot || p.pa >= a.minPot)
    );
    if(!pool.length){
      if(!a.exhausted){
        a.exhausted=true;
        addNews('scout','Nothing left to look at — '+a.pos,
          'Your scout has worked through everyone matching that brief. '+
          'Widening the budget, the age limit or the search area would give him more to go at.',
          G.userClub,{assignment:a.id});
      }
      return;
    }
    a.exhausted=false;

    // A useful shortlist mixes players who could come in now with ones worth
    // developing, so rank both ways and take from each.
    const noise=()=>gauss()*3.0;
    const readyNow=pool.map(p=>({p, s:p.ca - Math.max(0,p.age-29)*2 + noise()}))
      .sort((x,y)=>y.s-x.s);
    const forLater=pool.map(p=>({p, s:assignmentScore(p,a,baseline)+noise()}))
      .sort((x,y)=>y.s-x.s);
    const batch=[]; const taken=new Set();
    const take=list=>{ for(const c of list){ if(!taken.has(c.p.id)){taken.add(c.p.id);batch.push(c);return} } };
    take(readyNow);
    if(RND()<0.75) take(forLater);
    if(RND()<0.35) take(RND()<0.5?readyNow:forLater);
    const lines=[];
    batch.forEach(({p})=>{
      a.seen.push(p.id);
      a.found.unshift({player:p.id, day:G.day, note:scoutBlurb(p, baseline)});
      // a scouted player is at least partly known to us
      let sc=G.scouting.find(x=>x.player===p.id);
      if(!sc){ sc={player:p.id,depth:1,started:G.day}; G.scouting.push(sc) }
      G.shortlist.add(p.id);
      lines.push('• '+p.name+'  ('+p.pos+', '+p.age+', '+p.nat+') — '+
        (p.club>=0?G.clubs[p.club].name:'free agent')+
        '\n   '+scoutBlurb(p, baseline)+
        '\n   Asking around '+money(askingPrice(p))+', currently on '+wageStr(p.contract.wage));
    });
    if(a.found.length>40) a.found.length=40;
    addNews('scout','Scout report — '+a.pos+' ('+batch.length+' name'+(batch.length===1?'':'s')+')',
      'Working through the '+(SCOUT_REGIONS[a.region]||SCOUT_REGIONS.world).label.toLowerCase()+
      ' brief for a '+a.pos+', your scout recommends:\n\n'+lines.join('\n\n')+
      '\n\nAll of them have been added to your shortlist.',
      G.userClub,{assignment:a.id, player:batch[0].p.id});
  });
  G.assignments=G.assignments.filter(a=>!a.done || (G.day-a.created)<120);
}

/** A sentence of scout's-eye judgement on a recommendation. */
function scoutBlurb(p, baseline){
  const room=p.pa-p.ca;
  const rel=p.ca-baseline;
  const bits=[];
  if(rel>=10) bits.push('Comfortably better than what we have');
  else if(rel>=3) bits.push('Would improve the first eleven');
  else if(rel>=-3) bits.push('Around the level of our current group');
  else bits.push('One for the depth of the squad');
  if(p.age<=20 && room>14) bits.push('and there is a lot more to come');
  else if(room>10) bits.push('with room to grow yet');
  else if(p.age>=30) bits.push('though he is into the back end of his career');
  const at=p.attrs;
  const best=Object.keys(at).sort((x,y)=>at[y]-at[x]).slice(0,2);
  bits.push('Strongest at '+best.join(' and ').toLowerCase());
  if(p.contract.years<1) bits.push('and his deal is nearly up');
  else if(p.transferListed) bits.push('and he is available');
  return bits.join(', ')+'.';
}

let LIVE=null, MTIMER=null, MSPEED=2;
const SPEED_MS=[0,520,190,55];

function startMatch(fixture){
  const M=createMatch(fixture.home,fixture.away,fixture.comp,{neutral:fixture.neutral});
  LIVE={M,fixture};
  const us=userSide(M);
  $('#mv-hc').outerHTML=crestHTML(M.home,30).replace('class="crest"','class="crest" id="mv-hc"');
  $('#mv-ac').outerHTML=crestHTML(M.away,30).replace('class="crest"','class="crest" id="mv-ac"');
  $('#mv-hn').textContent=M.home.name; $('#mv-an').textContent=M.away.name;
  $('#mv-score').textContent='0 – 0'; $('#mv-clock').textContent='KICK OFF';
  $('#m-feed').innerHTML='';
  $('#mv-done').disabled=true;
  $('#matchview').classList.add('on');
  const compName={league:DIVS[M.home.div],efl:'EFL Cup',fa:'FA Cup',UCL:'Champions League',UEL:'Europa League',UECL:'Conference League'}[fixture.comp]||'';
  feedLine(0,compName+(fixture.neutral?' — Final':'')+' · '+M.home.name+' v '+M.away.name,'sys');
  renderMatchSide();
  setSpeed(G.settings.speed!=null?G.settings.speed:MSPEED);
}

function feedLine(min,txt,cls){
  const f=$('#m-feed');
  const d=el('div','ev '+(cls||''),`<div class="min">${min?min+"'":''}</div><div class="txt">${esc(txt)}</div>`);
  f.appendChild(d); f.scrollTop=f.scrollHeight;
  while(f.children.length>400)f.removeChild(f.firstChild);
}

function setSpeed(s){
  MSPEED=s;
  $$('#mv-speed button').forEach(b=>b.classList.toggle('on',+b.dataset.s===s));
  if(MTIMER){clearInterval(MTIMER);MTIMER=null}
  if(s>0&&LIVE&&!LIVE.M.done) MTIMER=setInterval(tickMatch,SPEED_MS[s]);
}

function tickMatch(){
  const M=LIVE.M;
  const total=90+M.addedTime;
  if(M.minute>=total){ endLiveMatch(); return }
  const before=M.events.length;
  simMinute(M);
  for(let i=before;i<M.events.length;i++){const e=M.events[i];feedLine(e.min,e.txt,e.cls)}
  $('#mv-score').textContent=M.score[0]+' – '+M.score[1];
  $('#mv-clock').textContent=(M.minute>90?"90+"+(M.minute-90):M.minute)+"'";
  if(M.minute===45) $('#mv-clock').textContent='HALF TIME';
  renderMatchSide();
}

function endLiveMatch(){
  if(MTIMER){clearInterval(MTIMER);MTIMER=null}
  const M=LIVE.M;
  if(M.done) return;
  finaliseMatch(M);
  feedLine(90,'Full time. '+M.home.short+' '+M.score[0]+'–'+M.score[1]+' '+M.away.short,'sys');
  $('#mv-clock').textContent='FULL TIME';
  $('#mv-done').disabled=false;
  renderMatchSide();
}

function renderMatchSide(){
  const M=LIVE.M; const s=$('#m-side');
  const bar=(label,a,b,fmt)=>{
    const t=(a+b)||1;
    return `<div class="m-bar"><span class="mono">${fmt?fmt(a):a}</span>
      <div class="t"><i style="width:${a/t*100}%;background:var(--flood)"></i><i style="width:${b/t*100}%;background:var(--chalk-faint)"></i></div>
      <span class="mono" style="text-align:right">${fmt?fmt(b):b}</span></div>
      <div class="eyebrow" style="text-align:center;margin:-4px 0 8px">${label}</div>`;
  };
  const S=M.stats;
  const posA=M.stats[0].poss||1, posB=M.stats[1].poss||1;
  const usSide=userSide(M);
  let html=`<div class="eyebrow" style="margin-bottom:8px">Match stats</div>
    ${bar('Possession',posA,posB,v=>Math.round(v/(posA+posB)*100)+'%')}
    ${bar('Shots',S[0].shots,S[1].shots)}
    ${bar('On target',S[0].ontarget,S[1].ontarget)}
    ${bar('Expected goals',Math.round(S[0].xg*100),Math.round(S[1].xg*100),v=>(v/100).toFixed(2))}
    ${bar('Corners',S[0].corners,S[1].corners)}
    ${bar('Fouls',S[0].fouls,S[1].fouls)}
    ${bar('Cards',S[0].yellow+S[0].red,S[1].yellow+S[1].red)}`;
  if(usSide>=0){
    const onp=M.onPitch[usSide].map(id=>G.playerById.get(id)).filter(Boolean);
    html+=`<div class="eyebrow" style="margin:14px 0 6px">Your players</div><table><tbody>`+
      onp.map(p=>`<tr><td>${posChip(p.pos)}</td><td style="font-size:11.5px">${esc(shortName(p))}</td>
        <td class="num" style="color:${condCol(p.cond)}">${Math.round(p.cond)}%</td>
        <td class="num">${(M.mrat[usSide][p.id]||6.5).toFixed(1)}</td>
        <td>${M.cards[usSide][p.id]===1?'<span style="color:var(--flood)">▮</span>':M.cards[usSide][p.id]===2?'<span style="color:var(--danger)">▮</span>':''}</td></tr>`).join('')+
      `</tbody></table><div class="faint" style="margin-top:6px;font-size:10.5px">Subs used ${M.subsUsed[usSide]}/5</div>`;
  }
  s.innerHTML=html;
}

function subsDialog(){
  const M=LIVE.M, side=userSide(M);
  if(side<0){toast('You are not managing in this match.');return}
  if(M.subsUsed[side]>=5){toast('No substitutions remaining.');return}
  const b=el('div');
  const on=M.onPitch[side].map(id=>G.playerById.get(id)).filter(Boolean);
  const bench=benchAvailable(M,side).map(id=>G.playerById.get(id)).filter(Boolean);
  let selOff=null,selOn=null;
  b.innerHTML=`<div class="grid g2">
    <div><div class="eyebrow" style="margin-bottom:5px">On the pitch</div><div id="s-on"></div></div>
    <div><div class="eyebrow" style="margin-bottom:5px">Bench</div><div id="s-bench"></div></div></div>
    <div id="s-msg" class="dim" style="margin-top:11px;min-height:18px"></div>`;
  openModal('Substitutions ('+(5-M.subsUsed[side])+' left)',b,[{label:'Make substitution',primary:true,fn:()=>{
    if(selOff==null||selOn==null){$('#s-msg').textContent='Pick one player from each column.';return}
    const off=G.playerById.get(selOff);
    M.S[side].club.tactic.subs=Array.from(new Set([selOn].concat(M.S[side].club.tactic.subs)));
    const made=makeSub(M,side,selOff,false);
    if(made){feedLine(M.minute,'Substitution, '+M.S[side].club.short+': '+shortName(made)+' on for '+shortName(off),'sys');closeModal();renderMatchSide()}
    else $('#s-msg').textContent='That substitution could not be made.';
  }}]);
  setTimeout(()=>{
    const oc=$('#s-on'),bc=$('#s-bench');
    on.forEach(p=>{const d=el('div','club-opt',`${posChip(p.pos)} ${esc(p.name)} <span class="faint" style="margin-left:auto">${Math.round(p.cond)}%</span>`);
      d.style.display='flex';d.onclick=()=>{selOff=p.id;Array.from(oc.children).forEach(x=>x.classList.remove('on'));d.classList.add('on')};oc.appendChild(d)});
    bench.forEach(p=>{const d=el('div','club-opt',`${posChip(p.pos)} ${esc(p.name)} <span class="faint" style="margin-left:auto">${p.ca}</span>`);
      d.style.display='flex';d.onclick=()=>{selOn=p.id;Array.from(bc.children).forEach(x=>x.classList.remove('on'));d.classList.add('on')};bc.appendChild(d)});
  },0);
}

function inMatchTactics(){
  const M=LIVE.M, side=userSide(M);
  if(side<0){toast('You are only watching this one.');return}
  const c=M.S[side].club, t=c.tactic;
  const b=el('div');
  const sl=(id,label,val,opts)=>`<div style="margin-bottom:10px">
    <div style="display:flex;justify-content:space-between"><span class="eyebrow">${label}</span><b class="mono" id="${id}-v" style="font-size:11px">${opts[val]}</b></div>
    <input type="range" id="${id}" min="0" max="${opts.length-1}" value="${val}" style="width:100%"></div>`;
  b.innerHTML=sl('im-ment','Mentality',t.mentality,MENTALITIES)+
    sl('im-tempo','Tempo',t.tempo,['Much lower','Lower','Standard','Higher','Much higher'])+
    sl('im-press','Pressing',t.press,['Much less','Less','Standard','More','Much more'])+
    sl('im-dline','Defensive line',t.dline,['Much deeper','Deeper','Standard','Higher','Much higher'])+
    sl('im-tack','Tackling',t.tackling,['Stay on feet','Normal','Get stuck in'])+
    `<div class="faint" style="margin-top:8px">Changes take effect immediately.</div>`;
  openModal('In-match tactics',b,[{label:'Apply',primary:true,fn:()=>{
    t.mentality=+$('#im-ment').value;t.tempo=+$('#im-tempo').value;t.press=+$('#im-press').value;
    t.dline=+$('#im-dline').value;t.tackling=+$('#im-tack').value;
    const S=teamStrength(c,side===0);
    ['att','mid','def','risk','tempo','press','dline'].forEach(k=>M.S[side][k]=S[k]);
    feedLine(M.minute,'You switch to a '+MENTALITIES[t.mentality].toLowerCase()+' approach.','sys');
    closeModal();
  }}]);
  setTimeout(()=>{
    [['im-ment',MENTALITIES],['im-tempo',['Much lower','Lower','Standard','Higher','Much higher']],
     ['im-press',['Much less','Less','Standard','More','Much more']],
     ['im-dline',['Much deeper','Deeper','Standard','Higher','Much higher']],
     ['im-tack',['Stay on feet','Normal','Get stuck in']]].forEach(([id,opts])=>{
      const e=$('#'+id); if(e)e.oninput=()=>{$('#'+id+'-v').textContent=opts[+e.value]};
    });
  },0);
}

function finishMatchDay(){
  const M=LIVE.M, f=LIVE.fixture;
  recordResult(f,M);
  f.__handled=true;
  $('#matchview').classList.remove('on');
  LIVE=null;
  // play the rest of the day
  playDay(fixturesOn(G.date));
  endOfDay();
  G.date=addDays(G.date,1); G.day++;
  startOfDay();
  render();
}

/* =========================================================================
   CONTINUE LOOP
   ========================================================================= */
function doContinue(){
  if(G.sacked)return;
  if(G.pendingRollover){ rolloverSeason(); render(); toast('New season under way'); return }
  const r=advanceDay();
  if(r.type==='match'){ startMatch(r.fixture); return }
  render();
}

/* =========================================================================
   SAVE / LOAD
   ========================================================================= */
function serialise(){
  return JSON.stringify({
    v:2, season:G.season, day:G.day, date:G.date.getTime(), userClub:G.userClub,
    managerName:G.managerName, difficulty:G.difficulty, jobSecurity:G.jobSecurity,
    seasonEnd:G.seasonEnd, pendingRollover:G.pendingRollover, window:G.window, unread:G.unread,
    clubs:G.clubs.map(c=>({id:c.id,name:c.name,short:c.short,div:c.div,rep:c.rep,capacity:c.capacity,
      balance:c.balance,wageBudget:c.wageBudget,country:c.country,col:c.col,col2:c.col2,league:c.league,squad:c.squad,form:c.form,
      p:c.p,w:c.w,d:c.d,l:c.l,gf:c.gf,ga:c.ga,pts:c.pts,transferBudget:c.transferBudget,
      morale:c.morale,cohesion:c.cohesion,europe:c.europe,hist:c.hist,manager:c.manager,
      sponsorship:c.sponsorship,nonLeague:c.nonLeague,tactic:c.tactic,trainFocus:c.trainFocus})),
    players:G.players.map(p=>[p.id,p.name,p.pos,p.age,p.nat,p.ca,p.pa,p.club,p.foot,p.hg?1:0,p.youth?1:0,
      p.cond,p.morale,p.sharp,p.inj,p.susp,p.yellow,p.red,p.apps,p.goals,p.assists,p.cleanSheets,
      p.ratings,p.form,p.mom,p.squadNum,p.training,p.personality,p.contract,p.transferListed?1:0,
      p.loanFrom,p.attrs,p.value,p.unhappy]),
    fixtures:G.fixtures.map(f=>[f.comp,f.div,f.round,f.home,f.away,f.date.getTime(),f.played?1:0,f.score,f.cup?1:0,f.euro?1:0,f.koTag,f.neutral?1:0]),
    results:G.results.map(r=>[r.comp,r.div,r.home,r.away,r.score,r.date.getTime(),r.scorers,r.round]),
    inbox:G.inbox.map(n=>[n.id,n.type,n.subject,n.body,n.date.getTime(),n.read?1:0,n.player,n.offer]),
    transfers:G.transfers.map(t=>[t.player,t.name,t.from,t.to,t.fee,t.date.getTime(),t.loan?1:0]),
    competitions:G.competitions, scouting:G.scouting, shortlist:Array.from(G.shortlist), interest:Array.from(G.interest),
    assignments:G.assignments, lastIntake:G.lastIntake,
    rumours:G.rumours.map(r=>[r.id,r.player,r.to,r.from,r.strength,r.date.getTime(),r.dead?1:0]),
    deals:G.deals.map(d=>({...d, date:d.date.getTime(), log:d.log.map(l=>({day:l.day,text:l.text}))})),
    nextPid:G.nextPid
  });
}
function deserialise(str){
  const s=JSON.parse(str);
  G.season=s.season;G.day=s.day;G.date=new Date(s.date);G.userClub=s.userClub;
  G.managerName=s.managerName;G.difficulty=s.difficulty;G.jobSecurity=s.jobSecurity;
  G.seasonEnd=s.seasonEnd;G.pendingRollover=s.pendingRollover;G.window=s.window;G.unread=s.unread||0;
  G.settings=Object.assign({ratings:'stars',speed:2,warnLineup:true}, s.settings||{});
  AUTO_SUBS=s.autoSubs===undefined?true:!!s.autoSubs;
  MSPEED=G.settings.speed;
  G.clubs=s.clubs.map(c=>{c.crest=crestFor(c);return c});
  G.players=[];G.playerById=new Map();
  s.players.forEach(a=>{
    const p={id:a[0],name:a[1],pos:a[2],age:a[3],nat:a[4],ca:a[5],pa:a[6],club:a[7],foot:a[8],
      hg:!!a[9],youth:!!a[10],cond:a[11],morale:a[12],sharp:a[13],inj:a[14],susp:a[15],yellow:a[16],
      red:a[17],apps:a[18],goals:a[19],assists:a[20],cleanSheets:a[21],ratings:a[22],form:a[23],
      mom:a[24],squadNum:a[25],training:a[26],personality:a[27],contract:a[28],transferListed:!!a[29],
      loanFrom:a[30],attrs:a[31],value:a[32],unhappy:a[33]||0,loanListed:false};
    G.players.push(p);G.playerById.set(p.id,p);
  });
  G.fixtures=s.fixtures.map(f=>({comp:f[0],div:f[1],round:f[2],home:f[3],away:f[4],date:new Date(f[5]),
    played:!!f[6],score:f[7],cup:!!f[8],euro:!!f[9],koTag:f[10],neutral:!!f[11]}));
  G.results=s.results.map(r=>({comp:r[0],div:r[1],home:r[2],away:r[3],score:r[4],date:new Date(r[5]),scorers:r[6],round:r[7]}));
  G.inbox=s.inbox.map(n=>({id:n[0],type:n[1],subject:n[2],body:n[3],date:new Date(n[4]),read:!!n[5],player:n[6],offer:n[7]}));
  G.transfers=s.transfers.map(t=>({player:t[0],name:t[1],from:t[2],to:t[3],fee:t[4],date:new Date(t[5]),loan:!!t[6]}));
  G.competitions=s.competitions;
  ['efl','fa'].forEach(k=>{const c=G.competitions[k];if(c)c.rounds.forEach(r=>r.date=new Date(r.date))});
  ['UCL','UEL','UECL'].forEach(k=>{const c=G.competitions[k];if(c){c.dates=c.dates.map(d=>new Date(d));c.koDates=c.koDates.map(d=>new Date(d))}});
  G.scouting=s.scouting;G.shortlist=new Set(s.shortlist);
  G.assignments=s.assignments||[];G.lastIntake=s.lastIntake||null;G.interest=new Set(s.interest||[]);
  G.rumours=(s.rumours||[]).map(r=>({id:r[0],player:r[1],to:r[2],from:r[3],strength:r[4],date:new Date(r[5]),dead:!!r[6]}));
  G.offersIn=[];
  G.deals=(s.deals||[]).map(d=>({...d, date:new Date(d.date), log:(d.log||[]).map(l=>({day:l.day,date:new Date(G.date.getTime()),text:l.text}))}));
  G.nextPid=s.nextPid;
  G.sacked=false;
}
function saveGame(){
  try{
    const blob=new Blob([serialise()],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='touchline-'+G.clubs[G.userClub].short.replace(/\W/g,'')+'-'+G.season+'-'+G.day+'.json';
    a.click(); URL.revokeObjectURL(a.href);
    toast('Save file downloaded');
  }catch(e){toast('Could not save: '+e.message)}
}

/* =========================================================================
   SETUP
   ========================================================================= */
let setupPick=null;
function buildSetup(){
  const listEl=$('#s-clubs');
  const draw=()=>{
    const dv=$('#s-div').value, q=$('#s-search').value.toLowerCase();
    let list=GAMEDATA.clubs.map((c,i)=>({i,name:c[0],div:c[2],rep:c[3],country:c[7],
      col:c[8]||'#1D3557', col2:c[9]||c[8]||'#1D3557'})).filter(c=>c.country==='ENG');
    if(dv!=='-1')list=list.filter(c=>c.div===+dv);
    if(q)list=list.filter(c=>c.name.toLowerCase().includes(q));
    list.sort((a,b)=>a.div-b.div||b.rep-a.rep);
    listEl.innerHTML=list.map(c=>{
      // real kit colours, split for two-tone clubs, with a rim so white kits show
      const two=c.col2.toLowerCase()!==c.col.toLowerCase();
      const bg=two?`linear-gradient(105deg, ${c.col} 0 55%, ${c.col2} 55% 100%)`:c.col;
      return `<div class="club-opt${setupPick===c.i?' on':''}" data-i="${c.i}">
      <span class="swatch" style="background:${bg}"></span>
      <span style="flex:1">${esc(c.name)}</span>
      <span class="faint mono" style="font-size:10px">${DIV_SHORT[c.div]}</span></div>`}).join('');
    Array.from(listEl.children).forEach(d=>d.onclick=()=>{
      setupPick=+d.dataset.i;
      Array.from(listEl.children).forEach(x=>x.classList.remove('on'));
      d.classList.add('on'); $('#s-go').disabled=false;
      const c2=GAMEDATA.clubs[setupPick];
      $('#s-go').textContent='Take the '+c2[0]+' job';
      showClubPreview(c2);
    });
  };
  $('#s-div').onchange=draw; $('#s-search').oninput=draw;
  draw();
  $('#s-go').onclick=()=>{
    const name=$('#s-name').value.trim()||'The Gaffer';
    startGame(setupPick,name,+$('#s-diff').value);
  };
}

/** Crest and colours of the club highlighted on the setup screen. */
function showClubPreview(c){
  const box=$('#s-preview'); if(!box) return;
  const col=c[8]||'#1D3557', col2=c[9]||col;
  const two=col2.toLowerCase()!==col.toLowerCase();
  const txt=(c[1]||c[0]).replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase();
  const fg=lum(col)>0.42?'#101915':'#FFFFFF';
  const rim=(lum(col)>0.75&&(!two||lum(col2)>0.75))?'box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);':'';
  box.style.display='block';
  box.innerHTML=`<div class="setup-preview">
    <div class="badge-lg" style="background:${col};${rim}">
      ${two?`<i style="position:absolute;inset:0 0 0 55%;background:${col2}"></i>`:''}
      <span style="position:relative;z-index:1;color:${fg};text-shadow:0 1px 2px rgba(0,0,0,.45)">${txt}</span>
    </div>
    <div style="flex:1">
      <div style="font-family:var(--disp);font-size:17px;font-weight:600;line-height:1.1">${esc(c[0])}</div>
      <div class="faint" style="font-size:11px">${DIVS[c[2]]} · ${c[4].toLocaleString()} capacity</div>
    </div>
    <div style="display:flex;gap:5px">
      <span class="swatch" style="width:16px;height:16px;background:${col}"></span>
      ${two?`<span class="swatch" style="width:16px;height:16px;background:${col2}"></span>`:''}
    </div></div>`;
}

function startGame(clubIdx,name,diff){
  $('#setup').style.display='none';
  $('#app').style.display='grid';
  initWorld();
  G.userClub=clubIdx; G.managerName=name; G.difficulty=diff;
  G.date=new Date(2025,6,1); G.day=0; G.season=2025;
  buildLeagueFixtures(); initEurope(); initCups();
  const c=G.clubs[G.userClub];
  const exp=boardExpectation(c);
  G.jobSecurity=68;
  addNews('board','Welcome to '+c.name,
    'Congratulations on your appointment as manager of '+c.name+'.\n\n'+
    'The board expect you to '+exp.text.toLowerCase()+' this season. You have a transfer budget of '+
    money(c.transferBudget)+' and a wage budget of '+money(c.wageBudget)+' per week.\n\n'+
    'Pre-season starts now. Good luck.',G.userClub);
  addNews('world','Season 2025/26',
    'The new campaign begins in August. '+DIVS[c.div]+' fixtures have been released.',null);
  render();
}

/* =========================================================================
   BOOTSTRAP
   ========================================================================= */
window.addEventListener('DOMContentLoaded',()=>{
  buildSetup();
  $('#btn-continue').onclick=doContinue;
  $('#btn-settings').onclick=settingsDialog;
  $('#btn-save').onclick=saveGame;
  $('#btn-load').onclick=()=>$('#file-in').click();
  $('#file-in').onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        if(!G.clubs.length) initWorld();
        deserialise(rd.result);
        $('#setup').style.display='none';$('#app').style.display='grid';
        render(); toast('Save loaded');
      }catch(err){toast('Could not load that file')}
    };
    rd.readAsText(f); e.target.value='';
  };
  $('#mod-x').onclick=closeModal;
  $('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
  $$('#mv-speed button').forEach(b=>b.onclick=()=>setSpeed(+b.dataset.s));
  $('#mv-done').onclick=finishMatchDay;
  $('#mv-subs').onclick=subsDialog;
  $('#mv-tactics').onclick=inMatchTactics;
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
    if(e.key==='Escape')closeModal();
    if(e.key===' '&&$('#app').style.display!=='none'&&!$('#matchview').classList.contains('on')){
      e.preventDefault();doContinue();
    }
    if($('#matchview').classList.contains('on')){
      if(e.key==='1')setSpeed(1);if(e.key==='2')setSpeed(2);if(e.key==='3')setSpeed(3);
      if(e.key===' '){e.preventDefault();setSpeed(MSPEED>0?0:2)}
    }
  });
});
