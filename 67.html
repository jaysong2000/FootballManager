<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Touchline — Football Management 2025/26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --turf:#08120C; --turf2:#0C1A12; --turf3:#112418; --turf4:#16301F;
  --chalk:#E8F0E9; --chalk-dim:#8FA396; --chalk-faint:#5A6E60;
  --line:rgba(232,240,233,.16); --line-hard:rgba(232,240,233,.34);
  --flood:#F2C14E; --flood-dim:#8a6f2c;
  --kit:#43D17F; --danger:#E2564B; --info:#5FA8D3; --violet:#9B7EDE;
  --disp:'Barlow Condensed',Impact,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--turf);color:var(--chalk);font-family:var(--body);font-size:13px;
  overflow:hidden;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 60px,transparent 60px 120px);
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--chalk);
  background:var(--turf3);border:1px solid var(--line);border-radius:var(--r);padding:5px 8px}
input:focus,select:focus{outline:2px solid var(--flood);outline-offset:-1px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--turf)}
::-webkit-scrollbar-thumb{background:var(--turf4);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#26482f}

.mono{font-family:var(--mono)}
.dim{color:var(--chalk-dim)}
.faint{color:var(--chalk-faint)}
.eyebrow{font-family:var(--disp);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--chalk-faint);font-weight:600}
h1,h2,h3{font-family:var(--disp);font-weight:600;letter-spacing:.01em;line-height:1.05}
h1{font-size:30px}h2{font-size:21px}h3{font-size:15px;letter-spacing:.06em;text-transform:uppercase}

/* ---------- app frame ---------- */
#app{display:grid;grid-template-columns:186px 1fr;grid-template-rows:52px 1fr 30px;height:100vh}
#topbar{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 14px;
  border-bottom:1px solid var(--line-hard);background:var(--turf2);position:relative;z-index:20}
#sidebar{border-right:1px solid var(--line-hard);background:var(--turf2);overflow-y:auto;padding:8px 0}
#main{overflow-y:auto;position:relative}
#statusbar{grid-column:1/3;border-top:1px solid var(--line);background:var(--turf2);
  display:flex;align-items:center;gap:16px;padding:0 14px;font-size:11px;color:var(--chalk-faint);font-family:var(--mono)}

.brand{font-family:var(--disp);font-size:19px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.brand span{color:var(--flood)}
.tb-club{display:flex;align-items:center;gap:9px;padding-left:14px;border-left:1px solid var(--line)}
.crest{width:26px;height:26px;border-radius:2px;display:grid;place-items:center;
  font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:0;flex:0 0 auto}
.tb-spacer{flex:1}
.tb-date{font-family:var(--mono);font-size:12px;color:var(--chalk-dim);letter-spacing:.03em}

.btn{padding:6px 13px;border:1px solid var(--line-hard);border-radius:var(--r);
  font-family:var(--disp);font-size:13px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;
  transition:background .12s,border-color .12s}
.btn:hover{background:var(--turf4);border-color:var(--chalk-dim)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:var(--flood);color:#1A1405;border-color:var(--flood)}
.btn.primary:hover{background:#ffd469}
.btn.sm{padding:3px 9px;font-size:11px}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger:hover{background:rgba(226,86,75,.15)}

/* ---------- sidebar nav ---------- */
.nav-sec{padding:9px 14px 4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:6px 14px;cursor:pointer;
  font-size:12.5px;border-left:2px solid transparent;color:var(--chalk-dim);transition:color .1s,background .1s}
.nav-item:hover{color:var(--chalk);background:rgba(255,255,255,.03)}
.nav-item.active{color:var(--chalk);border-left-color:var(--flood);background:rgba(242,193,78,.07)}
.nav-item .badge{margin-left:auto;background:var(--danger);color:#fff;border-radius:8px;
  padding:0 5px;font-size:10px;font-family:var(--mono);min-width:16px;text-align:center}

/* ---------- panels ---------- */
.page{padding:16px 20px 40px}
.page-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;
  padding-bottom:11px;border-bottom:1px solid var(--line-hard)}
.page-head h1{margin-bottom:-2px}
.panel{background:var(--turf2);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
.panel-h{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.panel-h h3{flex:1}
.panel-b{padding:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g-side{grid-template-columns:1fr 320px}
.tactics-grid{grid-template-columns:minmax(280px,400px) 1fr}
@media(max-width:1000px){.tactics-grid{grid-template-columns:1fr}}
@media(max-width:1100px){.g-side,.g2,.g3{grid-template-columns:1fr}}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-family:var(--disp);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--chalk-faint);font-weight:600;text-align:left;padding:6px 7px;
  border-bottom:1px solid var(--line-hard);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--chalk)}
th.no-sort{cursor:default}th.no-sort:hover{color:var(--chalk-faint)}
td{padding:5px 7px;border-bottom:1px solid rgba(232,240,233,.055);white-space:nowrap}
tbody tr:hover{background:rgba(255,255,255,.035)}
tbody tr.clickable{cursor:pointer}
td.num,th.num{text-align:right;font-family:var(--mono);font-size:11.5px}
.tbl-wrap{overflow-x:auto}

/* ---------- bits ---------- */
.pos{display:inline-block;min-width:30px;text-align:center;padding:1px 4px;border-radius:2px;
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.02em}
.pos.GK{background:#5B4A1E;color:#F5D98A}
.pos.D{background:#1E3D5B;color:#9CCBF0}
.pos.M{background:#1E4A32;color:#8FE0B0}
.pos.A{background:#4E2135;color:#F0A0BE}
.flag{font-family:var(--mono);font-size:10px;color:var(--chalk-faint);letter-spacing:.03em}
.ability{font-family:var(--mono);font-weight:700}
.bar{height:4px;background:var(--turf4);border-radius:2px;overflow:hidden;min-width:44px}
.bar i{display:block;height:100%;background:var(--kit)}
.chip{display:inline-block;padding:1px 6px;border:1px solid var(--line-hard);border-radius:9px;
  font-size:10px;font-family:var(--mono);letter-spacing:.03em}
.chip.w{border-color:var(--kit);color:var(--kit)}
.chip.d{border-color:var(--chalk-faint);color:var(--chalk-dim)}
.chip.l{border-color:var(--danger);color:var(--danger)}
.form-run{display:inline-flex;gap:2px}
.form-run i{width:15px;height:15px;border-radius:2px;display:grid;place-items:center;
  font-family:var(--mono);font-size:9px;font-weight:700;font-style:normal}
.form-run i.W{background:var(--kit);color:#06210F}
.form-run i.D{background:var(--turf4);color:var(--chalk-dim)}
.form-run i.L{background:var(--danger);color:#2A0906}
.stat{display:flex;flex-direction:column;gap:1px}
.stat b{font-family:var(--mono);font-size:17px;font-weight:700}
.stat span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk-faint);font-family:var(--disp)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid rgba(232,240,233,.05)}
.kv:last-child{border:0}
.kv span{color:var(--chalk-dim)}
.kv b{font-family:var(--mono);font-weight:500}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line-hard);margin-bottom:14px;overflow-x:auto}
.tab{padding:6px 13px;font-family:var(--disp);font-size:13px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:600;color:var(--chalk-faint);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--chalk)}
.tab.active{color:var(--flood);border-bottom-color:var(--flood)}
.empty{padding:34px;text-align:center;color:var(--chalk-faint);font-size:12px}

/* ---------- pitch ---------- */
.pitch{position:relative;aspect-ratio:68/105;background:
  repeating-linear-gradient(0deg,rgba(255,255,255,.017) 0 9.5%,transparent 9.5% 19%),var(--turf3);
  border:1px solid var(--line-hard);border-radius:var(--r)}
.pitch svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pp{position:absolute;transform:translate(-50%,-50%);width:52px;text-align:center;cursor:grab;user-select:none}
.pp .dot{width:26px;height:26px;margin:0 auto;border-radius:50%;border:1.5px solid var(--chalk);
  background:var(--turf4);display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700}
.pp.sel .dot{background:var(--flood);color:#1A1405;border-color:var(--flood)}
.pp .nm{font-size:9.5px;margin-top:2px;line-height:1.15;color:var(--chalk);
  text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .rl{font-size:8.5px;color:var(--flood);font-family:var(--mono);letter-spacing:.04em}
.pp.drag{opacity:.55;cursor:grabbing}

/* ---------- match ---------- */
#matchview{position:fixed;inset:0;background:var(--turf);z-index:100;display:none;
  grid-template-rows:auto 1fr auto;overflow:hidden}
#matchview.on{display:grid}
.m-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;
  padding:14px 22px;border-bottom:1px solid var(--line-hard);background:var(--turf2)}
.m-team{display:flex;align-items:center;gap:11px;font-family:var(--disp);font-size:22px;font-weight:600}
.m-team.away{flex-direction:row-reverse;text-align:right}
.m-nums{font-family:var(--mono);font-size:38px;font-weight:700;letter-spacing:.04em;line-height:1}
.m-clock{text-align:center;font-family:var(--mono);font-size:12px;color:var(--flood);margin-top:3px;letter-spacing:.1em}
.m-body{display:grid;grid-template-columns:1fr 340px;overflow:hidden}
@media(max-width:900px){.m-body{grid-template-columns:1fr}}
#m-feed{overflow-y:auto;padding:14px 22px}
.ev{display:grid;grid-template-columns:34px 1fr;gap:11px;padding:5px 0;font-size:12.5px;
  border-bottom:1px solid rgba(232,240,233,.05);animation:evin .25s ease}
@keyframes evin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.ev .min{font-family:var(--mono);font-size:11px;color:var(--chalk-faint);padding-top:1px}
.ev.goal{background:rgba(67,209,127,.09);border-left:2px solid var(--kit);padding-left:9px;margin-left:-11px}
.ev.goal .txt{font-weight:600}
.ev.big{color:var(--flood)}
.ev.card .txt{color:var(--danger)}
.ev.sys{color:var(--chalk-faint);font-style:italic}
.m-side{border-left:1px solid var(--line-hard);background:var(--turf2);overflow-y:auto;padding:12px}
.m-bar{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;gap:8px;margin-bottom:7px;font-size:11px}
.m-bar .t{height:5px;background:var(--turf4);border-radius:3px;display:flex;overflow:hidden}
.m-bar .t i{display:block;height:100%}
.m-ctl{display:flex;gap:8px;align-items:center;padding:11px 22px;border-top:1px solid var(--line-hard);background:var(--turf2);flex-wrap:wrap}
.speed{display:flex;border:1px solid var(--line-hard);border-radius:var(--r);overflow:hidden}
.speed button{padding:4px 11px;font-family:var(--mono);font-size:11px;border-right:1px solid var(--line)}
.speed button:last-child{border-right:0}
.speed button.on{background:var(--flood);color:#1A1405}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(3,8,5,.82);z-index:200;display:none;
  align-items:center;justify-content:center;padding:22px;backdrop-filter:blur(2px)}
#modal.on{display:flex}
.mbox{background:var(--turf2);border:1px solid var(--line-hard);border-radius:var(--r);
  max-width:940px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.mbox-h{padding:12px 16px;border-bottom:1px solid var(--line-hard);display:flex;align-items:center;gap:12px}
.mbox-h h2{flex:1}
.mbox-b{padding:16px;overflow-y:auto}
.mbox-f{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.x{font-size:20px;line-height:1;color:var(--chalk-faint);padding:0 4px}
.x:hover{color:var(--chalk)}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);z-index:300;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--turf4);border:1px solid var(--line-hard);border-left:2px solid var(--flood);
  padding:8px 15px;border-radius:var(--r);font-size:12px;animation:tin .2s ease;box-shadow:0 6px 22px rgba(0,0,0,.5)}
@keyframes tin{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* ---------- attributes ---------- */
.attr-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.attr-cols{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.attr-cols{grid-template-columns:1fr}}
.attr{display:grid;grid-template-columns:1fr 22px;gap:6px;align-items:center;padding:2px 0;font-size:11.5px}
.attr b{font-family:var(--mono);font-weight:700;text-align:right;font-size:11.5px}
.a20{color:#7CF0A8}.a16{color:var(--kit)}.a13{color:#CFE8B0}.a10{color:var(--chalk)}
.a7{color:var(--chalk-dim)}.a0{color:var(--danger)}

/* ---------- stars ---------- */
.stars{font-family:var(--mono);font-size:11px;letter-spacing:.04em;white-space:nowrap}
.ovr{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.02em}
.stat .ovr{font-size:19px}
#btn-settings{padding:6px 10px;font-size:14px}
td .stars{font-size:11px}
.stat .stars{font-size:14px}

/* ---------- sortable headers ---------- */
th.sorted{color:var(--flood)}
th[data-dir=asc]::after{content:' \25B4'}
th[data-dir=desc]::after{content:' \25BE'}
th.locked{cursor:default}

/* ---------- inbox ---------- */
.unread-dot{width:7px;height:7px;border-radius:50%;background:var(--danger);
  flex:0 0 auto;box-shadow:0 0 0 2px rgba(226,86,75,.22)}
.msg.unread{background:rgba(226,86,75,.045);border-left:2px solid var(--danger);padding-left:11px !important}
.nav-item .badge{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.62}}

/* ---------- drag & drop ---------- */
.pp.over .dot{border-color:var(--flood);box-shadow:0 0 0 4px rgba(242,193,78,.28)}
.pp[draggable]{cursor:grab}
.pp.drag{opacity:.4}
tr.over{outline:1px solid var(--flood);outline-offset:-1px;background:rgba(242,193,78,.1)}
tr.drag{opacity:.45}

/* ---------- editor ---------- */
input[type=color]{border:1px solid var(--line);border-radius:var(--r);background:var(--turf3);cursor:pointer}
#e-attrs input{background:var(--turf3);border:1px solid var(--line);border-radius:2px}

/* ---------- range sliders ---------- */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;
  border:none;padding:0;height:16px;width:100%;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--turf4);border-radius:2px}
input[type=range]::-moz-range-track{height:3px;background:var(--turf4);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;
  border-radius:50%;background:var(--flood);margin-top:-5px;border:none}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--flood);border:none}
input[type=range]:focus{outline:none}
input[type=range]:focus::-webkit-slider-thumb{box-shadow:0 0 0 3px rgba(242,193,78,.28)}

/* ---------- narrow screens ---------- */
@media(max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr 30px}
  #topbar{flex-wrap:wrap;height:auto;padding:8px 10px;gap:9px}
  #topbar .brand{font-size:16px}
  #sidebar{border-right:0;border-bottom:1px solid var(--line-hard);
    display:flex;overflow-x:auto;padding:0;max-height:44px}
  .nav-sec{display:none}
  .nav-item{border-left:0;border-bottom:2px solid transparent;white-space:nowrap;padding:11px 13px}
  .nav-item.active{border-left:0;border-bottom-color:var(--flood)}
  .page{padding:12px 12px 40px}
  h1{font-size:24px}
  #statusbar{overflow-x:auto;gap:11px;font-size:10px}
  .m-score{padding:10px 12px;gap:9px}
  .m-nums{font-size:27px}
  .m-team{font-size:15px}
  #m-feed{padding:10px 12px}
  .m-side{border-left:0;border-top:1px solid var(--line-hard)}
}

/* ---------- setup ---------- */
#setup{position:fixed;inset:0;background:var(--turf);z-index:400;display:grid;
  place-items:center;padding:22px;overflow-y:auto}
.setup-card{max-width:660px;width:100%}
.setup-hero{font-family:var(--disp);font-size:clamp(46px,9vw,86px);font-weight:700;
  letter-spacing:-.01em;line-height:.9;text-transform:uppercase;margin-bottom:4px}
.setup-hero em{font-style:normal;color:var(--flood);display:block}
.club-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:6px;
  max-height:290px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r);padding:7px;margin-top:9px}
.club-opt{padding:6px 9px;border:1px solid transparent;border-radius:2px;cursor:pointer;
  display:flex;align-items:center;gap:8px;font-size:12px}
.club-opt:hover{background:var(--turf3)}
.club-opt.on{border-color:var(--flood);background:rgba(242,193,78,.1)}
.swatch{display:inline-block;width:11px;height:11px;border-radius:2px;flex:0 0 auto;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.setup-preview{display:flex;align-items:center;gap:10px;padding:9px 11px;margin-bottom:13px;
  border:1px solid var(--line-hard);border-radius:var(--r);background:var(--turf2)}
.setup-preview .badge-lg{width:34px;height:34px;border-radius:3px;position:relative;overflow:hidden;
  display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:14px;flex:0 0 auto}
.fld{margin-bottom:13px}
.fld label{display:block;font-family:var(--disp);font-size:12px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--chalk-faint);margin-bottom:4px;font-weight:600}
</style>
</head>
<body>

<div id="setup">
  <div class="setup-card">
    <div class="eyebrow" style="margin-bottom:10px">Season 2025/26 &middot; England</div>
    <div class="setup-hero">Touch<em>line</em></div>
    <p class="dim" style="max-width:52ch;margin-bottom:24px;line-height:1.55">
      Ninety-two English clubs, real squads, and a job that lasts exactly as long as the board's patience.
      Pick where you want to start.</p>

    <div class="fld"><label>Your name</label>
      <input id="s-name" value="" placeholder="Alex Ferguson" style="width:100%"></div>

    <div class="fld"><label>Division</label>
      <select id="s-div" style="width:100%">
        <option value="-1">All divisions</option>
        <option value="0">Premier League</option>
        <option value="1">Championship</option>
        <option value="2">League One</option>
        <option value="3">League Two</option>
      </select></div>

    <div class="fld"><label>Club</label>
      <input id="s-search" placeholder="Search clubs..." style="width:100%">
      <div class="club-pick" id="s-clubs"></div></div>

    <div id="s-preview" style="display:none"></div>

    <div class="fld"><label>Difficulty</label>
      <select id="s-diff" style="width:100%">
        <option value="0.9">Forgiving — board expects little</option>
        <option value="1" selected>Realistic</option>
        <option value="1.15">Unforgiving — sack race starts now</option>
      </select></div>

    <button class="btn primary" id="s-go" style="width:100%;padding:11px" disabled>Take the job</button>
  </div>
</div>

<div id="app" style="display:none">
  <header id="topbar">

/* ---- deterministic PRNG ---------------------------------------------- */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mkRng(seed){let s=seed>>>0||1;return function(){s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}
let RND = Math.random;                       // live game randomness
const rint=(a,b)=>a+Math.floor(RND()*(b-a+1));
const pick=a=>a[Math.floor(RND()*a.length)];
const chance=p=>RND()<p;
function gauss(){let u=0,v=0;while(!u)u=RND();while(!v)v=RND();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

function allAttrs(pos){
  return pos==='GK' ? ATTR_GK.concat(ATTR_MENT,ATTR_PHYS)
                    : ATTR_TECH.concat(ATTR_MENT,ATTR_PHYS,['Flair','Aggression']);
}

/** Build a player's 1–20 attribute spread from ability + position + a stable seed. */
function buildAttrs(p){
  const r = mkRng(hash(p.name+'|'+p.pos+'|'+p.id));
  const mean = 2.0 + p.ca*0.165;                       // ca 94 -> 17.5, ca 40 -> 8.6
  const w = POS_WEIGHTS[p.pos] || {};
  const out = {};
  for (const a of allAttrs(p.pos)){
    const mult = w[a] || 1.0;
    // spread: better players are more consistent in their key attributes
    const spread = 2.6 - (p.ca/95)*0.9;
    let v = mean*mult + (r()+r()+r()-1.5)*spread;
    out[a] = clamp(Math.round(v),1,20);
  }
  return out;
}

/** What one point of an attribute is worth in ability terms, for this position. */
function attrWorth(p,attr){
  const keys = KEY_ATTRS[p.pos]||KEY_ATTRS.MC;
  if(keys.indexOf(attr)<0) return 0.06;          // off-role attributes barely register
  const w = (POS_WEIGHTS[p.pos]||{})[attr] || 1;
  return (w/keys.length)/0.165;
}

/** Apply a fractional ability change, carrying the remainder between weeks. */
function bumpCA(p,delta){
  if(!delta) return;
  p.caF = (p.caF||0) + delta;
  while(p.caF>=1){ p.caF-=1; p.ca=Math.min(99,p.ca+1) }
  while(p.caF<=-1){ p.caF+=1; p.ca=Math.max(12,p.ca-1) }
  if(p.ca>p.pa) { p.ca=p.pa; p.caF=0 }            // growth is capped by potential
  p.value=calcValue(p);
}

/** Read ability straight off the attributes, undoing the positional weighting. */
function recomputeCA(p){
  const keys = KEY_ATTRS[p.pos]||KEY_ATTRS.MC;
  const w = POS_WEIGHTS[p.pos]||{};
  let s=0; for(const k of keys) s += (p.attrs[k]||8)/(w[k]||1);
  return clamp(Math.round((s/keys.length - 2.0)/0.165), 12, 99);
}

/* ---- money ------------------------------------------------------------ */
function money(v){
  const a=Math.abs(v);
  if(a>=1e9) return (v<0?'-':'')+'£'+(a/1e9).toFixed(2)+'B';
  if(a>=1e6) return (v<0?'-':'')+'£'+(a/1e6).toFixed(a>=1e7?0:1)+'M';
  if(a>=1e3) return (v<0?'-':'')+'£'+Math.round(a/1e3)+'K';
  return (v<0?'-':'')+'£'+Math.round(a);
}
function wageStr(v){return money(v)+'/wk'}

/** Market value from ability, potential and age. */
function calcValue(p){
  const ca=p.ca, pa=p.pa, age=p.age;
  let base = Math.pow(Math.max(0,ca-28)/10, 4.05) * 26000;
  // youth premium on potential
  if(age<24){ base += Math.pow(Math.max(0,pa-30)/10, 3.6) * 12000 * (24-age)/6 }
  let am = 1;
  if(age<=18) am=1.35; else if(age<=21) am=1.5; else if(age<=25) am=1.35;
  else if(age<=28) am=1.1; else if(age<=30) am=.82; else if(age<=32) am=.55;
  else if(age<=34) am=.3; else am=.13;
  let v = base*am;
  if(p.contract && p.contract.years<=0.6) v*=0.45;
  else if(p.contract && p.contract.years<=1.2) v*=0.72;
  return Math.max(6000, Math.round(v/10000)*10000);
}

/** Expected weekly wage for a player at a club of given reputation. */
function calcWage(ca,age,rep){
  // Calibrated against real 2025/26 bills: ~£350k/wk for an elite PL star,
  // ~£20k in the Championship, ~£3k in League Two.
  let w = 206 * Math.exp(0.0742*ca) * (0.4 + rep/80);
  if(age<20) w*=0.42; else if(age<23) w*=0.72; else if(age<26) w*=0.92;
  else if(age>34) w*=0.72; else if(age>31) w*=0.88;
  return Math.max(300, Math.round(w/100)*100);
}

const CREST_COLS = ['#C8102E','#034694','#DA291C','#6CABDD','#132257','#EF0107','#0057B8','#7A263A',
  '#FDB913','#00A650','#241F20','#E30613','#003399','#95BFE5','#670E36','#B80000','#1B458F','#FFCD00'];
/** Relative luminance, for picking legible text over any kit colour. */
function lum(hex){
  const h=String(hex||'#000').replace('#','');
  const n=h.length===3 ? h.split('').map(c=>c+c).join('') : h;
  const v=[0,2,4].map(i=>{
    let c=parseInt(n.substr(i,2),16)/255;
    return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4);
  });
  return 0.2126*v[0]+0.7152*v[1]+0.0722*v[2];
}
function readableOn(bg){ return lum(bg) > 0.42 ? '#101915' : '#FFFFFF' }

/** Real kit colours. Two-tone clubs get a split badge so both colours show. */
function crestFor(club){
  const h = hash(club.name);
  const bg  = club.col  || CREST_COLS[h % CREST_COLS.length];
  const bg2 = club.col2 || bg;
  const twoTone = bg2.toLowerCase() !== bg.toLowerCase();
  return {
    bg, bg2, twoTone,
    fg: readableOn(bg),
    fg2: readableOn(bg2),
    txt: club.short.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()
  };
}

function assignSquadNumbers(club){
  const taken=new Set(); const sq=club.squad.map(i=>G.playerById.get(i));
  const gks=sq.filter(p=>p.pos==='GK').sort((a,b)=>b.ca-a.ca);
  if(gks[0]){gks[0].squadNum=1;taken.add(1)}
  sq.sort((a,b)=>b.ca-a.ca).forEach(p=>{
    if(p.squadNum)return;
    let n=2; while(taken.has(n)&&n<60)n++;
    p.squadNum=n; taken.add(n);
  });
}

function defaultTactic(club){
  const forms=Object.keys(FORMATIONS);
  const f=forms[hash(club.name+'f')%forms.length];
  const t={
    formation:f, mentality:3, tempo:2, width:2, press:2, dline:2,
    passing:2, crossing:1, tackling:1, timeWasting:1,
    xi:[], subs:[], roles:{}, captain:null, penalties:null, corners:null, freekicks:null
  };

  return t;

/** Choose the strongest available XI for the tactic's formation. */
function autoPick(club,t){
  t = t||club.tactic;
  const slots = FORMATIONS[t.formation];
  const avail = club.squad.map(i=>G.playerById.get(i))
    .filter(p=>p && !p.inj && !p.susp)
    .sort((a,b)=>effAbility(b)-effAbility(a));
  const used=new Set(); const xi=[];
  slots.forEach((s,idx)=>{
    let best=null,bs=-1;
    for(const p of avail){
      if(used.has(p.id))continue;
      const sc = effAbility(p)*fit(p,s[0]) + (p.pos===s[0]?4:0);
      if(sc>bs){bs=sc;best=p}
    }
    if(best){used.add(best.id);xi.push(best.id);
      if(!t.roles[best.id]) t.roles[best.id]=(ROLE_BY_POS[s[0]]||['Player'])[0];
    } else xi.push(null);
  });
  t.xi=xi;
  const bench=[];
  const wantGK = !xi.some(id=>id&&G.playerById.get(id).pos==='GK');
  for(const p of avail){ if(used.has(p.id))continue; if(bench.length<9){bench.push(p.id);used.add(p.id)} }
  t.subs=bench;
  if(!t.captain||!club.squad.includes(t.captain)){
    const cands=club.squad.map(i=>G.playerById.get(i)).filter(p=>p&&!p.youth);
    cands.sort((a,b)=>(b.attrs['Determination']||0)+b.ca*0.3-((a.attrs['Determination']||0)+a.ca*0.3));
    t.captain=cands[0]?cands[0].id:null;
  }
  const sq=club.squad.map(i=>G.playerById.get(i)).filter(Boolean);
  if(!t.penalties){const c=sq.slice().sort((a,b)=>(b.attrs['Composure']||0)+(b.attrs['Finishing']||0)-((a.attrs['Composure']||0)+(a.attrs['Finishing']||0)));t.penalties=c[0]&&c[0].id}
  if(!t.corners){const c=sq.slice().sort((a,b)=>(b.attrs['Crossing']||0)+(b.attrs['Technique']||0)-((a.attrs['Crossing']||0)+(a.attrs['Technique']||0)));t.corners=c[0]&&c[0].id}
  t.freekicks=t.freekicks||t.corners;
  return t;
}

/** Ability adjusted for condition, morale, form, sharpness. */
function effAbility(p){
  if(!p) return 0;
  let a=p.ca;
  a *= 0.72 + (p.cond/100)*0.28;
  a *= 0.94 + (p.morale/100)*0.10;
  a *= 0.95 + (p.sharp/100)*0.07;
  const f=p.form.slice(-5);
  if(f.length){const av=f.reduce((s,x)=>s+x,0)/f.length; a *= 0.94+ (av/6.8)*0.09}
  return a;
}

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYNAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function fmtDate(d){return DAYNAMES[d.getDay()].slice(0,3)+' '+d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)+' '+d.getFullYear()}
function fmtDateLong(d){return DAYNAMES[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()}
function addDays(d,n){const x=new Date(d.getTime());x.setDate(x.getDate()+n);return x}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function dkey(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}

/** Date within the current season: Jan–Jun belong to the following calendar year. */
function sd(month,day){ return new Date(G.season + (month<6?1:0), month, day) }

/** Circle-method double round robin. */
function roundRobin(ids){
  const t=ids.slice(); if(t.length%2)t.push(null);
  const n=t.length, rounds=[];
  for(let r=0;r<n-1;r++){
    const rd=[];
    for(let i=0;i<n/2;i++){
      const a=t[i],b=t[n-1-i];
      if(a!==null&&b!==null) rd.push(r%2? [b,a] : [a,b]);
    }
    rounds.push(rd);
    t.splice(1,0,t.pop());
  }
  const second=rounds.map(rd=>rd.map(m=>[m[1],m[0]]));
  return rounds.concat(second);
}

function buildLeagueFixtures(){
  const startSat = sd(7,9);   // second Saturday of August
  for(let d=0;d<4;d++){
    const ids=G.clubs.filter(c=>c.div===d).map(c=>c.id);
    const rounds=roundRobin(shuffle(ids.slice()));
    const gaps = d===0 ? [7,7,7,7,3,7,7,7,7,4] : [7,3,7,7,4,7,3,7,7,7,4,7];
    let cur=addDays(startSat, d===0?0:-2);
    rounds.forEach((rd,ri)=>{
      cur = ri===0 ? cur : addDays(cur, gaps[ri%gaps.length]);
      rd.forEach(m=>{
        G.fixtures.push({comp:'league',div:d,round:ri,home:m[0],away:m[1],date:new Date(cur.getTime()),played:false});
      });
    });
  }
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(RND()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function startCupRound(key){
  const c=G.competitions[key], rd=c.rounds[c.stage];
  if(!rd) return;
  if(c.stage===0){
    c.teams = G.clubs.filter(x=>x.div===2||x.div===3).map(x=>x.id);
    if(key==='fa') c.teams = c.teams.concat(faNonLeague());
  }
  if(rd.join==='PLnonEuro'){
    c.teams = c.teams.concat(G.clubs.filter(x=>x.div===0&&!x.europe).map(x=>x.id),
                             G.clubs.filter(x=>x.div===1).map(x=>x.id));
  }
  if(rd.join==='PLeuro') c.teams = c.teams.concat(G.clubs.filter(x=>x.div===0&&x.europe).map(x=>x.id));
  if(rd.join==='PLCH') c.teams = c.teams.concat(G.clubs.filter(x=>x.div<=1).map(x=>x.id));
  // pair them up
  const t=shuffle(c.teams.slice());
  const byes=[];
  while(t.length && (t.length & (t.length-1))!==0 && t.length%2===1) byes.push(t.pop());
  for(let i=0;i+1<t.length;i+=2){
    G.fixtures.push({comp:key,round:c.stage,home:t[i],away:t[i+1],date:new Date(rd.date.getTime()),played:false,cup:true});
  }
  c.byes=byes;
}

/* ---- Europe ----------------------------------------------------------- */
const EURO_CODES=['UCL','UEL','UECL'];
const EURO_NAME={UCL:'Champions League',UEL:'Europa League',UECL:'Conference League'};
const EURO_SIZE={UCL:36,UEL:36,UECL:36};

/** How many places each association gets, by the strength of its best club. */
function euroSlots(topRep){
  if(topRep>=90) return {UCL:4,UEL:2,UECL:1};
  if(topRep>=76) return {UCL:3,UEL:2,UECL:1};
  if(topRep>=66) return {UCL:2,UEL:1,UECL:2};
  if(topRep>=55) return {UCL:1,UEL:1,UECL:2};
  if(topRep>=45) return {UCL:1,UEL:1,UECL:1};
  return {UCL:1,UECL:1};
}

/** Work out who is in which European competition this season. */
function allocateEurope(){
  G.clubs.forEach(c=>c.europe=null);
  const entrants={UCL:[],UEL:[],UECL:[]};

  // England qualifies off the actual league table
  const eng=leagueTable(0);
  if(eng.length){
    eng.slice(0,4).forEach(c=>entrants.UCL.push(c.id));
    eng.slice(4,6).forEach(c=>entrants.UEL.push(c.id));
    eng.slice(6,7).forEach(c=>entrants.UECL.push(c.id));
  }
  // everyone else on reputation within their own league
  const byCountry={};
  G.clubs.forEach(c=>{ if(c.country!=='ENG'&&!c.nonLeague) (byCountry[c.country]=byCountry[c.country]||[]).push(c) });
  Object.keys(byCountry).forEach(code=>{
    const list=byCountry[code].sort((a,b)=>b.rep-a.rep);
    const slots=euroSlots(list[0]?list[0].rep:30);
    let i=0;
    EURO_CODES.forEach(comp=>{
      for(let n=0;n<(slots[comp]||0);n++){ if(list[i]) entrants[comp].push(list[i++].id) }
    });
  });

  // Trim each competition to size, pushing the weakest down a tier rather
  // than dropping them out of Europe altogether.
  const byRep=(a,b)=>G.clubs[b].rep-G.clubs[a].rep;
  ['UCL','UEL'].forEach((comp,idx)=>{
    entrants[comp].sort(byRep);
    const over=entrants[comp].splice(EURO_SIZE[comp]);
    entrants[EURO_CODES[idx+1]].push(...over);
  });
  // The Conference League keeps places back for smaller associations, so the
  // likes of Klaksvik and Lincoln Red Imps aren't simply priced out of Europe.
  entrants.UECL.sort(byRep);
  if(entrants.UECL.length>EURO_SIZE.UECL){
    const RESERVED=8;
    const kept=entrants.UECL.slice(0,EURO_SIZE.UECL-RESERVED);
    const rest=entrants.UECL.slice(EURO_SIZE.UECL-RESERVED);
    const seen=new Set(kept.map(id=>G.clubs[id].country));
    const smallNations=[];
    rest.forEach(id=>{ const co=G.clubs[id].country; if(!seen.has(co)){ seen.add(co); smallNations.push(id) } });
    smallNations.sort(byRep);
    // six places to the strongest unrepresented associations, two held back
    // for the minnows so San Marino and Gibraltar get their night out
    const chosen=smallNations.slice(0,RESERVED-2).concat(smallNations.slice(-2));
    entrants.UECL=kept.concat(chosen.filter((v,i,a)=>a.indexOf(v)===i));
    while(entrants.UECL.length<EURO_SIZE.UECL && rest.length){
      const id=rest.shift(); if(entrants.UECL.indexOf(id)<0) entrants.UECL.push(id);
    }
  }
  entrants.UECL.length=Math.min(entrants.UECL.length,EURO_SIZE.UECL);

  EURO_CODES.forEach(comp=>entrants[comp].forEach(id=>{G.clubs[id].europe=comp}));
  return entrants;
}

function setupEuroCompetition(code,teams){

function initEurope(){

/** Swiss-model-lite: each club plays 8 opponents seeded by strength. */
function buildEuroLeaguePhase(code){
  const c=G.competitions[code];
  const teams=c.teams.slice().sort((a,b)=>G.clubs[b].rep-G.clubs[a].rep);
  const opp={}; teams.forEach(t=>opp[t]=[]);
  const pots=[]; const per=Math.ceil(teams.length/4);
  for(let i=0;i<4;i++) pots.push(teams.slice(i*per,(i+1)*per));
  for(const t of teams){
    for(const pot of pots){
      let tries=0;
      while(opp[t].length < (pots.indexOf(pot)+1)*2 && tries<200){
        tries++;
        const o=pot[Math.floor(RND()*pot.length)];
        if(!o||o===t||opp[t].includes(o)||opp[o].length>=8) continue;
        opp[t].push(o); opp[o].push(t);
      }
    }
  }
  const made=new Set();
  teams.forEach(t=>{
    opp[t].forEach((o,i)=>{
      const k=Math.min(t,o)+'-'+Math.max(t,o);
      if(made.has(k))return; made.add(k);
      const md = made.size % 8;
      const home = RND()<.5 ? t : o, away = home===t?o:t;
      G.fixtures.push({comp:code,round:md,home,away,date:new Date(c.dates[md].getTime()),played:false,euro:true});
    });
  });
}

/** Compute a team's tactical output. */
function teamStrength(club, homeAdv){
  const t = club.tactic;
  const form = FORMATIONS[t.formation];
  const m = MENT_MOD[t.mentality];
  let def=0, mid=0, att=0, build=0, aerial=0, pressQ=0, n=0, disc=0, pace=0;
  let wdSum=0, wmSum=0, waSum=0;
  const xi=[];
  t.xi.forEach((id,i)=>{
    const p = id!=null && G.playerById.get(id);
    if(!p) return;
    const slot = form[i][0], y = form[i][2];
    const fitness = fit(p,slot);
    const rm = ROLE_MOD[t.roles[p.id]]||{};
    const e = effAbility(p)*fitness;
    // positional weighting across the three bands
    const wd = y<35?1: y<60?0.42: 0.12;
    const wm = y<25?0.15: y<70?1: 0.35;
    const wa = y<40?0.08: y<65?0.45: 1;
    def += e*wd*(rm.def||1); wdSum += wd;
    mid += e*wm;               wmSum += wm;
    att += e*wa*(rm.att||1);   waSum += wa;
    build += e*wm*(rm.build||1)*((p.attrs['Passing']||10)+(p.attrs['Vision']||10))/24;
    aerial += ((p.attrs['Heading']||8)+(p.attrs['Jumping']||8))*(rm.aerial||1)*(y>60?1.2:y<35?1:.6);
    pressQ += ((p.attrs['Work Rate']||8)+(p.attrs['Stamina']||8))*(rm.press||1);
    disc += (p.attrs['Aggression']||10) - (p.attrs['Composure']||10)*0.4;
    pace += (p.attrs['Pace']||8)+(p.attrs['Acceleration']||8);
    xi.push({p,slot,y,x:form[i][1],role:t.roles[p.id]||'Player',fit:fitness});
    n++;
  });
  if(!n) n=1;
  const cohes = 0.9 + (club.cohesion/100)*0.16;
  const mor   = 0.93 + (club.morale/100)*0.12;
  const pressLvl = [0.85,0.94,1,1.08,1.16][t.press];
  const dlineLvl = [0.86,0.94,1,1.07,1.15][t.dline];
  // divide by the weight sums so every value is an "average effective ability"
  // of that unit — scale-free and independent of formation shape
  const base = cohes*mor;
  return {
    club, xi,
    def: (def/Math.max(0.1,wdSum))*m.def*base,
    mid: (mid/Math.max(0.1,wmSum))*base,
    att: (att/Math.max(0.1,waSum))*m.att*base,
    build: build/Math.max(0.1,wmSum)*base,
    aerial: aerial/n, press: pressQ/n*pressLvl, dline:dlineLvl,
    disc: disc/n, pace: pace/n, homeAdv: homeAdv?1:0,
    risk: m.risk, tempo: 1+m.tempo+(t.tempo-2)*0.09,
    width: 1+(t.width-2)*0.11, tackling:t.tackling, count:n
  };
}

const HOME_TEAM=0, AWAY_TEAM=1;

/** Full state object for a match in progress. */
function createMatch(homeId, awayId, comp, opts){
  opts=opts||{};
  const H=G.clubs[homeId], A=G.clubs[awayId];
  if(!H.tactic) H.tactic=defaultTactic(H);
  if(!A.tactic) A.tactic=defaultTactic(A);
  autoFillIfBroken(H); autoFillIfBroken(A);
  const M = {
    comp, homeId, awayId, home:H, away:A,
    S:[teamStrength(H,true), teamStrength(A,false)],
    score:[0,0], minute:0, events:[], done:false, neutral:!!opts.neutral, twoLeg:opts.twoLeg,
    stats:[blankStats(),blankStats()],
    subsUsed:[0,0], subsMade:[[],[]],
    onPitch:[[],[]], cards:[{},{}], mins:[{},{}], mrat:[{},{}],
    scorers:[], momentum:0, addedTime:0, penShootout:null
  };
  [0,1].forEach(s=>{
    M.S[s].xi.forEach(e=>{ M.onPitch[s].push(e.p.id); M.mrat[s][e.p.id]=6.5; M.mins[s][e.p.id]=0 });
  });
  return M;
}
function blankStats(){return{shots:0,ontarget:0,poss:0,corners:0,fouls:0,yellow:0,red:0,xg:0,passes:0,offside:0,saves:0}}
function autoFillIfBroken(club){
  const t=club.tactic;
  const bad = !t.xi || t.xi.length!==11 || t.xi.some(id=>{
    if(id==null) return true; const p=G.playerById.get(id);
    return !p||p.club!==club.id||p.inj||p.susp>0;
  });
  if(bad) autoPick(club,t);
}

function say(bank, M, side, actor, other, keeper){
  const T=M[side===0?'home':'away'], O=M[side===0?'away':'home'];
  let s = pick(bank);
  return s.replace(/\{T\}/g,T.short).replace(/\{O\}/g,O.short)
          .replace(/\{A\}/g,actor?shortName(actor):'')
          .replace(/\{B\}/g,other?shortName(other):'')
          .replace(/\{K\}/g,keeper?shortName(keeper):'the keeper')
          .replace(/\{H\}/g,M.home.short).replace(/\{AW\}/g,M.away.short)
          .replace(/\{SH\}/g,M.score[0]).replace(/\{SA\}/g,M.score[1])
          .replace(/\{V\}/g,M.home.name);
}
function shortName(p){
  if(!p) return '';
  const parts=p.name.split(' ');
  return parts.length>1 ? parts.slice(1).join(' ') : p.name;
}

/* ---- picking who does what ------------------------------------------- */
function weightedPlayer(M,side,fn){
  const list=M.S[side].xi.filter(e=>M.onPitch[side].includes(e.p.id));
  let tot=0; const ws=list.map(e=>{const w=Math.max(0.01,fn(e));tot+=w;return w});
  let r=RND()*tot;
  for(let i=0;i<list.length;i++){ r-=ws[i]; if(r<=0) return list[i] }
  return list[list.length-1];
}
function keeperOf(M,side){
  const e=M.S[side].xi.find(e=>e.slot==='GK'&&M.onPitch[side].includes(e.p.id));
  return e?e.p:null;
}

/* ---- one minute of football ------------------------------------------ */
function simMinute(M){
  M.minute++;
  const min=M.minute;
  const push=(txt,cls,side)=>{M.events.push({min,txt,cls:cls||'',side})};

  if(min===1) push(say(CM.ko,M,0),'sys');

  // fatigue
  [0,1].forEach(s=>{
    M.onPitch[s].forEach(id=>{
      const p=G.playerById.get(id); if(!p)return;
      M.mins[s][id]=(M.mins[s][id]||0)+1;
      const st=(p.attrs['Stamina']||10)+(p.attrs['Natural Fitness']||10);
      const drain=(0.30 - st*0.0068)*M.S[s].tempo*(1+(M.S[s].club.tactic.press-2)*0.09);
      p.cond=Math.max(12,p.cond-Math.max(0.05,drain));
    });
  });

  // possession tilt
  const mid0=M.S[0].mid*(1+M.momentum*0.05), mid1=M.S[1].mid*(1-M.momentum*0.05);
  const pShare = mid0/(mid0+mid1);
  const side = RND()<pShare ? 0 : 1;
  M.stats[side].poss++;
  M.stats[side].passes += rint(2,7);

  const A=M.S[side], D=M.S[1-side];
  // probability this minute produces a real attacking move
  const tilt = A.att/(A.att+D.def);
  let pChance = (0.208 + (tilt-0.5)*0.44 + (pShare-0.5)*0.08) * A.tempo * A.risk;
  if(side===0) pChance*=1.06; else pChance*=0.96;   // home advantage
  pChance *= 0.92 + (A.press/16)*0.14;
  if(M.score[side]<M.score[1-side] && min>65) pChance*=1.18;   // chasing
  if(M.score[side]>M.score[1-side] && min>70) pChance*=0.9;
  if(M.onPitch[side].length<11) pChance*=0.78;
  if(M.onPitch[1-side].length<11) pChance*=1.24;

  if(RND()<pChance){
    const creator = weightedPlayer(M,side,e=>e.y*0.9+ (e.p.attrs['Vision']||8)*2 + (e.p.attrs['Passing']||8));
    const shooter = weightedPlayer(M,side,e=>e.slot==='GK'?0:Math.pow(e.y/10,2.2)*(8+(e.p.attrs['Off the Ball']||8)+(e.p.attrs['Finishing']||8))/10);
    const gk = keeperOf(M,1-side);
    if(RND()<0.42) push(say(CM.build,M,side,creator.p),'',side);

    // chance quality -> xG
    const q = clamp(0.085 + (tilt-0.5)*0.18 + ((shooter.p.attrs['Off the Ball']||8)-10)*0.006 + gauss()*0.05, 0.02, 0.78);
    M.stats[side].shots++; M.stats[side].xg += q;

    const fin=(shooter.p.attrs['Finishing']||8), comp=(shooter.p.attrs['Composure']||8), tech=(shooter.p.attrs['Technique']||8);
    const gkQ = gk ? ((gk.attrs['Reflexes']||8)+(gk.attrs['Handling']||8)+(gk.attrs['One on Ones']||8))/3 * (0.80+gk.cond/500) : 6;
    let pGoal = q * (0.285 + fin*0.0235 + comp*0.0094) * (1.35 - gkQ*0.032);
    pGoal = clamp(pGoal,0.01,0.86);
    const roll=RND();

    if(roll < pGoal){
      M.score[side]++; M.stats[side].ontarget++;
      shooter.p.goals++; M.mrat[side][shooter.p.id]=(M.mrat[side][shooter.p.id]||6.5)+1.05;
      let txt=say(CM.goal,M,side,shooter.p,null,gk);
      let assister=null;
      if(creator.p.id!==shooter.p.id && RND()<0.72){
        assister=creator.p; assister.assists++;
        M.mrat[side][assister.id]=(M.mrat[side][assister.id]||6.5)+0.55;
        txt += say(CM.goalAssist,M,side,shooter.p,assister);
      }
      M.scorers.push({side,min,player:shooter.p.id,name:shortName(shooter.p),assist:assister?assister.id:null});
      push(txt,'goal',side);
      M.momentum = side===0? 0.9 : -0.9;
      // keeper punished
      if(gk) M.mrat[1-side][gk.id]=(M.mrat[1-side][gk.id]||6.5)-0.28;
      [0,1].forEach(s=>{const cl=M.S[s].club; cl.__momGoal=true});
    } else if(roll < pGoal+0.245){
      M.stats[side].ontarget++; if(gk){M.stats[1-side].saves++;M.mrat[1-side][gk.id]=(M.mrat[1-side][gk.id]||6.5)+0.16}
      push(say(CM.saved,M,side,shooter.p,null,gk),'',side);
    } else if(roll < pGoal+0.335){
      push(say(CM.blocked,M,side,shooter.p),'',side);
    } else if(roll < pGoal+0.375){
      push(say(CM.woodwork,M,side,shooter.p),'big',side);
    } else {
      push(say(CM.shotOff,M,side,shooter.p),'',side);
    }
    M.momentum = clamp(M.momentum + (side===0?0.22:-0.22), -1, 1);
  } else {
    M.momentum *= 0.93;
    // corners
    if(RND()<0.165){
      M.stats[side].corners++;
      const taker=G.playerById.get(M.S[side].club.tactic.corners)||weightedPlayer(M,side,e=>e.p.attrs['Crossing']||8).p;
      if(RND()<0.3) push(say(CM.corner,M,side,null,taker),'',side);
      // headed chance
      if(RND()< 0.055 + M.S[side].aerial*0.0022){
        const head=weightedPlayer(M,side,e=>(e.p.attrs['Heading']||8)+(e.p.attrs['Jumping']||8));
        const gk=keeperOf(M,1-side);
        M.stats[side].shots++; M.stats[side].xg+=0.09;
        if(RND()< 0.055 + (head.p.attrs['Heading']||8)*0.006){
          M.score[side]++; head.p.goals++; M.stats[side].ontarget++;
          M.mrat[side][head.p.id]=(M.mrat[side][head.p.id]||6.5)+1.0;
          M.scorers.push({side,min,player:head.p.id,name:shortName(head.p),assist:taker?taker.id:null});
          if(taker){taker.assists++}
          push(shortName(head.p)+' powers the header in from the corner!','goal',side);
        } else push(shortName(head.p)+' meets it but heads over.','',side);
      }
    }
    if(RND()<0.014) push(say(CM.offside,M,side,weightedPlayer(M,side,e=>e.y).p),'',side);
  }

  // penalties
  if(RND()<0.0045*A.risk){
    const won=weightedPlayer(M,side,e=>Math.pow(e.y/10,2)*((e.p.attrs['Dribbling']||8)));
    push(say(CM.pen,M,side,won.p),'big',side);
    const taker=G.playerById.get(M.S[side].club.tactic.penalties)||won.p;
    const gk=keeperOf(M,1-side);
    M.stats[side].shots++; M.stats[side].xg+=0.78;
    const pSc=clamp(0.62+ (taker.attrs['Composure']||8)*0.017 + (taker.attrs['Finishing']||8)*0.012 - (gk?(gk.attrs['Reflexes']||8)*0.009:0),0.4,0.94);
    if(RND()<pSc){
      M.score[side]++; taker.goals++; M.stats[side].ontarget++;
      M.mrat[side][taker.id]=(M.mrat[side][taker.id]||6.5)+0.85;
      M.scorers.push({side,min,player:taker.id,name:shortName(taker),pen:true});
      push(say(CM.penScored,M,side,taker,null,gk),'goal',side);
    } else {
      M.mrat[side][taker.id]=(M.mrat[side][taker.id]||6.5)-0.7;
      if(gk)M.mrat[1-side][gk.id]=(M.mrat[1-side][gk.id]||6.5)+0.6;
      push(say(CM.penMissed,M,side,taker,null,gk),'big',side);
    }
  }

  // fouls & cards
  const fSide = RND()<0.5?0:1;
  const fouler=weightedPlayer(M,fSide,e=>Math.max(1,(e.p.attrs['Aggression']||10)+ (20-(e.p.attrs['Positioning']||10))));
  if(RND()< 0.175 + M.S[fSide].club.tactic.tackling*0.040){
    M.stats[fSide].fouls++;
    const pCard = 0.155 + M.S[fSide].club.tactic.tackling*0.045 + Math.max(0,M.S[fSide].disc)*0.004;
    if(RND()<pCard){
      const cur=M.cards[fSide][fouler.p.id]||0;
      if(cur===0 && RND()>0.045){
        M.cards[fSide][fouler.p.id]=1; M.stats[fSide].yellow++;
        M.mrat[fSide][fouler.p.id]=(M.mrat[fSide][fouler.p.id]||6.5)-0.25;
        push(say(CM.yellow,M,fSide,fouler.p),'card',fSide);
      } else {
        M.cards[fSide][fouler.p.id]=2; M.stats[fSide].red++;
        M.onPitch[fSide]=M.onPitch[fSide].filter(id=>id!==fouler.p.id);
        M.mrat[fSide][fouler.p.id]=(M.mrat[fSide][fouler.p.id]||6.5)-1.6;
        push(say(CM.red,M,fSide,fouler.p),'card',fSide);
        M.S[fSide].att*=0.8; M.S[fSide].mid*=0.82; M.S[fSide].def*=0.9;
        recalcAfterRed(M,fSide);
      }
    }
  }

  // injuries
  if(RND()<0.0032){
    const hurt=weightedPlayer(M,RND()<.5?0:1,e=>1);
    const s2 = M.onPitch[0].includes(hurt.p.id)?0:1;
    push(say(CM.inj,M,s2,hurt.p),'card',s2);
    hurt.p.__matchInj = rint(3,32);
    if(M.subsUsed[s2]<5) makeSub(M,s2,hurt.p.id,true);
    else { M.onPitch[s2]=M.onPitch[s2].filter(i=>i!==hurt.p.id) }
  }

  // AI substitutions
  [0,1].forEach(s=>{
    if(s===userSide(M) && !AUTO_SUBS) return;
    if(M.subsUsed[s]>=5) return;
    if(min<55) return;
    if(RND()<0.055) aiSub(M,s);
  });

  // half/full time
  if(min===45){ M.addedTime=rint(1,5); push(say(CM.half,M,0),'sys') }
  if(min===90){ M.addedTime=rint(2,7) }
}

function recalcAfterRed(M,side){ /* strengths already scaled */ }
function userSide(M){ return M.homeId===G.userClub?0 : M.awayId===G.userClub?1 : -1 }
let AUTO_SUBS = true;

function benchAvailable(M,side){
  const club=M.S[side].club;
  return (club.tactic.subs||[]).filter(id=>{
    const p=G.playerById.get(id);
    return p && !M.onPitch[side].includes(id) && !M.subsMade[side].includes(id) && !p.inj && !p.susp;
  });
}
function makeSub(M,side,offId,forced){
  const bench=benchAvailable(M,side);
  if(!bench.length){ M.onPitch[side]=M.onPitch[side].filter(i=>i!==offId); return null }
  const off=G.playerById.get(offId);
  const slotIdx=M.S[side].xi.findIndex(e=>e.p.id===offId);
  const slot = slotIdx>=0 ? M.S[side].xi[slotIdx].slot : 'MC';
  let best=null,bs=-1;
  for(const id of bench){
    const p=G.playerById.get(id);
    const sc=effAbility(p)*fit(p,slot);
    if(sc>bs){bs=sc;best=p}
  }
  if(!best) return null;
  M.onPitch[side]=M.onPitch[side].filter(i=>i!==offId);
  M.onPitch[side].push(best.id);
  M.subsMade[side].push(best.id); M.subsUsed[side]++;
  M.mrat[side][best.id]=6.5; M.mins[side][best.id]=0;
  if(slotIdx>=0) M.S[side].xi[slotIdx]={p:best,slot,y:M.S[side].xi[slotIdx].y,x:M.S[side].xi[slotIdx].x,
    role:M.S[side].club.tactic.roles[best.id]||(ROLE_BY_POS[slot]||['Player'])[0],fit:fit(best,slot)};
  const S=teamStrength(M.S[side].club, side===0);
  M.S[side].att=S.att*(M.onPitch[side].length/11); M.S[side].mid=S.mid; M.S[side].def=S.def;
  M.events.push({min:M.minute,txt:'Substitution, '+M.S[side].club.short+': '+shortName(best)+' replaces '+shortName(off)+(forced?' (injury)':''),cls:'sys',side});
  return best;
}
function aiSub(M,side){
  const on=M.onPitch[side].map(id=>G.playerById.get(id)).filter(Boolean);
  const tired=on.filter(p=>p.cond<64 && p.pos!=='GK').sort((a,b)=>a.cond-b.cond);
  if(!tired.length) return;
  makeSub(M,side,tired[0].id,false);
}

/* ---- finish a match --------------------------------------------------- */
function finaliseMatch(M){
  M.done=true;
  const [hs,as]=M.score;
  // ratings
  [0,1].forEach(s=>{
    const opp=1-s;
    Object.keys(M.mrat[s]).forEach(idS=>{
      const id=+idS; const p=G.playerById.get(id); if(!p)return;
      const mins=M.mins[s][id]||0; if(mins<1) return;
      let r=M.mrat[s][id];
      r += (M.score[s]-M.score[opp])*0.18;
      if(p.pos==='GK'||['DC','DR','DL'].includes(p.pos)){ if(M.score[opp]===0) r+=0.55; else r-=M.score[opp]*0.16 }
      r += (effAbility(p)/ (M.S[s].club.rep+40) -0.75)*0.6;
      r += gauss()*0.32;
      r = clamp(r, 3.0, 10);
      p.ratings.push(+r.toFixed(1)); p.form.push(+r.toFixed(1));
      if(p.form.length>10)p.form.shift();
      p.apps++;
      if(mins>=1 && (p.pos==='GK') && M.score[opp]===0) p.cleanSheets++;
      // sharpness & morale
      p.sharp=Math.min(100,p.sharp+ (mins>60?6:3));
      p.morale=clamp(p.morale + (M.score[s]>M.score[opp]?4:M.score[s]<M.score[opp]?-3:0) + (r-6.7)*2, 5, 100);
      // cards -> suspensions
      const c=M.cards[s][id]||0;
      if(c===1){p.yellow++; if(p.yellow%5===0){p.susp=1; addNews('discipline','Suspension','⚑ '+p.name+' has picked up his '+p.yellow+'th booking and misses the next match.',p.club)}}
      if(c===2){p.red++; p.susp=rint(1,3); p.yellow=0;
        addNews('discipline','Red card','⚑ '+p.name+' was sent off and will serve a '+p.susp+'-match ban.',p.club)}
      if(p.__matchInj){ applyInjury(p,p.__matchInj); p.__matchInj=null }
    });
  });
  // man of the match
  let mom=null,mb=-1;
  [0,1].forEach(s=>Object.keys(M.mrat[s]).forEach(id=>{
    const p=G.playerById.get(+id); if(!p||!p.ratings.length)return;
    const r=p.ratings[p.ratings.length-1];
    if(r>mb){mb=r;mom=p}
  }));
  if(mom){mom.mom++;M.mom=mom.id}
  M.stats[0].poss=Math.round(M.stats[0].poss/(M.stats[0].poss+M.stats[1].poss)*100)||50;
  M.stats[1].poss=100-M.stats[0].poss;
  return M;
}

function applyInjury(p,days){
  const types=[['Knock',1,4],['Bruised ribs',3,9],['Dead leg',3,8],['Hamstring strain',10,26],
    ['Groin strain',12,30],['Ankle sprain',14,40],['Twisted knee',20,60],['Calf strain',9,22],
    ['Torn hamstring',35,80],['Broken toe',20,45],['Concussion',7,14],['Shoulder injury',18,50],
    ['Cruciate ligament damage',150,290],['Metatarsal fracture',60,110],['Achilles injury',80,180]];
  let t;
  if(days<8) t=types[rint(0,3)];
  else if(days<25) t=types[rint(3,11)];
  else t=types[rint(8,14)];
  const dur=Math.max(days, rint(t[1],t[2]));
  p.inj={type:t[0],days:dur,total:dur};
  p.cond=Math.min(p.cond,55);
}

/* ---- fast sim for AI-vs-AI ------------------------------------------- */
function fastSim(homeId,awayId,comp){
  const H=G.clubs[homeId],A=G.clubs[awayId];
  [H,A].forEach(c=>{ if(c.id!==G.userClub) autoPick(c,c.tactic); });
  autoFillIfBroken(H); autoFillIfBroken(A);
  const S=[teamStrength(H,true),teamStrength(A,false)];
  const atk=[S[0].att,S[1].att], def=[S[0].def,S[1].def], mid=[S[0].mid,S[1].mid];
  const poss=mid[0]/(mid[0]+mid[1]);
  const xg=[0,0];
  for(let s=0;s<2;s++){
    const tilt=atk[s]/(atk[s]+def[1-s]);
    const share=s===0?poss:1-poss;
    xg[s]=clamp(1.17 + (tilt-0.5)*11 + (share-0.5)*0.9, 0.18, 4.4)
          * S[s].risk * (0.94+S[s].tempo*0.06) + (s===0?0.17:-0.10);
    xg[s]=Math.max(0.15,xg[s]);
  }
  const goals=[poisson(xg[0]),poisson(xg[1])];
  const M={comp,homeId,awayId,home:H,away:A,score:goals,fast:true,
    stats:[blankStats(),blankStats()],scorers:[],events:[],done:true,S};
  M.stats[0].poss=Math.round(poss*100);M.stats[1].poss=100-M.stats[0].poss;
  M.stats[0].xg=xg[0];M.stats[1].xg=xg[1];
  M.stats[0].shots=Math.round(xg[0]*7+rint(0,5));M.stats[1].shots=Math.round(xg[1]*7+rint(0,5));
  M.stats[0].ontarget=Math.round(M.stats[0].shots*0.38);M.stats[1].ontarget=Math.round(M.stats[1].shots*0.38);
  // attribute goals & minutes
  [0,1].forEach(s=>{
    const xi=S[s].xi;
    for(let g=0;g<goals[s];g++){
      let tot=0;const w=xi.map(e=>{const v=e.slot==='GK'?0:Math.pow(e.y/10,2.2)*(8+(e.p.attrs['Finishing']||6)+(e.p.attrs['Off the Ball']||6));tot+=v;return v});
      let r=RND()*tot,k=0;for(;k<xi.length;k++){r-=w[k];if(r<=0)break}
      const sc=xi[Math.min(k,xi.length-1)].p; sc.goals++;
      let asst=null;
      if(RND()<0.68){
        let t2=0;const w2=xi.map(e=>{const v=e.slot==='GK'?0.2:((e.p.attrs['Passing']||6)+(e.p.attrs['Vision']||6)+(e.p.attrs['Crossing']||6))*Math.pow(e.y/10,1.4);t2+=v;return v});
        let r2=RND()*t2,k2=0;for(;k2<xi.length;k2++){r2-=w2[k2];if(r2<=0)break}
        asst=xi[Math.min(k2,xi.length-1)].p; if(asst.id!==sc.id) asst.assists++; else asst=null;
      }
      M.scorers.push({side:s,min:rint(1,92),player:sc.id,name:shortName(sc),assist:asst?asst.id:null});
    }
    xi.forEach(e=>{
      const p=e.p; p.apps++;
      p.cond=Math.max(18,p.cond - (23+RND()*15));
      p.sharp=Math.min(100,p.sharp+5);
      const scored=M.scorers.filter(x=>x.side===s&&x.player===p.id).length;
      const setup=M.scorers.filter(x=>x.side===s&&x.assist===p.id).length;
      let r=6.35 + (goals[s]-goals[1-s])*0.20 + scored*1.0 + setup*0.5 + gauss()*0.5;
      r += (effAbility(p)/(S[s].club.rep+45)-0.72)*0.9;
      if(p.pos==='GK'){ if(goals[1-s]===0){r+=0.55;p.cleanSheets++} else r-=goals[1-s]*0.14 }
      if(['DC','DR','DL'].includes(p.pos)){ if(goals[1-s]===0)r+=0.35; else r-=goals[1-s]*0.10 }
      r=clamp(r,3.5,9.9);
      p.ratings.push(+r.toFixed(1));p.form.push(+r.toFixed(1));if(p.form.length>10)p.form.shift();
      p.morale=clamp(p.morale+(goals[s]>goals[1-s]?4:goals[s]<goals[1-s]?-3:0),5,100);
      if(RND()<0.10){p.yellow++;M.stats[s].yellow++;if(p.yellow%5===0)p.susp=1}
      if(RND()<0.006){p.red++;p.susp=rint(1,3);M.stats[s].red++}
      if(RND()<0.022) applyInjury(p,rint(3,40));
    });
    // bench players lose a little sharpness
    (S[s].club.tactic.subs||[]).forEach(id=>{const p=G.playerById.get(id);if(p&&RND()<0.4){p.cond=Math.max(30,p.cond-8)}});
  });
  return M;
}
function poisson(l){
  if(l<=0)return 0;
  let L=Math.exp(-l),k=0,p=1;
  do{k++;p*=RND()}while(p>L);
  return Math.min(k-1,9);
}
